<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="648" viewBox="0 0 480 648" role="img" aria-labelledby="t d">
<title id="t">Ce que chaque dispositif réduit dans l’échappement</title>
<desc id="d">Ligne d’échappement d’un engin diesel souterrain, en schéma : le moteur diesel, puis une zone de post-traitement en pointillé, puis la sortie des gaz. La zone reçoit un ou plusieurs dispositifs, selon l’engin. Trois fiches, sans ordre de montage, disent ce que chaque dispositif réduit. Le catalyseur d’oxydation (DOC) réduit le CO et les hydrocarbures, et modérément les particules. Le SCR réduit les NOx et demande de l’urée. Le filtre à particules (DPF) réduit les particules et demande un entretien régulier, avec régénération. Au bas de la fiche du DPF, un socle grisé rappelle sa base requise : un carburant à très faible teneur en soufre (ULSD).</desc>
<rect width="480" height="648" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Ce que chaque dispositif</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">réduit dans l’échappement</text>

<!-- Ligne d’échappement : moteur, zone de post-traitement, sortie -->
<rect x="24" y="104" width="116" height="64" rx="8" fill="#eceef0" stroke="#6e7781" stroke-width="2.5"/>
<text x="82" y="131" font-size="19" fill="#1f2328" text-anchor="middle">moteur</text>
<text x="82" y="155" font-size="19" fill="#1f2328" text-anchor="middle">diesel</text>
<rect x="140" y="128" width="26" height="16" fill="#eceef0" stroke="#6e7781" stroke-width="2.5"/>
<rect x="402" y="128" width="32" height="16" fill="#eceef0" stroke="#6e7781" stroke-width="2.5"/>
<path d="M434 122L456 136L434 150Z" fill="#6e7781"/>
<rect x="166" y="104" width="236" height="64" rx="12" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="284" y="143" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">post-traitement</text>

<text x="24" y="202" font-size="19" fill="#1f2328">Un ou plusieurs dispositifs, selon l’engin :</text>

<!-- Fiche DOC -->
<rect x="24" y="216" width="432" height="112" rx="12" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<path d="M32 240H40M84 240H92" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<rect x="40" y="228" width="44" height="24" rx="6" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5"/>
<text x="102" y="247" font-size="20" font-weight="700" fill="#1f2328">DOC</text>
<text x="162" y="247" font-size="19" fill="#1f2328">catalyseur d’oxydation</text>
<text x="40" y="280" font-size="19" fill="#4b535c">réduit :</text>
<rect x="118" y="260" width="44" height="28" rx="8" fill="#fde3e0" stroke="#c62828" stroke-width="2.5"/>
<text x="140" y="280" font-size="19" fill="#1f2328" text-anchor="middle">CO</text>
<rect x="170" y="260" width="153" height="28" rx="8" fill="#fde3e0" stroke="#c62828" stroke-width="2.5"/>
<text x="246.5" y="280" font-size="19" fill="#1f2328" text-anchor="middle">hydrocarbures</text>
<text x="40" y="314" font-size="19" fill="#4b535c">modérément :</text>
<rect x="184" y="294" width="110" height="28" rx="8" fill="#fde3e0" stroke="#c62828" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="239" y="314" font-size="19" fill="#1f2328" text-anchor="middle">particules</text>

<!-- Fiche SCR -->
<rect x="24" y="336" width="432" height="112" rx="12" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<path d="M32 360H40M84 360H92" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<rect x="40" y="348" width="44" height="24" rx="6" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5"/>
<text x="102" y="367" font-size="20" font-weight="700" fill="#1f2328">SCR</text>
<text x="40" y="400" font-size="19" fill="#4b535c">réduit :</text>
<rect x="118" y="380" width="56" height="28" rx="8" fill="#fde3e0" stroke="#c62828" stroke-width="2.5"/>
<text x="146" y="400" font-size="19" fill="#1f2328" text-anchor="middle">NOx</text>
<text x="40" y="434" font-size="19" fill="#4b535c">demande de l’urée</text>

<!-- Fiche DPF et son socle : le carburant -->
<rect x="24" y="456" width="432" height="172" rx="12" fill="#fbfaf6"/>
<path d="M24 568H456V616Q456 628 444 628H36Q24 628 24 616Z" fill="#eceef0"/>
<path d="M24 568H456" stroke="#6e7781" stroke-width="2.5"/>
<rect x="24" y="456" width="432" height="172" rx="12" fill="none" stroke="#6e7781" stroke-width="2.5"/>
<path d="M32 480H40M84 480H92" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<rect x="40" y="468" width="44" height="24" rx="6" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5"/>
<text x="102" y="487" font-size="20" font-weight="700" fill="#1f2328">DPF</text>
<text x="160" y="487" font-size="19" fill="#1f2328">filtre à particules</text>
<text x="40" y="520" font-size="19" fill="#4b535c">réduit :</text>
<rect x="118" y="500" width="110" height="28" rx="8" fill="#fde3e0" stroke="#c62828" stroke-width="2.5"/>
<text x="173" y="520" font-size="19" fill="#1f2328" text-anchor="middle">particules</text>
<text x="40" y="554" font-size="19" fill="#4b535c">entretien régulier (régénération)</text>
<text x="40" y="592" font-size="19" fill="#1f2328"><tspan font-weight="700">Base requise pour le DPF :</tspan> carburant</text>
<text x="40" y="616" font-size="19" fill="#1f2328">à très faible teneur en soufre (ULSD)</text>
</g>
</svg>
