<svg xmlns="http://www.w3.org/2000/svg" width="480" height="502" viewBox="0 0 480 502" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Mesure ou diagnostic ?</title><desc id="d">Titre : « Mesure ou diagnostic ? », sous-titre « Le résultat du questionnaire ». Infographie sur fond sombre. Section bleue « Mesure » (MBI) ; en tête : « Limite : le MBI est un instrument de mesure, pas un diagnostic ». « Le questionnaire » : Trois sous-scores ; Licence commerciale. « Confidentialité » : Renseignement de santé. Section verte « Diagnostic » (Différentiel) ; en tête : « Selon la page : un professionnel de santé est requis ». « Pour distinguer » : Burnout ; Dépression ; Trouble anxieux. « À savoir » : Le burnout n’est pas un diagnostic médical. En bas, « Repère rapide » : pour un usage organisationnel, des alternatives gratuites existent (Copenhagen Burnout Inventory).</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a24"/><stop offset="1" stop-color="#07121a"/></linearGradient><radialGradient id="h" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#15324a" stop-opacity="0.55"/><stop offset="1" stop-color="#15324a" stop-opacity="0"/></radialGradient><filter id="lueur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.4"/></filter></defs><rect width="480" height="502" fill="url(#f)"/><rect width="480" height="502" fill="url(#h)"/><text x="240.0" y="34.0" font-weight="900" font-size="25" fill="#ffffff" text-anchor="middle" letter-spacing="-0.3">Mesure ou