<text x="68" y="159" font-size="20" font-weight="700" fill="#1f2328">jour</text>
<circle cx="272" cy="152" r="12" fill="#4b535c"/><circle cx="278" cy="148" r="11" fill="#eceef0"/>
<text x="296" y="159" font-size="20" font-weight="700" fill="#1f2328">nuit</text>
<!-- Rangée A — page : rythme circadien, « le corps se prépare au sommeil » la nuit ; mélatonine alignée sur la période de sommeil -->
<text x="28" y="196" font-size="19" font-weight="700" fill="#1565c0">Horloge du corps</text>
<rect x="28" y="206" width="196" height="114" rx="8" fill="#e1ecfa"/>
<rect x="256" y="206" width="196" height="114" rx="8" fill="#e1ecfa"/>
