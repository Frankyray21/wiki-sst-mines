<text x="100" y="268" font-size="20" font-weight="700" fill="#1565c0">éveil</text>
<text x="268" y="234" font-size="20" font-weight="700" fill="#1565c0">sommeil,</text>
<text x="268" y="258" font-size="19" fill="#1565c0">mélatonine</text>
<rect x="300" y="276" width="6" height="36" rx="2" fill="#6e7781"/><rect x="306" y="296" width="120" height="10" rx="2" fill="#6e7781"/><rect x="420" y="306" width="5" height="6" fill="#6e7781"/><rect x="309" y="289" width="22" height="7" rx="3" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<g transform="translate(373 284) rotate(-90)"><circle cx="0" cy="-53" r="9" fill="#1f2328"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1f2328"/></g>
<g fill="#1565c0" font-weight="700"><text x="384" y="270" font-size="18">z</text><text x="402" y="256" font-size="20">z</text><text x="422" y="240" font-size="22">z</text></g>
<!-- Page : « le travail exige de la vigilance au moment où le corps se prépare au sommeil » -->
<text x="28" y="352" font-size="19" font-weight="700" fill="#c62828">Quart de nuit</text>
<path d="M196 333V349" stroke="#c62828" stroke-width="3.5"/><path d="M196 324L189 335H203Z" fill="#c62828"/><path d="M196 358L189 347H203Z" fill="#c62828"/>
