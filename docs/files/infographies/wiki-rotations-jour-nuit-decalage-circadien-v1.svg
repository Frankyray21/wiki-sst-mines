<g transform="translate(117 454) rotate(-90)"><circle cx="0" cy="-53" r="9" fill="#1f2328"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1f2328"/></g>
<g fill="#c62828" font-weight="700" font-size="19"><text x="120" y="444">z</text><text x="146" y="432">z</text></g><path d="M138 426L140 446M164 414L166 434" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<!-- Mineur au travail la nuit : « le travail exige de la vigilance » -->
<g transform="translate(290 482) rotate(0)"><circle cx="0" cy="-53" r="9" fill="#1f2328"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1f2328"/><g transform="translate(0 -57)"><path d="M-10.5 3C-10.5 -5.5 -5.5 -10.5 0 -10.5C5.5 -10.5 10.5 -5.5 10.5 3Z" fill="#1f2328"/><rect x="-14" y="2" width="28" height="4.5" rx="2.25" fill="#1f2328"/><rect x="-3.5" y="-6" width="7" height="6" rx="1" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/></g></g>
<path d="M301 420L320 412M301 424L320 424" stroke="#6e7781" stroke-width="2.5" stroke-linecap="round"/>
<text x="330" y="434" font-size="19" fill="#1f2328">au travail :</text>
<text x="330" y="458" font-size="20" font-weight="700" fill="#c62828">vigilance</text>
<text x="330" y="480" font-size="20" font-weight="700" fill="#c62828">exigée</text>
<!-- Page : « une latence d’endormissement accrue, un sommeil fragmenté et une insuffisance cumulée qui altèrent l’humeur et la régulation émotionnelle ». La question de l’adaptation (page contradictoire) n’est pas dessinée. -->
<text x="24" y="540" font-size="20" font-weight="700" fill="#c62828">Insuffisance cumulée de sommeil</text>
<text x="24" y="568" font-size="19" fill="#1f2328">→ humeur et régulation</text>
<text x="24" y="592" font-size="19" fill="#1f2328">émotionnelle altérées</text>
</g>
</svg>
