<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="614" viewBox="0 0 480 614" role="img" aria-labelledby="t d">
<title id="t">Quart de nuit : l’horloge du corps et l’horaire de travail en conflit</title>
<desc id="d">Schéma en deux colonnes, le jour (soleil) à gauche et la nuit (lune, fond gris) à droite, et deux rangées. Rangée du haut, en bleu, l’horloge du corps : le jour, éveil (personne debout) ; la nuit, sommeil et mélatonine (personne couchée). Rangée du bas, en rouge, le quart de nuit : le jour, sommeil de jour fractionné (personne couchée sous le soleil) ; la nuit, au travail, vigilance exigée (mineur casqué debout). Des flèches rouges entre les deux rangées marquent le conflit. En bas : une insuffisance cumulée de sommeil, qui altère l’humeur et la régulation émotionnelle. Aucune heure ni durée.</desc>
<rect width="480" height="614" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Quart de nuit : le corps</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">et l’horaire en conflit</text>
<text x="24" y="108" font-size="19" fill="#4b535c">Désynchronisation circadienne</text>
<!-- Colonnes jour / nuit -->
<rect x="16" y="122" width="220" height="382" rx="12" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<rect x="244" y="122" width="220" height="382" rx="12" fill="#eceef0"/>
