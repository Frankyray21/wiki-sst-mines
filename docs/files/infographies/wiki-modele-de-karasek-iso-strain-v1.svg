<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="t d">
<title id="t">Quand le soutien manque : l’iso-strain</title>
<desc id="d">Le soutien social comme troisième dimension : deux lignes comparent le même job strain avec un soutien au travail fort, puis faible. En haut, « Job strain + fort soutien » (collègues, supérieur : aide, écoute) : deux personnes posent la main sur l’épaule du travailleur ; flèche vers un encadré rose : c’est encore du job strain, qui reste à risque. En bas, « Job strain + faible soutien » (aide limitée, manque d’écoute) : les mêmes personnes, un peu à l’écart, sans geste d’aide ; flèche vers un encadré rouge : l’iso-strain, la configuration la plus à risque. Encadré « En contexte FIFO ou camp éloigné » : le soutien externe (famille, communauté) est temporairement coupé ; si le soutien au travail manque aussi, un job strain peut basculer en iso-strain. Mention : un risque statistique, pas un diagnostic.</desc>
<rect width="480" height="650" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Quand le soutien manque :</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">l’iso-strain</text>
<!-- A : job strain + soutien fort (collègues, supérieur) : c’est encore du job strain, zone à risque (page : « la zone la plus à risque ») -->
<text x="24" y="116" font-size="20" font-weight="700" fill="#1f2328">Job strain + fort soutien</text>
<text x="24" y="140" font-size="19" fill="#4b535c">collègues, supérieur : aide, écoute</text>
