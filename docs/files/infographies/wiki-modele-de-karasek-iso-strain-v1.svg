<text x="341" y="333" font-size="20" font-weight="700" fill="#fbfaf6" text-anchor="middle">Iso-strain</text>
<text x="341" y="359" font-size="19" fill="#fbfaf6" text-anchor="middle">configuration</text>
<text x="341" y="383" font-size="19" fill="#fbfaf6" text-anchor="middle">la plus à risque</text>
<!-- Exemple minier : camp FIFO ou éloigné (suit la page sourcée « Iso-strain - Ce que ça signifie ») -->
<rect x="24" y="424" width="432" height="146" rx="10" fill="none" stroke="#6e7781" stroke-width="2.5"/>
<text x="40" y="452" font-size="20" font-weight="700" fill="#1f2328">En contexte FIFO ou camp éloigné</text>
<text x="40" y="480" font-size="19" fill="#1f2328">Le soutien externe (famille, communauté)</text>
<text x="40" y="504" font-size="19" fill="#1f2328">est temporairement coupé.</text>
<text x="40" y="534" font-size="19" fill="#1f2328">Si le <tspan font-weight="700">soutien au travail</tspan> manque aussi,</text>
<text x="40" y="558" font-size="19" fill="#1f2328">un job strain peut basculer en iso-strain.</text>
<text x="24" y="602" font-size="19" fill="#4b535c">Un risque statistique,</text>
<text x="24" y="626" font-size="19" fill="#4b535c">pas un diagnostic.</text>
