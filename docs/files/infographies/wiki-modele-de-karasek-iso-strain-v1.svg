<text x="341" y="214" font-size="19" fill="#1f2328" text-anchor="middle">reste à risque</text>
<!-- B : job strain + soutien faible = iso-strain ; « la plus à risque » plutôt que « la plus dommageable » : des associations, pas une causalité démontrée -->
<text x="24" y="268" font-size="20" font-weight="700" fill="#1f2328">Job strain + faible soutien</text>
<text x="24" y="292" font-size="19" fill="#4b535c">aide limitée, manque d’écoute</text>
