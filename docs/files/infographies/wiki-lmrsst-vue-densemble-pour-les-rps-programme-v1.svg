<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="580" viewBox="0 0 480 580" role="img" aria-labelledby="t d">
<title id="t">Un risque parmi les autres, dans le programme de prévention</title>
<desc id="d">En haut, un cadre gris, « risques pouvant affecter la santé », réunit cinq pastilles : chimiques (une fiole), biologiques (un germe), physiques (des ondes), ergonomiques (une personne penchée qui soulève une caisse) et, en dessous, au centre, surlignée en rouge : psychosociaux liés au travail (une tête de profil). Une flèche bleue descend du cadre vers un classeur bleu, « programme de prévention ». Dans le classeur, trois pastilles bleues reliées par des flèches, de gauche à droite : une loupe, « identification et analyse » ; un calendrier coché, « mesures et échéanciers » ; un œil, « suivi ». Aucune durée ni aucun ordre de priorité entre les risques : le rouge signale le sujet de la page.</desc>
