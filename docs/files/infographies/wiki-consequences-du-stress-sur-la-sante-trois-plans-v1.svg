<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Conséquences sur trois plans</text>
<text x="24" y="76" font-size="19" fill="#4b535c">Stress chronique au travail</text>

