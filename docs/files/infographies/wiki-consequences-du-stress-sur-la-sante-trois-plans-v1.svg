<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Conséquences sur trois plans : stress chronique au travail</title>
<desc id="d">Silhouette de mineur casqué, debout, vue de face ; à droite, les trois plans que nomme la page, en rouge, chacun relié à sa place sur le corps ou à côté. Psychologique : la tête, teintée de rouge, porte un trait emmêlé ; mots de la page : dépression, anxiété, burnout, TSPT. Physique : six systèmes, sur le corps ou à côté, reliés à leur nom : des microbes près de l’épaule (immunitaire), un cœur sur la poitrine (cardiovasculaire), l’estomac sous le cœur (digestif), la colonne vertébrale, rouge au cou et au bas du dos (musculosquelettique), un ruban gradué autour de la taille (métabolique), les symboles féminin et masculin au bas-ventre (reproductif). Comportemental : trois dessins à côté des jambes, une bouteille et un verre (consommation), un lit sous la lune (sommeil), un véhicule et un choc rouge (accidents). Schéma de principe, sans chiffre.</desc>
