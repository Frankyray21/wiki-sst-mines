<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Le MBI : trois dimensions</title><desc id="d">Titre : « Le MBI : trois dimensions », sous-titre « Maslach Burnout Inventory ». Infographie sur fond sombre. En haut, trois cartes à pictogramme blanc : « Épuisement émotionnel », sentiment d’être vidé ; « Dépersonnalisation (cynisme) », distance, désengagement ; « Accomplissement personnel », sentiment d’efficacité. Section « Interprétation » (MBI) ; en tête : « Selon la page : trois sous-scores comparés aux normes par secteur ». « Sous-scores » : Un par dimension ; Pas de score total. « Burnout » : Épuisement élevé ; Cynisme élevé ; Accomplissement bas. En bas, « Repère rapide » : l’OMS a inscrit le burnout en 2019 dans la CIM-11 comme « phénomène lié au travail ».</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a24"/><stop offset="1" stop-color="#07121a"/></linearGradient><radialGradient id="h" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#15324a" stop-opacity="0.55"/><stop offset="1" stop-color="#15324a" stop-opacity="0"/></radialGradient></defs><rect width="480" height="460" fill="url(#f)"/><rect width="480" height="460" fill="url(#h)"/><text x="240.0" y="34.0" font-weight="900" font-size="25" fill="#ffffff" text-anchor="middle" letter-spacing="-0.3">Le MBI : trois dimensions</text><text x="240.0" y="53.0" font-weight="700" font-size="14" fill="#9fb0bf" text-anchor="middle">Mas