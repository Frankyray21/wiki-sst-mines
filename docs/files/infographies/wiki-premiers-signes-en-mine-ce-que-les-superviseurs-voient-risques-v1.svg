<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Comportements à risque</title>
<desc id="d">Dans chaque rangée, la case grise à gauche montre la situation « d’habitude », la case encadrée à droite, après une flèche, la situation « maintenant » ; l’étiquette au-dessus reprend les mots exacts du tableau de la page. Ici, les cases « maintenant » sont en rouge. Prise de risques inhabituelle : d’habitude, le travailleur reste hors de la zone sous une charge suspendue (pointillés) ; maintenant, il se tient dessous (« Élevé, signal grave », dit la page). Désengagement des consignes de sécurité : d’habitude, il s’arrête devant la barrière ; maintenant, il la franchit (flèche rouge en pointillé), ce que la page juge très préoccupant. Conduite imprudente d’équipement : d’habitude, le véhicule est à distance du piéton ; maintenant, il arrive vite (traits rouges) tout près de lui (signal d’alerte majeur). En bas, dans un cadre rouge, le quatrième signal du tableau, sans illustration : « Propos suicidaires ou inquiétants évoquant la mort » — « Demander une aide professionnelle sans attendre ; services d’urgence si danger immédiat ».</desc>
