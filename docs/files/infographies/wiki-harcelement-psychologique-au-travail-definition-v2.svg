<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="656" viewBox="0 0 480 656" role="img" aria-labelledby="t d">
<title id="t">Ce que la loi appelle harcèlement psychologique</title>
<desc id="d">Deux voies faites de pièces de puzzle qui s’emboîtent, de haut en bas, mènent chacune par une flèche au bandeau rouge « harcèlement psychologique ». Voie de gauche : une conduite vexatoire faite de comportements, paroles, actes ou gestes répétés (plusieurs petites flèches rouges qui frappent un axe du temps ; l’article n’en fixe pas le nombre), qui sont hostiles ou non désirés, y compris à caractère sexuel ; puis l’atteinte à la dignité ou à l’intégrité psychologique ou physique (une personne marquée d’une fissure rouge) ; puis un milieu de travail néfaste (la personne dans une galerie teintée de rouge). Voie de droite, séparée de la première par « ou » : une seule conduite grave (une grosse flèche rouge sur l’axe du temps) ; la même pièce d’atteinte, commune aux deux voies ; puis un effet nocif continu (après la flèche, l’axe du temps reste rouge). Dans chaque voie, toutes les pièces sont réunies. D’après la Loi sur les normes du travail, art. 81.18.</desc>
<rect width="480" height="656" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Ce que la loi appelle</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">harcèlement psychologique</text>
<text x="24" y="108" font-size="19" fill="#4b535c">Loi sur les normes du travail, art. 81.18</text>

<!-- Pièces de puzzle : dans chaque voie, les pièces s’emboîtent ; toutes sont requises -->
<path d="M34 124H240A10 10 0 0 1 250 134V296A10 10 0 0 1 240 306H151A14 14 0 0 1 123 306H34A10 10 0 0 1 24 296V134A10 10 0 0 1 34 124Z" fill="#eceef0" stroke="#6e7781" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M280 124H446A10 10 0 0 1 456 134V296A10 10 0 0 1 446 306H377A14 14 0 0 1 349 306H280A10 10 0 0 1 270 296V134A10 10 0 0 1 280 124Z" fill="#eceef0" stroke="#6e7781" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M34 314H116.51A22 22 0 0 0 157.49 314H342.51A22 22 0 0 0 383.49 314H446A10 10 0 0 1 456 324V396A10 10 0 0 1 446 406H377A14 14 0 0 1 349 406H151A14 14 0 0 1 123 406H34A10 10 0 0 1 24 396V324A10 10 0 0 1 34 314Z" fill="#eceef0" stroke="#6e7781" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M34 414H116.51A22 22 0 0 0 157.49 414H240A10 10 0 0 1 250 424V542A10 10 0 0 1 240 552H34A10 10 0 0 1 24 542V424A10 10 0 0 1 34 414Z" fill="#eceef0" stroke="#6e7781" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M280 414H342.51A22 22 0 0 0 383.49 414H446A10 10 0 0 1 456 424V542A10 10 0 0 1 446 552H280A10 10 0 0 1 270 542V424A10 10 0 0 1 280 414Z" fill="#eceef0" stroke="#6e7781" stroke-width="2.5" stroke-linejoin="round"/>

