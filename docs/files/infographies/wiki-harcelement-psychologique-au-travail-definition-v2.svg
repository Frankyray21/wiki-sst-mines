</g>
<text x="108" y="346" font-size="19" font-weight="700" fill="#1f2328">atteinte à la dignité</text>
<text x="108" y="370" font-size="19" font-weight="700" fill="#1f2328">ou à l’intégrité</text>
<text x="108" y="394" font-size="19" fill="#4b535c">psychologique ou physique</text>

<!-- 1er alinéa : entraîne, pour la personne, un milieu de travail néfaste -->
<path d="M97 494V464A40 32 0 0 1 177 464V494Z" fill="#fde3e0" stroke="#c62828" stroke-width="2.5" stroke-linejoin="round"/>
