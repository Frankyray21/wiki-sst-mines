<text x="137" y="266" font-size="19" fill="#4b535c" text-anchor="middle">y compris à</text>
<text x="137" y="290" font-size="19" fill="#4b535c" text-anchor="middle">caractère sexuel</text>

<!-- 2e alinéa : une seule conduite grave -->
<text x="363" y="154" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle">conduite grave</text>
<path d="M282 264H330" stroke="#6e7781" stroke-width="3"/>
<path d="M330 257L343 264L330 271Z" fill="#6e7781"/>
<path d="M308 174V229" stroke="#c62828" stroke-width="18"/>
<path d="M284 227L332 227L308 261Z" fill="#c62828"/>
