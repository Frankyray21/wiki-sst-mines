<svg xmlns="http://www.w3.org/2000/svg" width="480" height="624" viewBox="0 0 480 624" role="img" aria-labelledby="t d">
<title id="t">Pourquoi critique en mine : cinq conséquences préoccupantes</title>
<desc id="d">Cinq rangées, dans l’ordre du tableau de la page ; à gauche un dessin, à droite la conséquence en gras et la raison pour laquelle la page la juge critique en mine, presque mot pour mot. Baisse de vigilance : un mineur qui tourne le dos à une chargeuse qui avance vers lui (flèche rouge en pointillé) ; risque direct d’accident. Troubles du sommeil : un dormeur agité (trait rouge au-dessus de la tête) et une horloge entourée d’une flèche circulaire ; amplifiés par les quarts longs et la rotation. Consommation de substances : un bâtiment de camp, une bouteille et un verre ; stigmatisée mais répandue, particulièrement en camp. Conflits familiaux : un proche devant la maison et le mineur casqué plus loin, une double flèche en pointillé entre eux et un éclat rouge au-dessus ; aggravés par les rotations et l’éloignement. Maladies cardiovasculaires : un mineur au cœur rouge dans la poussière ; cumul avec exposition physique et chimique. Sans chiffre ni classement.</desc>
<rect width="480" height="624" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Pourquoi critique en mine</text>

