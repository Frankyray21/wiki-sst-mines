<svg xmlns="http://www.w3.org/2000/svg" width="480" height="352" viewBox="0 0 480 352" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">ALARP : trois zones</title><desc id="d">Titre : « ALARP : trois zones », sous-titre « As Low As Reasonably Practicable ». Figure sur fond noir. Un triangle pointe en bas, en trois bandes, chacune de sa couleur, nommée sur la bande : en haut, en rose, « Intolérable » : à corriger sauf circonstances exceptionnelles ; au milieu, en ambre, « Zone ALARP » : réduire si raisonnablement possible ; en bas, en vert, « Largement acceptable » : pas d’action requise. En bas : évaluer, c’est porter un jugement : le risque est-il tolérable ?</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="350.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">ALARP : trois zones</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">As Low As Reasonably Practicable</text><polygon points="20.0,82.0 270.0,82.0 240.0,152.0 50.0,152.0" fill="#f9a1a5" stroke="#16181d" stroke-width="2.5" stroke-linejoin="round" fill-opacity="0.28"/><text x="145.0" y="122.0" font-weight="800" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Intolérable</text><rect x="288.0" y="97.0" width="6" height="40" rx="3" fill="#f9a1a5"/><text x="304.0" y="114.0" font-weight="600" font-size="12.5" fill="#b6c2d1">à corriger sauf</text><text x="304.0" y="130.0" font-weight="600" font-size="12.5" fill="#b6c2d1">circonstances</text><text x="304.0" y="146.0" font-weight="600" font-size="12.5" fill="#b6c2d1">exceptionnelles</text><polygon points="50.0,152.0 240.0,152.0 210.0,222.0 80.0,222.0" fill="#fbb843" stroke="#16181d" stroke-width="2.5" stroke-linejoin="round" fill-opacity="0.28"/><text x="145.0" y="192.0" font-weight="800" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Zone ALARP</text><rect x="288.0" y="167.0" width="6" height="40" rx="3" fill="#fbb843"/><text x="304.0" y="184.0" font-weight="600" font-size="12.5" fill="#b6c2d1">réduire si raisonnablement</text><text x="304.0" y="200.0" font-weight="600" font-size="12.5" fill="#b6c2d1">possible</text><polygon points="80.0,222.0 210.0,222.0 180.0,292.0 110.0,292.0" fill="#75fcc6" stroke="#16181d" stroke-width="2.5" stroke-linejoin="round" fill-opacity="0.28"/><text x="145.0" y="262.0" font-weight="800" font-size="12.5" fill="#f2f6fa" text-anchor="middle">Largement acceptable</text><rect x="288.0" y="237.0" width="6" height="40" rx="3" fill="#75fcc6"/><text x="304.0" y="254.0" font-weight="600" font-size="12.5" fill="#b6c2d1">pas d’action requise</text><rect x="14.0" y="308.0" width="452.0" height="30.0" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="26" y="327.0" font-size="12.5"><tspan font-weight="800" fill="#f2f6fa">Évaluer</tspan><tspan font-weight="500" fill="#b6c2d1"> — porter un jugement : le risque est-il tolérable ?</tspan></text></svg>