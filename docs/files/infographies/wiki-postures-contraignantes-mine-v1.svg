<path d="M9.9 -23L-14 -20.5" stroke="#6e7781" stroke-width="10"/>
<path d="M-14 -20.5L-1.3 -44.4" stroke="#6e7781" stroke-width="15"/>
<path d="M-1.3 -44.4L12.1 -57.8" stroke="#6e7781" stroke-width="7"/>
<circle cx="12.1" cy="-57.8" r="9" fill="#6e7781"/>
<path d="M-1.3 -44.4L14.1 -37.2L29.8 -34.4" stroke="#fbfaf6" stroke-width="11.5"/>
<path d="M-1.3 -44.4L14.1 -37.2L29.8 -34.4" stroke="#6e7781" stroke-width="7.5"/>
<path d="M-14 -20.5L-1.3 -44.4" stroke="#c62828" stroke-width="12"/>
<circle cx="-14" cy="-20.5" r="6.5" fill="#c62828" stroke="#fbfaf6" stroke-width="2.5"/>
<circle cx="9.9" cy="-23" r="6.5" fill="#c62828" stroke="#fbfaf6" stroke-width="2.5"/>
</g>
<text x="128" y="203" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle">Accroupie</text>
<text x="128" y="225" font-size="19" fill="#4b535c" text-anchor="middle">pose de tirants</text>

