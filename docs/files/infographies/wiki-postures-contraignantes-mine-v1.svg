<path d="M25 -59.5L16 -55.5L24 -48.5Z" fill="#1f2328"/>
</g>
<text x="352" y="375" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle">Tronc en torsion</text>
<text x="352" y="397" font-size="19" fill="#4b535c" text-anchor="middle">manutention</text>
<text x="352" y="419" font-size="19" fill="#4b535c" text-anchor="middle">asymétrique</text>

