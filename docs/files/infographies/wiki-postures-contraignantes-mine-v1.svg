<path d="M-2.4 -46.3L11 -48.2" stroke="#c62828" stroke-width="12"/>
</g>
<text x="352" y="203" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle">Tronc en flexion</text>
<text x="352" y="225" font-size="19" fill="#4b535c" text-anchor="middle">manutention au sol</text>

