<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="652" viewBox="0 0 480 652" role="img" aria-labelledby="t d">
<title id="t">Postures à risque en mine</title>
<desc id="d">Planche de six silhouettes simples, en deux colonnes de trois, une par posture contraignante courante en mine ; la région touchée est en rouge. Colonne de gauche : accroupie (genoux, hanches et dos en rouge), pour la pose de tirants ; à genoux sous un toit bas (genoux en rouge), pour le boulonnage en chantier bas ; bras au-dessus de la tête, un outil tenu contre le toit (épaule et cou en rouge), pour le forage de toit. Colonne de droite : tronc en flexion vers une charge posée au sol (bas du dos en rouge), pour la manutention au sol ; tronc en torsion, pieds de face et charge tenue sur le côté (bas du dos en rouge), pour la manutention asymétrique ; cou en hyperextension, regard vers le haut (cou en rouge), pour la surveillance en hauteur.</desc>
<rect width="480" height="652" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Postures à risque en mine</text>
<rect x="24" y="63" width="18" height="18" rx="3" fill="#c62828"/>
<text x="50" y="78" font-size="19" fill="#4b535c">en rouge : la région touchée</text>

