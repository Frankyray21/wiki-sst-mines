<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Soutien social au travail : qui aide, et comment</title>
<desc id="d">À gauche, deux sources de soutien. En haut, le supérieur, casqué, avec une planchette : ses traits bleus mènent à trois flèches, une par forme d’aide du tableau de la page : opérationnelle (icône de clé : ressource, outil, renfort), informationnelle (bulle : consigne claire, conseil pertinent) et émotionnelle (oreille : écoute respectueuse). En bas, deux collègues casqués : une flèche bleue « coopération » (partage d’expérience, entraide, discuter du travail). Toutes les flèches aboutissent à droite à un travailleur casqué qui lève la main, une bulle « ? » au-dessus de la tête : il demande de l’aide. En bas, la question de repérage proposée : lorsqu’une personne demande de l’aide, reçoit-elle une réponse utilisable ? Un nom dans un organigramme n’y répond pas, à lui seul.</desc>
