<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="648" viewBox="0 0 480 648" role="img" aria-labelledby="t d">
<title id="t">Document et participation, selon l’effectif de l’établissement</title>
<desc id="d">Deux bandes superposées, une par situation générale, l’effectif étant compté par établissement, au cours de l’année. En haut, un établissement d’au moins 20 travailleurs, figuré par une rangée de sept mineurs casqués : à gauche, un gros classeur bleu, « programme de prévention » ; sur sa couverture, un bandeau rouge « risques psychosociaux », et dessous : « identification et analyse ». Au milieu, trois mineurs debout derrière une table, « comité SST » ; à droite, un mineur en gilet bleu, « représentant en SST ». En bas, un établissement de moins de 20 travailleurs, figuré par trois mineurs : une feuille bleue, « plan d’action », portant le même bandeau rouge « risques psychosociaux », avec la seule mention « identification » ; à droite, un mineur en gilet bleu, « agent de liaison ». Entre les deux bandes, deux flèches bleues en pointillés montent du bas vers le haut, « cas particuliers » : l’une va de la feuille « plan d’action » vers le classeur « programme de prévention », l’autre de l’agent de liaison vers le représentant en SST. Le nombre de silhouettes dessinées n’est pas un effectif.</desc>
<rect width="480" height="648" fill="#fbfaf6"/>
