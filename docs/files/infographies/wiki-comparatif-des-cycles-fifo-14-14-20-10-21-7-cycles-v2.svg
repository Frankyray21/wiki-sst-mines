<svg xmlns="http://www.w3.org/2000/svg" width="480" height="514" viewBox="0 0 480 514" role="img" aria-labelledby="t d">
<title id="t">Trois cycles FIFO, jour par jour : au site ou à la maison</title>
<desc id="d">Trois bandes-calendrier alignées sur le même axe de jours, une par cycle, avec une case par jour, les cases groupées par semaine. Légende : case foncée et casque de chantier, un jour au site ; case claire bordée de bleu et maison, un jour à la maison. 14/14 : 14 jours au site, puis 14 jours à la maison. 20/10 : 20 jours au site, puis 10 jours à la maison. 21/7 : 21 jours au site, puis 7 jours à la maison. Les bandes du 14/14 et du 21/7 ont la même longueur ; celle du 20/10 est un peu plus longue.</desc>
<rect width="480" height="514" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Trois cycles FIFO,</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">jour par jour</text>
<rect x="24" y="100" width="11.9" height="27" rx="2" fill="#4b535c"/>
<g transform="translate(56 112)"><path d="M-10.5 3C-10.5 -5.5 -5.5 -10.5 0 -10.5C5.5 -10.5 10.5 -5.5 10.5 3Z" fill="#4b535c"/><rect x="-14.5" y="2.5" width="29" height="4.5" rx="2.25" fill="#4b535c"/><path d="M-2.6 -9.6V2.6M2.6 -9.6V2.6" stroke="#fbfaf6" stroke-width="2.5"/></g>
<text x="77" y="120" font-size="19" fill="#1f2328">jour au site</text>
<rect x="219.25" y="101.25" width="9.4" height="24.5" rx="1.5" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5"/>
<g transform="translate(249 113)"><path d="M-12.5 -0.5L0 -12L12.5 -0.5Z" fill="#1565c0" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round"/><rect x="-9" y="-2" width="18" height="13" fill="#1565c0"/><rect x="-2.75" y="3.5" width="5.5" height="7.5" fill="#fbfaf6"/></g>
<text x="270" y="120" font-size="19" fill="#1565c0">jour à la maison</text>
