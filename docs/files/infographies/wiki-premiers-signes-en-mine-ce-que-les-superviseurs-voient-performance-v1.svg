<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" role="img" aria-labelledby="t d">
<title id="t">Performance et travail</title>
<desc id="d">Dans chaque rangée, la case grise à gauche montre la situation « d’habitude », la case encadrée à droite, après une flèche, la situation « maintenant » ; l’étiquette au-dessus reprend les mots exacts du tableau de la page. Erreurs nouvelles ou répétées : la liste de tâches du travailleur, toutes cochées d’habitude, porte maintenant deux croix rouges (surtout si la personne avait un bon historique, dit la page). Oublis de procédures de sécurité : d’habitude, un cadenas est posé sur le levier du boîtier électrique ; maintenant, il manque (contour rouge en pointillé, point d’interrogation). La page juge ce signal « Élevé, à intervenir rapidement ». Lenteur d’exécution : à la même heure (même horloge, sans chiffres), le wagonnet est plein d’habitude, à peine rempli maintenant ; la comparaison se fait avec son rythme habituel.</desc>
