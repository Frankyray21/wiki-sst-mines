<svg xmlns="http://www.w3.org/2000/svg" width="480" height="456" viewBox="0 0 480 456" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Hiérarchie des moyens de prévention</title><desc id="d">Titre : « Hiérarchie des moyens de prévention », sous-titre « Du plus efficace au moins efficace ». Figure sur fond noir. Une pyramide inversée de cinq niveaux, du plus efficace en haut au moins efficace en bas : élimination du danger ; substitution (produit, procédé, équipement) ; ingénierie (encoffrement, ventilation locale) ; administratif (rotation, formation, procédures) ; EPI (dernière barrière). Une flèche descend de « Plus efficace » à « Moins efficace ». En bas, principe directeur : LSST art. 2, élimination à la source ; art. 3, les EPI ne diminuent en rien l’obligation d’éliminer à la source.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="454.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">Hiérarchie des moyens de prévention</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Du plus efficace au moins efficace</text><text x="22.0" y="84.0" font-weight="700" font-size="12" fill="#b6c2d1">Plus efficace</text><polygon points="50.0,92.0 458.0,92.0 432.2,146.0 75.8,146.0" fill="#3a404a" stroke="#16181d" stroke-width="2" stroke-linejoin="round"/><text x="254.0" y="124.0" font-weight="800" font-size="15" fill="#f2f6fa" text-anchor="middle">Élimination du danger</text><polygon points="75.8,146.0 432.2,146.0 406.4,200.0 101.6,200.0" fill="#343941" stroke="#16181d" stroke-width="2" stroke-linejoin="round"/><text x="254.0" y="170.0" font-weight="800" font-size="15" fill="#f2f6fa" text-anchor="middle">Substitution</text><text x="254.0" y="187.0" font-weight="500" font-size="12" fill="#b6c2d1" text-anchor="middle">produit, procédé, équipement</text><polygon points="101.6,200.0 406.4,200.0 380.6,254.0 127.4,254.0" fill="#2e3239" stroke="#16181d" stroke-width="2" stroke-linejoin="round"/><text x="254.0" y="224.0" font-weight="800" font-size="15" fill="#f2f6fa" text-anchor="middle">Ingénierie</text><text x="254.0" y="241.0" font-weight="500" font-size="12" fill="#b6c2d1" text-anchor="middle">encoffrement, ventilation locale</text><polygon points="127.4,254.0 380.6,254.0 354.8,308.0 153.2,308.0" fill="#282c32" stroke="#16181d" stroke-width="2" stroke-linejoin="round"/><text x="254.0" y="278.0" font-weight="800" font-size="15" fill="#f2f6fa" text-anchor="middle">Administratif</text><text x="254.0" y="295.0" font-weight="500" font-size="12" fill="#b6c2d1" text-anchor="middle">rotation, formation, procédures</text><polygon points="153.2,308.0 354.8,308.0 329.0,362.0 179.0,362.0" fill="#23262d" stroke="#16181d" stroke-width="2" stroke-linejoin="round"/><text x="254.0" y="332.0" font-weight="800" font-size="15" fill="#f2f6fa" text-anchor="middle">EPI</text><text x="254.0" y="349.0" font-weight="500" font-size="12" fill="#b6c2d1" text-anchor="middle">dernière barrière</text><line x1="28.0" y1="92.0" x2="28.0" y2="354.0" stroke="#8b939c" stroke-width="2.4" stroke-linecap="round"/><polygon points="28.0,362.0 23.3,353.2 32.7,353.2" fill="#8b939c"/><text x="22.0" y="382.0" font-weight="700" font-size="12" fill="#b6c2d1">Moins efficace</text><rect x="14.0" y="396.0" width="452.0" height="46.0" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="26" y="415.0" font-size="12.5"><tspan font-weight="800" fill="#f2f6fa">Principe directeur</tspan><tspan font-weight="500" fill="#b6c2d1"> — LSST art. 2 : élimination à la source ; art. 3 : les EPI ne</tspan></text><text x="26.0" y="431.0" font-weight="500" font-size="12.5" fill="#b6c2d1">diminuent en rien l’obligation d’éliminer à la source.</text></svg>