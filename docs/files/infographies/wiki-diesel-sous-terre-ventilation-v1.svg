<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" role="img" aria-labelledby="t d">
<title id="t">Diluer l’échappement là où l’on respire</title>
<desc id="d">Vue de haut d’un chantier en cul-de-sac branché sur une galerie. Dans la galerie, à gauche, descend l’air primaire, de l’air frais venu de la surface (flèches bleues). À l’entrée du chantier, un ventilateur auxiliaire prend cet air et le pousse dans une conduite jusqu’au front, au fond du chantier. Près du front travaille un engin diesel, une chargeuse vue de haut. Ses gaz d’échappement, des points rouges serrés à la sortie, s’espacent en repartant avec l’air vers la galerie (flèche grise) : ils se diluent. Un travailleur se tient sur ce trajet ; un demi-disque pointillé devant son visage marque sa zone respiratoire, où il ne reste que peu de points. Un capteur dans le chantier est relié au ventilateur auxiliaire par un câble pointillé marqué « ventilation à la demande ». En bas, l’air chargé d’échappement rejoint la galerie en aval de la prise du ventilateur et s’en va.</desc>
<defs>
<linearGradient id="panache" gradientUnits="userSpaceOnUse" x1="294" y1="0" x2="100" y2="0"><stop offset="0" stop-color="#fde3e0"/><stop offset="1" stop-color="#fde3e0" stop-opacity="0.15"/></linearGradient>
</defs>
<rect width="480" height="540" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Diluer l’échappement</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">là où l’on respire</text>
<text x="24" y="108" font-size="19" fill="#4b535c">Chantier en cul-de-sac, vu de haut</text>

<!-- Roc, galerie d’air primaire, chantier en cul-de-sac -->
<rect x="24" y="126" width="432" height="390" fill="#eceef0"/>
<rect x="40" y="126" width="60" height="390" fill="#fbfaf6"/>
<path d="M98 262H436L446 280L438 300L450 322L440 344L452 366L442 386L448 408H98Z" fill="#fbfaf6"/>
<!-- Panache d’échappement qui s’élargit et pâlit : dilution -->
<path d="M294 328C262 316 206 304 150 302H100V408H150C210 408 262 368 294 338Z" fill="url(#panache)"/>
<path d="M40 126V516M100 126V262H436L446 280L438 300L450 322L440 344L452 366L442 386L448 408H100V516" stroke="#6e7781" stroke-width="3.5" stroke-linejoin="round" fill="none"/>

<!-- Ventilation à la demande : capteur relié au ventilateur -->
<path d="M124 267V196H368V262" stroke="#4b535c" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
<text x="246" y="186" font-size="19" fill="#1f2328" text-anchor="middle">ventilation à la demande</text>
<rect x="360" y="262" width="16" height="13" rx="2" fill="#1f2328"/>

<!-- Conduite -->
<rect x="140" y="272" width="190" height="22" rx="2" fill="#e1ecfa" stroke="#6e7781" stroke-width="2.5"/>

<!-- Air frais : galerie, prise du ventilateur, conduite, jet jusqu’au front -->
<g stroke="#1565c0" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M70 126V396" stroke-linecap="butt"/>
<path d="M70 182C70 244 76 283 94 283"/>
<path d="M146 283H322"/>
<path d="M330 283H408Q432 283 432 310"/>
</g>
<g fill="#1565c0">
<path d="M61 146L70 162L79 146Z"/>
<path d="M92 276L106 283L92 290Z"/>
<path d="M240 276L254 283L240 290Z"/>
<path d="M424 308L432 324L440 308Z"/>
</g>

<!-- Air chargé d’échappement : retour vers la galerie -->
<path d="M280 338H150C110 338 70 356 70 398V496" stroke="#6e7781" stroke-width="5" fill="none" stroke-linecap="round"/>
<g fill="#6e7781">
<path d="M180 331L164 338L180 345Z"/>
<path d="M61 494L70 510L79 494Z"/>
</g>

<!-- Ventilateur auxiliaire -->
<circle cx="124" cy="283" r="16" fill="#fbfaf6" stroke="#1f2328" stroke-width="3"/>
<g fill="#1f2328" transform="translate(124 283)">
<ellipse cx="0" cy="-6.6" rx="3.4" ry="6.2"/>
<ellipse cx="0" cy="-6.6" rx="3.4" ry="6.2" transform="rotate(120)"/>
<ellipse cx="0" cy="-6.6" rx="3.4" ry="6.2" transform="rotate(240)"/>
</g>

<!-- Engin diesel : chargeuse vue de haut, godet vers le front -->
<g fill="#1f2328">
<rect x="302" y="314" width="28" height="10" rx="3"/>
<rect x="302" y="384" width="28" height="10" rx="3"/>
<rect x="364" y="320" width="28" height="10" rx="3"/>
<rect x="364" y="378" width="28" height="10" rx="3"/>
</g>
<rect x="296" y="324" width="52" height="60" rx="6" fill="#6e7781"/>
<rect x="346" y="344" width="14" height="20" fill="#4b535c"/>
<rect x="358" y="330" width="44" height="48" rx="4" fill="#6e7781"/>
<path d="M402 316H414Q420 316 420 322V386Q420 392 414 392H402Z" fill="#4b535c"/>
<rect x="289" y="327" width="9" height="9" rx="1.5" fill="#1f2328"/>

<!-- Contaminants : serrés à la sortie, de plus en plus espacés -->
<g fill="#c62828">
<circle cx="283" cy="330" r="3.5"/><circle cx="275" cy="337" r="3.5"/><circle cx="286" cy="344" r="3.5"/>
<circle cx="268" cy="329" r="3.5"/><circle cx="266" cy="345" r="3.5"/>
<circle cx="250" cy="322" r="3.5"/><circle cx="244" cy="352" r="3.5"/><circle cx="232" cy="328" r="3.5"/>
<circle cx="214" cy="315" r="3.5"/><circle cx="219" cy="379" r="3.5"/><circle cx="170" cy="398" r="3.5"/>
<circle cx="160" cy="316" r="3.5"/><circle cx="132" cy="360" r="3.5"/><circle cx="146" cy="392" r="3.5"/>
<circle cx="84" cy="430" r="3.5"/><circle cx="56" cy="462" r="3.5"/><circle cx="84" cy="490" r="3.5"/>
</g>

<!-- Travailleur vu de haut, tourné vers l’engin ; zone respiratoire : vue de haut, un demi-disque devant le visage -->
<path d="M199 351A27 27 0 0 1 199 405Z" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="5 4" stroke-linejoin="round"/>
<path d="M199 362L213 366M199 394L213 390" stroke="#4b535c" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="195" cy="378" rx="8" ry="19" fill="#4b535c"/>
<circle cx="199" cy="378" r="10" fill="#fbfaf6" stroke="#1f2328" stroke-width="3"/>
<rect x="207" y="375" width="5" height="6" rx="1" fill="#1f2328"/>

<!-- Étiquettes -->
<text x="112" y="150" font-size="19" fill="#4b535c"><tspan font-size="20" font-weight="700" fill="#1565c0">air primaire</tspan> venu de la surface</text>
<text x="136" y="222" font-size="19" fill="#1f2328">ventilateur</text>
<text x="136" y="246" font-size="19" fill="#1f2328">auxiliaire</text>
<text x="250" y="246" font-size="19" fill="#1f2328">conduite</text>
<text x="380" y="246" font-size="19" fill="#1f2328">capteur</text>
<path d="M201 407V420" stroke="#1f2328" stroke-width="2.5"/>
<text x="136" y="440" font-size="19" fill="#1f2328">zone respiratoire</text>
<text x="136" y="464" font-size="19" fill="#1f2328">du travailleur</text>
<text x="312" y="440" font-size="19" fill="#1f2328">engin diesel</text>
<text x="112" y="500" font-size="19" font-weight="600" fill="#c62828">air chargé d’échappement</text>
</g>
</svg>
