<text x="304" y="308">3</text>
<text x="285.3" y="408.3">4</text>
<text x="194.7" y="408.3">5</text>
<text x="176" y="308">6</text>
</g>

<!-- Noms des étapes (tableau « Les 6 étapes » de la page) -->
<g font-size="19" font-weight="700" fill="#1f2328">
<text x="240" y="115" text-anchor="middle">Engagement de la direction</text>
<text x="313" y="200.9">Identification</text>
<text x="313" y="222.9">des risques</text>
