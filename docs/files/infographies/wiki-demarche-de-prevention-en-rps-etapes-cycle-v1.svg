<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="648" viewBox="0 0 480 648" role="img" aria-labelledby="t d">
<title id="t">Une démarche en boucle : prévention des risques psychosociaux</title>
<desc id="d">Schéma en forme de ligne de métro qui fait une boucle, posée sur un socle. En haut, hors de la boucle, la station 1, « Engagement de la direction », est le point de départ : une flèche descend et rejoint la boucle par le haut. La boucle tourne dans le sens des aiguilles d’une montre et dessert les stations 2, « Identification des risques », 3, « Analyse et priorisation », 4, « Plan d’action », 5, « Mise en œuvre », et 6, « Évaluation et suivi » ; après la 6, la ligne remonte et revient à la 2 : l’évaluation ramène à une nouvelle identification. Au centre de la boucle, la mention « cycle continu ». La boucle repose sur un socle en gradins marqué « Conditions de réussite », fait de six pierres : engagement réel de la direction, comité paritaire actif, confidentialité respectée, communication transparente, indicateurs mesurables, patience.</desc>
<rect width="480" height="648" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Une démarche en boucle</text>
<text x="24" y="76" font-size="19" fill="#4b535c">Prévention des risques psychosociaux</text>

<!-- Boucle des étapes 2 à 6, sens horaire. Après l’évaluation (6), la ligne remonte et revient
     à l’identification (2) : « L’évaluation alimente une nouvelle identification, donc un nouveau plan. » -->
<path d="M240 182A64 64 0 0 1 304 246V356A64 64 0 0 1 176 356V246A64 64 0 0 1 240 182Z" fill="none" stroke="#1565c0" stroke-width="10"/>
<!-- Embranchement : l’étape 1 lance la démarche ; le retour de la boucle se fait vers l’étape 2 -->
<!-- (nouvelle identification), comme le dit la page -->
<path d="M240 142V164" stroke="#1565c0" stroke-width="10" fill="none"/>
<!-- Pointes de flèche : une par tronçon, dans le sens de parcours -->
<g fill="#1565c0">
<path d="M240 184L226 164L254 164Z"/>
<path d="M271.3 189.3L248 194.7L256.9 170.2Z"/>
<path d="M304 258L291 238L317 238Z"/>
<path d="M304 364L291 344L317 344Z"/>
<path d="M230 420L250 407L250 433Z"/>
<path d="M176 348L189 368L163 368Z"/>
<path d="M176 234L189 254L163 254Z"/>
</g>

