<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="t d">
<title id="t">PAE : accès direct, contenu confidentiel</title>
<desc id="d">Une grande zone bleue en pointillés, « principe : confidentialité totale », entoure un travailleur casqué et sa famille, à gauche, et un professionnel du PAE, à droite. Une flèche bleue va du travailleur au PAE : il le contacte directement, sans autorisation de l’employeur. Sous la zone, l’employeur, un bâtiment. Une flèche bleue part de l’employeur vers le PAE : il paie le service. Une flèche grise revient du PAE vers l’employeur avec une feuille de barres : des statistiques agrégées. Une flèche rouge part de l’employeur vers la zone et bute sur un cadenas au bord de la zone : ni contenu, ni identité. À gauche, un superviseur casqué, hors de la zone : une flèche en pointillés vers le travailleur, il propose le PAE. En bas : aucune trace dans le dossier d’employé.</desc>
<rect width="480" height="640" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">PAE : accès direct,</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">contenu confidentiel</text>
<!-- Zone : « Le principe fondamental : confidentialité totale entre le travailleur et le prestataire » -->
<rect x="24" y="100" width="432" height="264" rx="18" fill="#e1ecfa" stroke="#1565c0" stroke-width="3" stroke-dasharray="9 6"/>
<text x="44" y="134" font-size="19" fill="#1565c0">principe :</text>
<text x="140" y="134" font-size="20" font-weight="700" fill="#1565c0">confidentialité totale</text>
<!-- Travailleur casqué et famille : « aux travailleurs et à leur famille » ; « conjoint et enfants » -->
<g transform="translate(78 300) scale(1.25)"><circle cx="0" cy="-53" r="9" fill="#1f2328"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1f2328"/><g transform="translate(0 -57)"><path d="M-10.5 3C-10.5 -5.5 -5.5 -10.5 0 -10.5C5.5 -10.5 10.5 -5.5 10.5 3Z" fill="#1f2328"/><rect x="-14" y="2" width="28" height="4.5" rx="2.25" fill="#1f2328"/><path d="M-2.6 -9.6V2.2M2.6 -9.6V2.2" stroke="#e1ecfa" stroke-width="2.5"/></g></g>
<g transform="translate(118 300) scale(1)"><circle cx="0" cy="-53" r="9" fill="#4b535c"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#4b535c"/></g>
<g transform="translate(148 300) scale(0.72)"><circle cx="0" cy="-53" r="9" fill="#4b535c"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#4b535c"/></g>
<g font-size="19" fill="#1f2328" text-anchor="middle">
<text x="110" y="330">travailleur</text>
<text x="110" y="352">et famille</text>
</g>
<!-- Professionnel du PAE : « consulter gratuitement un professionnel » ; « fournisseur externe » -->
<rect x="332" y="166" width="96" height="36" rx="8" fill="#1565c0"/>
<text x="380" y="191" font-size="20" font-weight="700" fill="#fbfaf6" text-anchor="middle">PAE</text>
<g transform="translate(380 300) scale(1.2)"><circle cx="0" cy="-53" r="9" fill="#1565c0"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1565c0"/></g>
<text x="380" y="330" font-size="19" fill="#1f2328" text-anchor="middle">professionnel</text>
<!-- Accès : « Le travailleur contacte directement le PAE. Aucune autorisation employeur requise. » -->
<path d="M180 256H318" stroke="#1565c0" stroke-width="4.5" stroke-linecap="round"/>
<path d="M332 256L314 246.5V265.5Z" fill="#1565c0"/>
<g font-size="19" fill="#1565c0" text-anchor="middle">
<text x="258" y="222">contacte</text>
<text x="258" y="244">directement</text>
</g>
<g font-size="18" fill="#4b535c" text-anchor="middle">
<text x="258" y="286">sans autorisation</text>
<text x="258" y="306">de l’employeur</text>
</g>
<g transform="translate(18 0)">
<!-- Employeur -->
<g stroke="#4b535c" stroke-width="3" stroke-linejoin="round">
<path d="M150 552V472H250V552Z" fill="#eceef0"/>
<path d="M142 552H258"/>
</g>
<g fill="#6e7781">
<rect x="164" y="486" width="18" height="16"/><rect x="191" y="486" width="18" height="16"/><rect x="218" y="486" width="18" height="16"/>
<rect x="164" y="512" width="18" height="16"/><rect x="218" y="512" width="18" height="16"/>
<rect x="191" y="520" width="18" height="32"/>
</g>
<text x="200" y="582" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">Employeur</text>
</g>
<!-- « L'employeur paie le service global » -->
<path d="M270 486H372V386" fill="none" stroke="#1565c0" stroke-width="4" stroke-linejoin="round"/>
<path d="M372 368L362.5 386H381.5Z" fill="#1565c0"/>
<text x="320" y="476" font-size="19" font-weight="700" fill="#1565c0" text-anchor="middle">paie</text>
<!-- « reçoit des rapports statistiques agrégés » -->
<path d="M424 366V532H288" fill="none" stroke="#6e7781" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M270 532L288 522.5V541.5Z" fill="#6e7781"/>
<rect x="408" y="414" width="32" height="40" rx="3" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<path d="M416 446V434M424 446V424M432 446V430" stroke="#6e7781" stroke-width="4"/>
<g font-size="19" fill="#4b535c" text-anchor="middle">
<text x="370" y="560">statistiques</text>
<text x="370" y="582">agrégées</text>
</g>
<g transform="translate(18 0)">
<!-- « n'a aucun accès au contenu des consultations ni à l'identité des utilisateurs » -->
<path d="M200 468V394" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
<path d="M200 386L190.5 404H209.5Z" fill="#c62828"/>
<path d="M182 382H218" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(200 360)">
<path d="M-9 -4V-11A9 9 0 0 1 9 -11V-4" fill="none" stroke="#1565c0" stroke-width="3.5"/>
<rect x="-14" y="-5" width="28" height="22" rx="3" fill="#1565c0"/>
<circle cx="0" cy="5" r="3.5" fill="#fbfaf6"/>
</g>
<g font-size="19" fill="#c62828">
<text x="216" y="422">ni contenu,</text>
<text x="216" y="444">ni identité</text>
</g>
</g>
<!-- Superviseur : « un outil que tu peux proposer sans avoir à connaître les détails de la situation du travailleur » -->
<g transform="translate(62 552)"><circle cx="0" cy="-53" r="9" fill="#4b535c"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#4b535c"/><g transform="translate(0 -57)"><path d="M-10.5 3C-10.5 -5.5 -5.5 -10.5 0 -10.5C5.5 -10.5 10.5 -5.5 10.5 3Z" fill="#4b535c"/><rect x="-14" y="2" width="28" height="4.5" rx="2.25" fill="#4b535c"/><path d="M-2.6 -9.6V2.2M2.6 -9.6V2.2" stroke="#fbfaf6" stroke-width="2.5"/></g></g>
<path d="M62 478V390" stroke="#4b535c" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
<path d="M62 372L52.5 390H71.5Z" fill="#4b535c"/>
<text x="76" y="432" font-size="19" fill="#4b535c">propose</text>
<text x="24" y="582" font-size="19" fill="#1f2328">superviseur</text>
<!-- « Aucune trace dans le dossier d'employé. » -->
<text x="24" y="620" font-size="19" fill="#4b535c">Aucune trace dans le dossier d’employé.</text>
</g>
</svg>
