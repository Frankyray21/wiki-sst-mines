<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Soutenir le contremaître : leviers de l’organisation</title>
<desc id="d">Grand titre « Soutenir le contremaître », sous-titre « Leviers de l’organisation ». Premier panneau, bleu : pastille « Direction », bandeau « Reconnaître la charge, ne pas surcharger » ; à gauche : soutien à la décision (back-up, conseiller SST) et ratios cadres-travailleurs raisonnables ; à droite, le contremaître, casqué, planchette en main, et un second travailleur casqué qui désigne la planchette de la main (étiquette BACK-UP). Second panneau, bleu : pastille « Soutien », bandeau « Formation, pairs, soutien clinique » ; à gauche : leadership, conflits, communication ; communauté de contremaîtres ; PAE, débriefing post-incident ; à droite, deux contremaîtres, planchette en main, avec une bulle de parole bleue entre eux (étiquette PAIRS). En bas, sous un crochet bleu, le message : « Reconnaître le rôle de contremaître ». Aucun chiffre, aucun effet annoncé.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="44" font-size="32" font-weight="800" fill="#0b2545">Soutenir le</text>
<text x="24" y="80" font-size="32" font-weight="800" fill="#0b2545">contremaître</text>
<text x="300" y="30" font-size="18" fill="#4b535c">Leviers de</text>
<text x="300" y="52" font-size="18" fill="#4b535c">l’organisation</text>
