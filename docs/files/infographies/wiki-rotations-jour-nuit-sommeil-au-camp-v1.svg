<svg xmlns="http://www.w3.org/2000/svg" width="480" height="612" viewBox="0 0 480 612" role="img" aria-labelledby="t d">
<title id="t">Dormir au camp : ce qui nuit, les leviers d’aménagement et les transitions de quart</title>
<desc id="d">Deux chambres de camp côte à côte. À gauche, sur fond rouge pâle, ce qui nuit : chambre partagée, un compagnon de chambre debout près de son lit fait du bruit (ondes rouges) près du travailleur qui dort ; résultat : difficulté à dormir. À droite, sur fond bleu pâle, les leviers d’aménagement nommés par la page : chambre calme, rideau opaque sur la fenêtre, climatiseur, mur doublé d’une isolation phonique, ondes de bruit dessinées à l’extérieur. En bas, les transitions de quart, trois dessins reliés par des flèches : sieste avant le premier quart de nuit, le premier quart de nuit (mineur casqué sous la lune), puis pause après le quart. Aucune heure, durée ni garantie d’effet.</desc>
