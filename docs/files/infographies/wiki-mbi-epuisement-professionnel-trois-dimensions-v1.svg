<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="644" viewBox="0 0 480 644" role="img" aria-labelledby="t d">
<title id="t">MBI : trois dimensions, trois scores</title>
<desc id="d">Titre : Le MBI, trois dimensions ; en haut à droite, un petit carré rouge : en rouge, côté à risque. Trois bandes, une par dimension. Chacune porte une pastille noire à son nom, un bandeau gris qui cite la page, et une jauge sans graduation ni valeur, entre BAS et ÉLEVÉ, qui passe peu à peu du gris au rouge vers le côté à risque ; à droite, un dessin. Épuisement, « Sentiment d’être vidé » : jauge qui rougit vers ÉLEVÉ ; une grande batterie presque vide, sa dernière charge en rouge. Cynisme, « Distance, désengagement » : jauge qui rougit vers ÉLEVÉ ; deux travailleurs casqués, séparés par une flèche double grise. Accomplissement, « Sentiment d’efficacité » : jauge qui rougit, cette fois, vers BAS ; une cible, une fléchette plantée au centre. En bas, sous un crochet bleu, en bleu : Trois scores, pas de total ; dans un cartouche : comparés aux normes par secteur. Aucun chiffre ni seuil.</desc>
