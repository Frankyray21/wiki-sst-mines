<linearGradient id="versBas" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#eceef0"/><stop offset="0.45" stop-color="#fde3e0"/><stop offset="1" stop-color="#c62828"/></linearGradient>
