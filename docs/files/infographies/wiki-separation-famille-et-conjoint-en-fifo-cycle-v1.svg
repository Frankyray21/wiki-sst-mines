<svg xmlns="http://www.w3.org/2000/svg" width="480" height="594" viewBox="0 0 480 594" role="img" aria-labelledby="t d">
<title id="t">Séparation et retrouvailles, cycle après cycle : le travailleur au site, la famille à la maison</title>
<desc id="d">Schéma en boucle sur deux côtés. À gauche, sur fond bleu clair : à la maison, où restent le conjoint et les enfants. À droite, sur fond gris, avec un chevalement de mine : au site, où travaille le travailleur casqué. Un trajet fléché fait la boucle ; les noms des phases sont inscrits sur l’axe central. Départ : le trajet part de la maison vers le site. Absence : le travailleur est au site, « dans un autre univers » ; à la maison, sa place reste vide (silhouette en pointillé) et « le conjoint gère seul ». Retour : le trajet revient à la maison. Retrouvailles : le travailleur est avec le conjoint et les enfants ; pour le couple, « rôles à renégocier » ; pour les enfants, « routine à réadapter ». Nouveau départ : le trajet repart vers le site, puis un pointillé remonte au début de l’absence, avec la mention « à chaque cycle ». Aucune durée ni proportion.</desc>
