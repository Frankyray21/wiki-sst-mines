<svg xmlns="http://www.w3.org/2000/svg" width="480" height="447" viewBox="0 0 480 447" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Chaîne accidentelle</title><desc id="d">Titre : « Chaîne accidentelle », sous-titre « Pour chaque scénario ». Figure sur fond noir. Quatre maillons reliés par des flèches : phénomène dangereux (source potentielle de dommage) ; situation dangereuse (personne exposée à au moins un phénomène) ; événement dangereux (susceptible de causer un dommage : défaillance, erreur humaine, défaut organisationnel) ; dommage (blessure physique ou atteinte à la santé). En marge du passage de l’événement au dommage, la possibilité d’évitement : qui est exposé (formation), temps de réaction humain contre temps d’action du phénomène, conscience du risque. En bas, à demander : « pour quelle raison le travailleur se trouve-t-il là ? »</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="445.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">Chaîne accidentelle</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Pour chaque scénario</text><rect x="16.0" y="78.0" width="268.0" height="50.5" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="150.0" y="100.8" font-weight="700" font-size="14.5" fill="#f2f6fa" text-anchor="middle">Phénomène dangereux</text><text x="150.0" y="118.0" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">source potentielle de dommage</text><line x1="150.0" y1="128.5" x2="150.0" y2="147.5" stroke="#8b939c" stroke-width="2.2" stroke-linecap="round"/><polygon points="150.0,154.5 145.8,146.6 154.2,146.6" fill="#8b939c"/><rect x="16.0" y="154.5" width="268.0" height="50.5" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="150.0" y="177.3" font-weight="700" font-size="14.5" fill="#f2f6fa" text-anchor="middle">Situation dangereuse</text><text x="150.0" y="194.5" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">personne exposée à au moins un phénomène</text><line x1="150.0" y1="205.0" x2="150.0" y2="224.0" stroke="#8b939c" stroke-width="2.2" stroke-linecap="round"/><polygon points="150.0,231.0 145.8,223.1 154.2,223.1" fill="#8b939c"/><rect x="16.0" y="231.0" width="268.0" height="79.3" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="150.0" y="253.8" font-weight="700" font-size="14.5" fill="#f2f6fa" text-anchor="middle">Événement dangereux</text><text x="150.0" y="271.0" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">susceptible de causer un dommage :</text><text x="150.0" y="285.4" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">défaillance, erreur humaine, défaut</text><text x="150.0" y="299.8" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">organisationnel</text><line x1="150.0" y1="310.3" x2="150.0" y2="329.3" stroke="#8b939c" stroke-width="2.2" stroke-linecap="round"/><polygon points="150.0,336.3 145.8,328.4 154.2,328.4" fill="#8b939c"/><rect x="16.0" y="336.3" width="268.0" height="50.5" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="150.0" y="359.1" font-weight="700" font-size="14.5" fill="#f2f6fa" text-anchor="middle">Dommage</text><text x="150.0" y="376.3" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">blessure physique ou atteinte à la santé</text><rect x="306.0" y="263.3" width="158.0" height="101.2" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="385.0" y="283.7" font-weight="700" font-size="13" fill="#f2f6fa" text-anchor="middle">Possibilité d’évitement</text><text x="385.0" y="299.9" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">qui est exposé (formation),</text><text x="385.0" y="313.8" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">temps de réaction humain</text><text x="385.0" y="327.6" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">vs temps d’action du</text><text x="385.0" y="341.4" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">phénomène, conscience du</text><text x="385.0" y="355.1" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">risque</text><line x1="306.0" y1="323.3" x2="156.0" y2="323.3" stroke="#8fa0b3" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="14.0" y="402.8" width="452.0" height="30.0" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="26" y="421.8" font-size="12.5"><tspan font-weight="800" fill="#f2f6fa">À demander</tspan><tspan font-weight="500" fill="#b6c2d1"> — « pour quelle raison le travailleur se trouve-t-il là ? »</tspan></text></svg>