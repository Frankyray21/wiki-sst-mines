<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" role="img" aria-labelledby="t d">
<title id="t">Apparence et comportement</title>
<desc id="d">Dans chaque rangée, la case grise à gauche montre la situation « d’habitude », la case encadrée à droite, après une flèche, la situation « maintenant » ; l’étiquette au-dessus reprend les mots exacts du tableau de la page. Fatigue marquée et persistante : d’habitude debout, pile pleine ; maintenant assis, dos voûté, tête basse, bras ballants, pile presque vide en rouge (au-delà de la fatigue normale en quart, dit la page). Plaintes physiques nouvelles : maintenant, le travailleur se tient la tête et le bas du dos, marqués de traits rouges (la page cite maux de tête, maux de dos, troubles du sommeil). Hausse de la consommation visible : d’habitude une tasse sur la table ; maintenant trois tasses et un paquet de cigarettes (la page cite alcool en camp, café, cigarettes ; l’alcool n’est pas dessiné). Le nombre d’objets n’est pas un seuil.</desc>
