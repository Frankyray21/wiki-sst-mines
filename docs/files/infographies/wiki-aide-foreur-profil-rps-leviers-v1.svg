<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Les leviers de l’organisation autour du poste d’aide-foreur</title>
<desc id="d">Deux panneaux bleus : les leviers de l’organisation autour du poste d’aide-foreur. En haut, pastille « Poste », bandeau « Marge de manœuvre » : à gauche, trois phrases, progression vers foreur ; reconnaissance institutionnelle ; superviseurs sensibilisés. À droite, l’aide-foreur tend le bras et une flèche bleue va vers un tableau de tâches dont une flèche change l’ordre, étiqueté SÉQUENÇAGE, MÉTHODES ; une étoile bleue pleine près de sa tête. En bas, pastille « Relation », bandeau « Formation des foreurs » : leadership et communication ; rotation des paires ; signalement accessible. À droite, le foreur parle à l’aide-foreur, bulle bleue ; étiquettes FOREUR et AIDE-FOREUR. Sous une accolade bleue, le message clé : Comprendre ce profil permet de cibler les leviers. Aucun chiffre ni ordre de priorité.</desc>
