</text><text x="53.0" y="172.0" font-weight="500" font-size="13" fill="#ffffff">d’emploi</text><circle cx="36.2" cy="194.0" r="7.2" fill="#8fa1b1"/><circle cx="36.2" cy="194.0" r="2.4" fill="#0b1822"/><text x="53.0" y="198.5" font-weight="500" font-size="13" fill="#ffffff">Absentéisme maladie et</text><text x="53.0" y="214.0" font-weight="500" font-size="13" fill="#ffffff">présentéisme</text><circle cx="36.2" cy="236.0" r="7.2" fill="#8fa1b1"/><circle cx="36.2" cy="236.0" r="2.4" fill="#0b1822"/><text x="53.0" y="240.5" font-weight="500" font-size="13" fill="#ffffff">Activités ou politique de</text><text x="53.0" y="256.0" font-weight="500" font-size="13" fill="#ffffff">santé au travail</text><rect x="243.5" y="133.0" width="218.5" height="156.5" rx="8" fill="#152531" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/><circle cx="261.7" cy="152.0" r="7.2" fill="#8fa1b1"/><circle cx="261.7" cy="152.0" r="2.4" fill="#0b1822"/><text x="278.5" y="156.5" font-weight="500" font-size="13" fill="#ffffff">Activités ou politique contre</text><text x="278.5" y="172.0" font-weight="500" font-size="13" fill="#ffffff">la violence et le harcèlement</text><circle cx="261.7" cy="194.0" r="7.2" fill="#8fa1b1"/><circle cx="261.7" cy="194.0" r="2.4" fill="#0b1822"/><text x="278.5" y="198.5" font-weight="500" font-size="13" fill="#ffffff">Activités ou politique de</text><text x="278.5" y="214.0" font-weight="500" font-size="13" fill="#ffffff">retour au travail</text><circle cx="261.7" cy="236.0" r="7.2" fill="#8fa1b1"/><circle cx="261.7" cy="236.0" r="2.4" fill="#0b1822"/><text x="278.5" y="240.5" font-weight="500" font-size="13" fill="#ffffff">Activités ou politique de</text><text x="278.5" y="256.0" font-weight="500" font-size="13" fill="#ffffff">conciliation travail et vie</text><text x="278.5" y="271.5" font-weight="500" font-size="13" fill="#ffffff">personnelle</text><rect x="10" y="305.5" width="460" height="186.0" rx="11" fill="#0f1c26"/><path d="M10 365.5 V316.5 a11 11 0 0