<svg xmlns="http://www.w3.org/2000/svg" width="480" height="572" viewBox="0 0 480 572" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Grille INSPQ : 12 indicateurs</title><desc id="d">Titre : « Grille INSPQ : 12 indicateurs », sous-titre « Grille d’identification de risques psychosociaux du travail ». Infographie sur fond sombre. Section « Partie 1 » (6 indicateurs) ; en tête : « Contexte de travail et mesures de prévention en place ». Contexte de travail et d’emploi ; Absentéisme maladie et présentéisme ; Activités ou politique de santé au travail. Activités ou politique contre la violence et le harcèlement ; Activités ou politique de retour au travail ; Activités ou politique de conciliation travail et vie personnelle. Section « Partie 2 » (6 indicateurs) ; en tête : « Composantes clés de l’organisation du travail ». Charge de travail ; Reconnaissance au travail ; Soutien social du supérieur. Soutien social des collègues ; Autonomie décisionnelle ; Information et communication. En bas, « Repère rapide » : la démarche de l’INSPQ : informer et sensibiliser le milieu, l’évaluer à l’aide de la Grille, soutenir la prise en charge, puis suivre le plan d’action.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a24"/><stop offset="1" stop-color="#07121a"/></linearGradient><radialGradient id="h" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#15324a" stop-opacity="0.55"/><stop offset="1" stop-color="#15324a" stop-opacity="0"/></radialGradient></defs><rect width="480" he