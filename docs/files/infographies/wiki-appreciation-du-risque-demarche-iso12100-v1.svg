<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Démarche ISO 12100</title><desc id="d">Titre : « Démarche ISO 12100 », sous-titre « Méthode itérative en quatre étapes ». Figure sur fond noir. Un logigramme : 1, déterminer les limites de la machine ou du système (espace, temps, usage prévu, mauvais usage raisonnablement prévisible) ; 2, identifier les phénomènes dangereux ; 3, estimer le risque, par scénario ; 4, évaluer le risque : tolérable ? Si oui, la démarche s’arrête. Si non : appliquer la hiérarchie de réduction, puis recommencer à l’étape 1.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="458.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">Démarche ISO 12100</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Méthode itérative en quatre étapes</text><rect x="70.0" y="78.0" width="300.0" height="64.3" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="220.0" y="100.3" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Déterminer les limites</text><text x="220.0" y="117.4" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">de la machine ou du système : espace, temps, usage</text><text x="220.0" y="131.8" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">prévu, mauvais usage raisonnablement prévisible</text><text x="56.0" y="115.2" font-weight="800" font-size="14" fill="#8fa0b3" text-anchor="middle">1</text><line x1="220.0" y1="142.3" x2="220.0" y2="158.3" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="220.0,164.3 216.2,157.2 223.8,157.2" fill="#8b939c"/><rect x="70.0" y="164.3" width="300.0" height="33.5" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="220.0" y="186.6" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Identifier les phénomènes dangereux</text><text x="56.0" y="186.1" font-weight="800" font-size="14" fill="#8fa0b3" text-anchor="middle">2</text><line x1="220.0" y1="197.8" x2="220.0" y2="213.8" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="220.0,219.8 216.2,212.7 223.8,212.7" fill="#8b939c"/><rect x="70.0" y="219.8" width="300.0" height="49.9" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="220.0" y="242.1" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Estimer le risque</text><text x="220.0" y="259.2" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">par scénario</text><text x="56.0" y="249.8" font-weight="800" font-size="14" fill="#8fa0b3" text-anchor="middle">3</text><line x1="220.0" y1="269.7" x2="220.0" y2="285.7" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="220.0,291.7 216.2,284.6 223.8,284.6" fill="#8b939c"/><polygon points="220.0,291.7 370.0,337.7 220.0,383.7 70.0,337.7" fill="#23262d" stroke="#3a404a" stroke-width="1.6" stroke-linejoin="round"/><text x="56.0" y="342.7" font-weight="800" font-size="14" fill="#8fa0b3" text-anchor="middle">4</text><text x="220.0" y="332.7" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Évaluer le risque :</text><text x="220.0" y="350.7" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">tolérable ?</text><line x1="370.0" y1="337.7" x2="398.0" y2="337.7" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="404.0,337.7 396.9,341.5 396.9,333.9" fill="#8b939c"/><text x="378.0" y="329.7" font-weight="700" font-size="12" fill="#b6c2d1">Oui</text><circle cx="414.0" cy="337.7" r="8" fill="#b6c2d1"/><line x1="220.0" y1="383.7" x2="220.0" y2="401.7" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="220.0,407.7 216.2,400.6 223.8,400.6" fill="#8b939c"/><text x="228.0" y="399.7" font-weight="700" font-size="12" fill="#b6c2d1">Non</text><rect x="70.0" y="407.7" width="300.0" height="35.5" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="220.0" y="431.0" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Appliquer la hiérarchie de réduction</text><path d="M70.0,425.4 H28.0 V110.2" fill="none" stroke="#8b939c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="28.0" y1="110.2" x2="38.0" y2="110.2" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="44.0,110.2 36.9,113.9 36.9,106.4" fill="#8b939c"/><text x="20.0" y="251.7" font-weight="600" font-size="11.5" fill="#b6c2d1" text-anchor="middle" transform="rotate(-90 20.0 251.7)">puis recommencer</text></svg>