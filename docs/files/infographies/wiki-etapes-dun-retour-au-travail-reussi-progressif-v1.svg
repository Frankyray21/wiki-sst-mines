<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Étape 3 : retour progressif</title>
<desc id="d">Étape 3, retour progressif, en trois rangées séparées par des pointillés. Dans chacune, le travailleur casqué pousse un wagonnet ; à droite, une horloge et une jauge des heures, sans case ni graduation. Démarrage : wagonnet presque vide, jauge à peine remplie ; un superviseur, en bleu, carnet en main, se tient juste à côté du travailleur ; « supervision rapprochée », « tâches allégées », « heures réduites ». Progression : wagonnet plus chargé, jauge plus remplie, terminée par une pointe, et une flèche bleue qui monte ; « augmentation graduelle des heures et de la charge ». Stabilisation : wagonnet plein à ras bord, jauge pleine, « retour à temps plein » ; à gauche, des curseurs de réglage dans un cadre pointillé bleu, « aménagements maintenus si nécessaire ». La jauge et le wagonnet ne mesurent ni heures ni durée.</desc>
