<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="t d">
<title id="t">Étape 2 : planification du retour</title>
<desc id="d">Étape 2, planification du retour. Au centre, une grande feuille bleue, le « plan écrit », énumère : date, poste prévu, horaires, aménagements. Autour, cinq acteurs, chacun relié au plan par un trait, sans table ni réunion : en haut, le médecin traitant et le médecin du travail, avec un stéthoscope ; à gauche, le travailleur, en noir ; à droite, l’employeur, casque et cravate ; en bas, le PAE. Tous sont en bleu, sauf le travailleur.</desc>
