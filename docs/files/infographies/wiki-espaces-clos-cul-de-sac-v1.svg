<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-labelledby="t d">
<title id="t">Chantier en cul-de-sac : quand l’air ne circule plus</title>
<desc id="d">Vue en plan, deux fois le même chantier borgne branché sur une galerie ventilée. En haut, ventilation auxiliaire en marche : un ventilateur à l’entrée du cul-de-sac prend l’air de la galerie et le pousse dans un conduit jusqu’au front de taille ; l’air revient le long du chantier et rejoint la galerie (flèches bleues). En bas, ventilation auxiliaire arrêtée ou défaillante : le ventilateur est barré, l’air passe toujours dans la galerie mais plus rien ne le pousse jusqu’au front de taille ; le chantier est teinté de rouge pâle, surtout au fond, où l’air stagne, où le CO et le NO₂ peuvent s’accumuler et où l’O₂ peut manquer. Le chantier peut se comporter comme un espace clos sans en avoir l’apparence.</desc>
<defs>
<linearGradient id="stagne" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="310" y2="0"><stop offset="0" stop-color="#fde3e0" stop-opacity="0.3"/><stop offset="1" stop-color="#fde3e0"/></linearGradient>
</defs>
<rect width="480" height="640" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Chantier en cul-de-sac :</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">quand l’air ne circule plus</text>

<!-- ============ Vignette A : ventilation auxiliaire en marche ============ -->
<text x="24" y="116" font-size="20" font-weight="700" fill="#1f2328">Ventilation auxiliaire en marche</text>
<g transform="translate(0 130)">
<!-- Roc, galerie ventilée, chantier borgne -->
<rect x="24" y="0" width="432" height="164" fill="#eceef0"/>
<rect x="40" y="0" width="72" height="164" fill="#fbfaf6"/>
<path d="M110 48H436L444 60L437 74L446 88L438 104L442 120H110Z" fill="#fbfaf6"/>
<path d="M40 0V164M112 0V48H436L444 60L437 74L446 88L438 104L442 120H112V164" stroke="#6e7781" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
<!-- Conduit -->
<rect x="150" y="57" width="242" height="22" rx="2" fill="#e1ecfa" stroke="#6e7781" stroke-width="2.5"/>
<!-- Air : galerie, prise du ventilateur, conduit, retour -->
<g stroke="#1565c0" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M62 0V148" stroke-linecap="butt"/>
<path d="M62 12C62 52 80 68 108 68"/>
<path d="M156 68H404Q426 68 426 84Q426 100 404 100H120C88 100 62 104 62 128"/>
</g>
<g fill="#1565c0">
<path d="M53 146L62 162L71 146Z"/>
<path d="M104 61L118 68L104 75Z"/>
<path d="M290 61L304 68L290 75Z"/>
<path d="M246 92L230 100L246 108Z"/>
</g>
<!-- Ventilateur -->
<circle cx="136" cy="68" r="17" fill="#fbfaf6" stroke="#1f2328" stroke-width="3"/>
<g fill="#1f2328" transform="translate(136 68)">
<ellipse cx="0" cy="-7" rx="3.6" ry="6.5"/>
<ellipse cx="0" cy="-7" rx="3.6" ry="6.5" transform="rotate(120)"/>
<ellipse cx="0" cy="-7" rx="3.6" ry="6.5" transform="rotate(240)"/>
</g>
<!-- Étiquettes -->
<text x="120" y="34" font-size="19" fill="#1f2328">ventilateur</text>
<text x="330" y="34" font-size="19" fill="#1f2328" text-anchor="middle">conduit</text>
<path d="M126 144H86" stroke="#4b535c" stroke-width="2.5"/>
<circle cx="84" cy="144" r="4" fill="#4b535c"/>
<text x="132" y="150" font-size="19" fill="#1f2328">galerie ventilée</text>
<text x="446" y="150" font-size="19" fill="#1f2328" text-anchor="end">front de taille</text>
</g>

<!-- ============ Vignette B : ventilation auxiliaire arrêtée ou défaillante ============ -->
<text x="24" y="330" font-size="20" font-weight="700" fill="#1f2328">Ventilation auxiliaire arrêtée</text>
<text x="24" y="354" font-size="20" font-weight="700" fill="#1f2328">ou défaillante</text>
<g transform="translate(0 368)">
<rect x="24" y="0" width="432" height="164" fill="#eceef0"/>
<rect x="40" y="0" width="72" height="164" fill="#fbfaf6"/>
<path d="M110 48H436L444 60L437 74L446 88L438 104L442 120H110Z" fill="#fbfaf6"/>
<path d="M110 48H436L444 60L437 74L446 88L438 104L442 120H110Z" fill="url(#stagne)"/>
<path d="M40 0V164M112 0V48H436L444 60L437 74L446 88L438 104L442 120H112V164" stroke="#6e7781" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
<rect x="150" y="57" width="242" height="22" rx="2" fill="#eceef0" stroke="#6e7781" stroke-width="2.5"/>
<!-- L’air passe toujours dans la galerie -->
<path d="M62 0V148" stroke="#1565c0" stroke-width="5" fill="none"/>
<path d="M53 146L62 162L71 146Z" fill="#1565c0"/>
<!-- Ventilateur barré -->
<circle cx="136" cy="68" r="17" fill="#fbfaf6" stroke="#1f2328" stroke-width="3"/>
<g fill="#1f2328" transform="translate(136 68)">
<ellipse cx="0" cy="-7" rx="3.6" ry="6.5"/>
<ellipse cx="0" cy="-7" rx="3.6" ry="6.5" transform="rotate(120)"/>
<ellipse cx="0" cy="-7" rx="3.6" ry="6.5" transform="rotate(240)"/>
</g>
<path d="M117 49L155 87M155 49L117 87" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<!-- Étiquettes de la zone -->
<text x="352" y="107" font-size="20" font-weight="700" fill="#c62828" text-anchor="middle">l’air stagne</text>
<text x="446" y="34" font-size="19" font-weight="600" fill="#c62828" text-anchor="end">CO, NO₂ peuvent s’accumuler</text>
<text x="446" y="150" font-size="19" font-weight="600" fill="#c62828" text-anchor="end">l’O₂ peut manquer</text>
</g>

<text x="24" y="570" font-size="19" fill="#4b535c">Le chantier peut se comporter</text>
<text x="24" y="594" font-size="19" fill="#4b535c">comme un espace clos</text>
<text x="24" y="618" font-size="19" fill="#4b535c">sans en avoir l’apparence.</text>
</g>
</svg>
