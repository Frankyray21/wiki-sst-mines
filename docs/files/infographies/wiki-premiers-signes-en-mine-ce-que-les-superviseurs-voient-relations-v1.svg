<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" role="img" aria-labelledby="t d">
<title id="t">Communication et relations</title>
<desc id="d">Dans chaque rangée, la case grise à gauche montre la situation « d’habitude », la case encadrée à droite, après une flèche, la situation « maintenant » ; l’étiquette au-dessus reprend les mots exacts du tableau de la page. Repli, isolement à la cantine ou en pause : d’habitude, trois personnes se parlent à la même table ; maintenant, deux sont à la table et la troisième est seule à une autre table. Baisse des interactions spontanées : d’habitude, le travailleur et son collègue (en gris) se parlent tous les deux ; maintenant, seul le collègue parle (moins de discussions, moins de présence). Conflits inhabituels avec collègues : d’habitude, un échange calme ; maintenant, les deux tendent le bras l’un vers l’autre sous une bulle rouge en dents de scie (tension qui apparaît).</desc>
