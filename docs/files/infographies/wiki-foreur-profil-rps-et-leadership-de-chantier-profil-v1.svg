<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Ce qui pèse sur le foreur, souvent chef de chantier de fait</title>
<desc id="d">Grand titre « Ce qui pèse sur le foreur », sous-titre « Souvent chef de chantier de fait, sans titre formel ». Premier panneau, rouge : pastille « Charge », bandeau « Charge cognitive et physique élevées » ; à gauche, trois phrases : décisions techniques, surveillance multiple, pression de production ; à droite, le foreur, casqué, tend le bras vers la console de sa foreuse, deux jauges l’une au-dessus de l’autre (étiquette JAUGES), et ses regards, en pointillé rouge, vont à l’une et à l’autre. Second panneau, rouge : pastille « Sécurité », bandeau « De soi et de l’aide-foreur » ; trois phrases : responsabilité lourde, stress de responsabilité, leadership informel sur l’aide-foreur ; à droite, le foreur regarde l’aide-foreur, qui tient une tige de forage (regard en pointillé rouge). En bas, sous un crochet bleu, le message : « Latitude technique réelle, responsabilités lourdes ». Aucun chiffre.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<!-- Page, Description du poste : « Souvent considéré comme le chef de chantier de fait, même sans titre formel. » -->
