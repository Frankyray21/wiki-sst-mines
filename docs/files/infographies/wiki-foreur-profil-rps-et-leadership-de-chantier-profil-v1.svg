<text x="24" y="80" font-size="32" font-weight="800" fill="#0b2545">le foreur</text>
<text x="314" y="30" font-size="18" fill="#4b535c">Souvent chef de</text>
<text x="314" y="52" font-size="18" fill="#4b535c">chantier de fait,</text>
<text x="314" y="74" font-size="18" fill="#4b535c">sans titre formel</text>
