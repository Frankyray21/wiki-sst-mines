<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="656" viewBox="0 0 480 656" role="img" aria-labelledby="t d">
<title id="t">Ce qui pèse sur le contremaître, superviseur de premier niveau en mine</title>
<desc id="d">Grand titre « Ce qui pèse sur le contremaître », sous-titre « Superviseur de premier niveau en mine ». Premier panneau, rouge : pastille « Pression », bandeau « Direction qui pousse, équipe qui réclame » ; à gauche, deux phrases : entre deux niveaux, parfois isolé ; à droite, un membre de la direction, sans casque, en cravate (étiquette DIRECTION), et un travailleur casqué qui lève la main (étiquette ÉQUIPE) ; de chaque côté, une grosse flèche rouge pointe vers le contremaître, au centre, casqué, planchette en main. Second panneau, rouge : pastille « Charge », bandeau « Charge mentale élevée » ; trois phrases : sécurité de l’équipe, décisions et anticipation, multitâche ; à droite, le contremaître et sa planchette, avec une bulle de pensée rouge : un casque, un point d’interrogation, une liste. En bas, sous un crochet bleu, le message : « Peu d’espace pour décharger ». Aucun chiffre.</desc>
