<text x="24" y="80" font-size="32" font-weight="800" fill="#0b2545">le contremaître</text>
<text x="318" y="30" font-size="18" fill="#4b535c">Superviseur de</text>
<text x="318" y="52" font-size="18" fill="#4b535c">premier niveau</text>
<text x="318" y="74" font-size="18" fill="#4b535c">en mine</text>
