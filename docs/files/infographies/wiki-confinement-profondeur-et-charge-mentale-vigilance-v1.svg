<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Charge mentale sous terre : la vigilance</title>
<desc id="d">Grand titre : Charge mentale sous terre, en confinement, à grande profondeur. Un panneau rouge, « Vigilance », avec le bandeau : elle consomme des ressources cognitives. À gauche, trois phrases : même quand les tâches sont routinières ; orientation sans repères naturels ; évaluation continue des dangers. À droite, une galerie vue dans l’axe, qui se divise au fond en deux ouvertures identiques. Au premier plan, un mineur casqué, de face, tient le volant d’une vanne (étiquette : tâche). De sa tête partent trois flèches rouges en pointillé vers des exemples de ce qu’il surveille : une fissure de la voûte (terrain), un boîtier de détection fixé à la paroi (gaz) et une chargeuse qui arrive (équipement). En bas, le message : cette charge s’ajoute à celle de la tâche. Note : l’adaptation a un coût qui s’accumule sur la rotation, la carrière. Aucune durée ni aucun niveau.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
