<text x="24" y="86" font-size="32" fill="#0b2545" font-weight="800">sous terre</text>
<text x="236" y="76" font-size="18" fill="#4b535c">En confinement,</text>
<text x="236" y="99" font-size="18" fill="#4b535c">à grande profondeur</text>
<!-- Page, L’essentiel : « La vigilance permanente face aux risques (effondrement, gaz, ventilation, équipement) consomme des ressources cognitives. » -->
