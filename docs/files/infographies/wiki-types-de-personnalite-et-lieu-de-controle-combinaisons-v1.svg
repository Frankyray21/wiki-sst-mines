<text x="207" y="293" font-size="19" fill="#4b535c" text-anchor="middle">situation »</text>
<text x="372" y="226" font-size="20" fill="#1f2328" font-weight="700" text-anchor="middle">Externe</text>
<text x="368" y="249" font-size="19" fill="#4b535c" text-anchor="middle">« Ce qui m’arrive</text>
