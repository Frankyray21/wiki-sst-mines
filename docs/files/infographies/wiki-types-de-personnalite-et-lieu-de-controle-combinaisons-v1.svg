<svg xmlns="http://www.w3.org/2000/svg" width="480" height="626" viewBox="0 0 480 626" role="img" aria-labelledby="t d">
<title id="t">Type de personnalité et lieu de contrôle : quatre combinaisons, dans un même contexte de travail</title>
<desc id="d">Grille de quatre cases posée à l’intérieur d’un grand cadre gris, les conditions de travail : le contexte produit le risque, l’individu le filtre. En colonnes, le lieu de contrôle, c’est-à-dire à quoi le travailleur attribue ce qui lui arrive : interne, « Je peux agir sur ma situation », dessiné par une flèche qui part du travailleur casqué vers un levier ; externe, « Ce qui m’arrive dépend des autres ou du hasard », dessiné par deux flèches qui arrivent vers lui, l’une depuis un dé, l’autre depuis une autre personne. En lignes, le type de personnalité : type A, pressé et impatient, marqué d’un chronomètre ; type B, détendu et patient. Chaque case combine les deux ; les quatre cases ont la même couleur, aucune n’est marquée comme dangereuse ou protectrice. Sous la colonne externe, en bleu : réaliste quand le poste offre peu de contrôle. En bas à gauche : aucun travailleur n’est à risque ou protégé en soi.</desc>
