<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="t d">
<title id="t">Le MBI : mesure ou diagnostic ?</title>
<desc id="d">Titre : Mesure ou diagnostic ? ; sous-titre : le résultat du questionnaire. Deux panneaux. Panneau Mesure, bandeau « Le MBI est un instrument de mesure » ; à gauche, deux puces : trois sous-scores ; confidentialité : renseignement de santé. À droite, un travailleur casqué tient sa feuille de résultats, marquée MBI, avec trois barres de même longueur, sans valeur, et aucun énoncé du questionnaire ; un cadenas bleu est accroché au coin. Panneau Diagnostic, bandeau « Un professionnel de santé est requis » ; à gauche, trois puces : burnout ? dépression ? trouble anxieux ? À droite, un professionnel de santé, tête nue, carnet en main, face au travailleur casqué ; étiquette : professionnel de santé. En bas, sous un crochet bleu, en bleu : une mesure, pas un diagnostic.</desc>
<rect width="480" height="650" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="20" y="36" font-size="31" font-weight="800" fill="#0b2545">Mesure ou</text>
<text x="20" y="69" font-size="31" font-weight="800" fill="#0b2545">diagnostic ?</text>
<text x="258" y="34" font-size="18" fill="#4b535c">Le résultat</text>
<text x="258" y="56" font-size="18" fill="#4b535c">du questionnaire</text>
<!-- Page, encadré Limite : « Le MBI est un instrument de mesure, pas un diagnostic. » ; Cadre légal : « Confidentialité : renseignement de santé. » -->
<rect x="12" y="80" width="456" height="200" rx="14" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<rect x="24" y="92" width="124" height="48" rx="10" fill="#1f2328"/>
<text x="86.0" y="124.6" font-size="24" font-weight="700" fill="#fbfaf6" text-anchor="middle">Mesure</text>
<rect x="156" y="92" width="290" height="48" rx="10" fill="#eceef0"/>
<text x="168" y="112.3" font-size="19" font-weight="700" fill="#1f2328">« Le MBI est un</text>
<text x="168" y="133.3" font-size="19" font-weight="700" fill="#1f2328">instrument de mesure »</text>
<circle cx="40" cy="165.5" r="9" fill="#1f2328"/>
<text x="60" y="172" font-size="19" fill="#1f2328">Trois sous-scores</text>
<circle cx="40" cy="203.5" r="9" fill="#1f2328"/>
<text x="60" y="210" font-size="19" fill="#1f2328">Confidentialité :</text>
<text x="60" y="232" font-size="19" fill="#1f2328">renseignement</text>
<text x="60" y="254" font-size="19" fill="#1f2328">de santé</text>
<ellipse cx="300" cy="268.0" rx="30.0" ry="6.0" fill="#eceef0"/>
<g transform="translate(300 266) scale(1.0)"><g fill="#1f2328"><rect x="-12" y="-45" width="10" height="45" rx="4"/><rect x="2" y="-45" width="10" height="45" rx="4"/><circle cx="0" cy="-95" r="11"/><path d="M-15 -98Q-15 -118 0 -118Q15 -118 15 -98Z"/><path d="M-17 -98H17" stroke="#1f2328" stroke-width="7" stroke-linecap="round"/><rect x="-4.5" y="-113" width="9" height="7" rx="2" fill="#fbfaf6"/><path d="M-13 -77Q-13 -82 -8 -82H8Q13 -82 13 -77V-41H-13Z"/><path d="M-13 -75L-22 -48" stroke="#1f2328" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M13 -75L26 -60L32 -64" stroke="#1f2328" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><rect x="28" y="-100" width="54" height="70" rx="5" fill="#fbfaf6" stroke="#1f2328" stroke-width="4.5"/><rect x="45" y="-105" width="20" height="9" rx="3" fill="#1f2328"/><text x="37" y="-77" font-size="18" font-weight="700" fill="#1f2328">MBI</text><path d="M37 -64H62M37 -52H62M37 -40H62" stroke="#1f2328" stroke-width="6" stroke-linecap="round"/><path d="M75 -38V-44Q75 -51 81 -51Q87 -51 87 -44V-38" fill="none" stroke="#1565c0" stroke-width="4"/><rect x="70" y="-39" width="22" height="18" rx="3" fill="#1565c0"/><circle cx="81" cy="-30" r="2.8" fill="#fbfaf6"/></g>
<!-- Page, encadré Limite : « Pour un diagnostic différentiel (burnout vs dépression vs trouble anxieux), un professionnel de santé est requis. » -->
