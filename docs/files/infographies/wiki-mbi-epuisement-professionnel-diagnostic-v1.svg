<text x="326" y="530.5" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">DE SANTÉ</text>
<path d="M24 552V562H456V552" fill="none" stroke="#1565c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="600" font-size="27" font-weight="700" fill="#1565c0" text-anchor="middle">Une mesure,</text>
<text x="240" y="634" font-size="27" font-weight="700" fill="#1565c0" text-anchor="middle">pas un diagnostic</text>
