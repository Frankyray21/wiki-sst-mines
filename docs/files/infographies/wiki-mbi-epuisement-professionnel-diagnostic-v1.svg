<g fill="#1f2328" transform="translate(424 476) scale(1.0)"><rect x="-12" y="-45" width="10" height="45" rx="4"/><rect x="2" y="-45" width="10" height="45" rx="4"/><circle cx="0" cy="-95" r="11"/><path d="M-15 -98Q-15 -118 0 -118Q15 -118 15 -98Z"/><path d="M-17 -98H17" stroke="#1f2328" stroke-width="7" stroke-linecap="round"/><rect x="-4.5" y="-113" width="9" height="7" rx="2" fill="#fbfaf6"/><path d="M-13 -77Q-13 -82 -8 -82H8Q13 -82 13 -77V-41H-13Z"/><path d="M-13 -75L-22 -48M13 -75L22 -48" stroke="#1f2328" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<rect x="231.8" y="488" width="188.5" height="54" rx="8" fill="#eceef0"/>
