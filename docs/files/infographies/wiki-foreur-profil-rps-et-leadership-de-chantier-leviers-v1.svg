<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="658" viewBox="0 0 480 658" role="img" aria-labelledby="t d">
<title id="t">Leadership de chantier : les leviers de l’organisation, sur le foreur et sur le binôme foreur-aide-foreur</title>
<desc id="d">Grand titre « Leadership de chantier », sous-titre « Leviers de l’organisation ». Premier panneau, bleu : pastille « Foreur », bandeau « Investir dans son leadership » ; à gauche, trois phrases : sélection intégrant les compétences relationnelles ; formation au leadership ; rôle de leadership reconnu ; à droite, le foreur, casqué, tient un livre bleu et porte un insigne étoilé bleu sur la poitrine. Second panneau, bleu : pastille « Binôme », bandeau « Foreur-aide-foreur » ; trois phrases : surveillance du climat ; coaching pour foreurs en difficulté relationnelle ; signalement et médiation accessibles ; à droite, le foreur et l’aide-foreur, reliés par une double flèche bleue (étiquette CLIMAT). En bas, sous un crochet bleu, le message : « Souvent un acteur clé du climat de l’équipe ». Aucun effet n’est dessiné.</desc>
