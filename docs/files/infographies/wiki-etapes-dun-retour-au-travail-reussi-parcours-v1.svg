<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Retour au travail : 5 étapes</title>
<desc id="d">Parcours en cinq étapes numérotées, reliées de haut en bas par une ligne bleue fléchée ; le même travailleur, en noir, figure à chaque étape. Les étapes 1 et 2, pendant l’absence, sont sur fond gris. 1, Maintien du lien pendant l’absence : chez lui, assis dans un fauteuil, le travailleur tient un téléphone ; une ligne bleue pointillée, portant une bulle de conversation, relie la maison au lieu de travail, un chevalement de mine : contacts réguliers. 2, Planification du retour : assis au bout d’une table, le travailleur fait face à quatre personnes en gris, le médecin traitant, le médecin du travail, l’employeur et le PAE ; sur la table, une feuille bleue : plan écrit. 3, Retour progressif : casqué, de retour au travail, le travailleur avance sur la première de trois marches, démarrage, progression et stabilisation ; une flèche bleue monte vers la plus haute. 4, Soutien des premières semaines : au travail, deux collègues casqués, dont l’un le salue de la main (équipe), et le superviseur, qui lui parle (bulle bleue) ; au-delà d’un trait pointillé, une personne du PAE lui parle aussi. 5, Suivi à long terme : le travailleur, debout, au départ d’une ligne bleue fléchée jalonnée de quatre coches : évaluations.</desc>
