<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Le soutien dans le temps après un événement traumatique</title>
<desc id="d">Axe du temps vertical, sans échelle ni délai, qui part d’un point noir marqué « Événement » et descend jusqu’à une flèche ; il donne l’ordre des phases. En bleu, qui intervient ; en gris, les personnes concernées. Stabilisation : trois personnes sous un toit bleu, à l’abri. Information : la direction, une bulle de parole, s’adresse à cinq personnes, tous les concernés. Soutien collectif, rencontre optionnelle : un intervenant et deux participants à une table, l’un d’eux parle. Soutien individuel, continu : une barre bleue longe tout l’axe ; un intervenant, superviseur ou PAE, écoute une personne qui parle. Surveillance : deux des personnes les plus exposées, chacune avec son questionnaire PCL-5. De là part un embranchement, la référence clinique, si symptômes persistants : une flèche bleue va d’une personne vers un professionnel spécialisé. Après une coupure de l’axe, le suivi long terme : un calendrier près d’une personne.</desc>
