<svg xmlns="http://www.w3.org/2000/svg" width="480" height="399" viewBox="0 0 480 399" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">ISO 12100 : méthode en trois étapes</title><desc id="d">Titre : « ISO 12100 : méthode en trois étapes », sous-titre « Sécurité machine (art. 6.1) ». Figure sur fond noir. Trois étapes numérotées, en escalier : 1, mesures de prévention intrinsèque, à la conception, « première et plus importante étape » ; 2, protection et mesures de prévention complémentaires (protecteurs et dispositifs) ; 3, informations pour l’utilisation (formation, signalisation, manuels), quand les étapes précédentes n’épuisent pas le risque. En bas : au Québec, la modification 2021 de la LSST (art. 59 et 61.2) rend cette hiérarchie obligatoire.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="397.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">ISO 12100 : méthode en trois étapes</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Sécurité machine (art. 6.1)</text><rect x="50.0" y="80.0" width="266.0" height="49.9" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="183.0" y="102.3" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Mesures de prévention intrinsèque</text><text x="183.0" y="119.4" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">à la conception</text><circle cx="32.0" cy="100.0" r="13" fill="#23262d" stroke="#8b939c" stroke-width="1.6"/><text x="32.0" y="105.0" font-weight="800" font-size="14" fill="#f2f6fa" text-anchor="middle">1</text><text x="183.0" y="144.9" font-weight="600" font-size="11.5" fill="#8fa0b3" text-anchor="middle">« Première et plus importante étape »</text><path d="M32.0,113.0 V154.3 H106.0 V166.3" fill="none" stroke="#8b939c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="106.0,167.3 102.2,160.2 109.8,160.2" fill="#8b939c"/><rect x="124.0" y="160.3" width="266.0" height="67.4" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="257.0" y="182.6" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Protection et mesures de prévention</text><text x="257.0" y="200.1" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">complémentaires</text><text x="257.0" y="217.2" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">protecteurs et dispositifs</text><circle cx="106.0" cy="180.3" r="13" fill="#23262d" stroke="#8b939c" stroke-width="1.6"/><text x="106.0" y="185.3" font-weight="800" font-size="14" fill="#f2f6fa" text-anchor="middle">2</text><path d="M106.0,193.3 V233.7 H180.0 V245.7" fill="none" stroke="#8b939c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,246.7 176.2,239.6 183.8,239.6" fill="#8b939c"/><rect x="198.0" y="239.7" width="266.0" height="49.9" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="331.0" y="262.0" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Informations pour l’utilisation</text><text x="331.0" y="279.1" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">formation, signalisation, manuels</text><circle cx="180.0" cy="259.7" r="13" fill="#23262d" stroke="#8b939c" stroke-width="1.6"/><text x="180.0" y="264.7" font-weight="800" font-size="14" fill="#f2f6fa" text-anchor="middle">3</text><text x="331.0" y="304.6" font-weight="600" font-size="11.5" fill="#8fa0b3" text-anchor="middle">quand les étapes précédentes n’épuisent pas le</text><text x="331.0" y="319.0" font-weight="600" font-size="11.5" fill="#8fa0b3" text-anchor="middle">risque</text><rect x="14.0" y="338.4" width="452.0" height="46.0" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="26" y="357.4" font-size="12.5"><tspan font-weight="800" fill="#f2f6fa">Au Québec</tspan><tspan font-weight="500" fill="#b6c2d1"> — la modification 2021 de la LSST (art. 59 et 61.2) rend cette</tspan></text><text x="26.0" y="373.4" font-weight="500" font-size="12.5" fill="#b6c2d1">hiérarchie obligatoire.</text></svg>