<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="t d">
<title id="t">Stress aigu ou chronique : la réaction dans le temps</title>
<desc id="d">Deux graphiques sans graduation, la réaction en hauteur et le temps en largeur. En haut, stress aigu : une courte bande rouge pâle, « enjeu ponctuel » ; la réaction monte quand l’enjeu survient, reste haute pendant la bande, puis, quand la situation se termine, redescend et se rapproche de son niveau de départ, sans s’y poser au bord du dessin : elle tend à s’apaiser. En bas, stress chronique : la bande rouge pâle, « exigences ressenties comme dépassant les ressources », continue jusqu’au bord du dessin ; la réaction monte à la même hauteur et ne redescend pas : elle se prolonge (flèche). Le temps n’a pas d’échelle : la page n’établit pas de seuil en jours ou en mois.</desc>
<rect width="480" height="520" fill="#fbfaf6"/>
<defs><linearGradient id="dure" gradientUnits="userSpaceOnUse" x1="124" y1="0" x2="456" y2="0"><stop offset="0.75" stop-color="#fde3e0"/><stop offset="1" stop-color="#fde3e0" stop-opacity="0.25"/></linearGradient></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Stress aigu ou chronique</text>
<text x="24" y="78" font-size="19" fill="#4b535c">La réaction dans le temps, sans échelle</text>
<!-- Stress aigu : « une réaction face à un enjeu ponctuel ; elle tend à s’apaiser lorsque la situation se termine » -->
<text x="24" y="118" font-size="20" font-weight="700" fill="#1f2328">Stress aigu</text>
<rect x="124" y="152" width="138" height="110" fill="#fde3e0"/>
<g font-size="19" font-weight="600" fill="#c62828"><text x="166" y="204">enjeu</text><text x="166" y="228">ponctuel</text></g>
<path d="M44 262V146M44 262H442" stroke="#6e7781" stroke-width="2.5" fill="none"/><path d="M37 148L44 136L51 148Z" fill="#6e7781"/><path d="M440 255L452 262L440 269Z" fill="#6e7781"/><text x="452" y="288" font-size="19" fill="#4b535c" text-anchor="end">temps</text>
<path d="M44 260H120C138 260 134 166 154 166H262C294 166 314 212 350 226S414 243 436 246" stroke="#1f2328" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g font-size="19" font-weight="700" fill="#1f2328"><text x="346" y="180">tend à</text><text x="346" y="204">s’apaiser</text></g>
<text x="54" y="146" font-size="19" fill="#4b535c">réaction</text>
<!-- Stress chronique : « une réaction qui se prolonge face à des exigences ressenties comme dépassant les ressources disponibles » -->
<text x="24" y="326" font-size="20" font-weight="700" fill="#1f2328">Stress chronique</text>
<rect x="124" y="360" width="332" height="110" fill="url(#dure)"/>
<g font-size="19" font-weight="600" fill="#c62828"><text x="166" y="408">exigences ressenties</text><text x="166" y="432">comme dépassant</text><text x="166" y="456">les ressources</text></g>
<path d="M44 470V354M44 470H442" stroke="#6e7781" stroke-width="2.5" fill="none"/><path d="M37 356L44 344L51 356Z" fill="#6e7781"/><path d="M440 463L452 470L440 477Z" fill="#6e7781"/><text x="452" y="496" font-size="19" fill="#4b535c" text-anchor="end">temps</text>
<path d="M44 468H120C138 468 134 374 154 374H426" stroke="#1f2328" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M424 365L442 374L424 383Z" fill="#1f2328"/>
<text x="452" y="350" font-size="19" font-weight="700" fill="#1f2328" text-anchor="end">se prolonge</text>
<text x="54" y="354" font-size="19" fill="#4b535c">réaction</text>
</g>
</svg>
