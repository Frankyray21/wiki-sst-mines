<path d="M256 368L236 334" stroke-width="13"/>
<path d="M236 334L252 286" stroke-width="19.5"/>
<path d="M252 286L258 270" stroke-width="9.1"/>
<circle cx="261" cy="258" r="11.7" fill="#1f2328" stroke="none"/>
<path d="M250 292L264 314L290 302" stroke="#fbfaf6" stroke-width="15"/>
<path d="M250 292L264 314L290 302" stroke="#1f2328" stroke-width="9.8"/>
<path d="M250 290L276 296L308 296" stroke="#fbfaf6" stroke-width="15"/>
<path d="M250 290L276 296L308 296" stroke="#1f2328" stroke-width="9.8"/>
</g>
<path d="M249 257A12 12 0 0 1 273 257Z" fill="#1f2328"/>
<path d="M245 257H278" stroke="#1f2328" stroke-width="3.5" stroke-linecap="round"/>
<rect x="266" y="249" width="5" height="6" rx="1" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
<!-- Investissement : poussée et sueur (page : « l’effort, l’engagement, la persévérance ») -->
<path d="M174 299H200V290L218 306L200 322V313H174Z" fill="#1565c0"/>
<path d="M230 256Q224 266 230 270Q236 266 230 256Z" fill="#1565c0"/>
<path d="M218 272Q212 282 218 286Q224 282 218 272Z" fill="#1565c0"/>
<!-- Renvois : chaque étiquette pointe vers ce que la forme reconnaît -->
<g stroke="#6e7781" stroke-width="2.5" stroke-linecap="round"><path d="M240 186L252 242"/><path d="M340 186L306 284"/><path d="M130 262L170 302"/><path d="M426 424L426 394"/></g>
<g fill="#6e7781"><circle cx="252" cy="242" r="4"/><circle cx="306" cy="284" r="4"/><circle cx="170" cy="302" r="4"/><circle cx="426" cy="394" r="4"/></g>
<!-- Étiquettes (mots du tableau « Les quatre formes ») -->
<text x="24" y="150" font-size="20" font-weight="700" fill="#1f2328">Existentielle</text>
<text x="24" y="174" font-size="19" fill="#4b535c">la personne, son humanité</text>
<text x="456" y="150" font-size="20" font-weight="700" fill="#1f2328" text-anchor="end">Pratique</text>
<text x="456" y="174" font-size="19" fill="#4b535c" text-anchor="end">le «&#160;comment&#160;»</text>
<text x="24" y="226" font-size="20" font-weight="700" fill="#1f2328">Investissement</text>
<text x="24" y="250" font-size="19" fill="#4b535c">l’effort, l’engagement</text>
<text x="456" y="444" font-size="20" font-weight="700" fill="#1f2328" text-anchor="end">Résultats</text>
<text x="456" y="468" font-size="19" fill="#4b535c" text-anchor="end">le «&#160;quoi&#160;», ce qui est livré</text>
<!-- Piège (page : « Beaucoup d’organisations se concentrent sur une seule (les résultats) et oublient les autres ») -->
<text x="24" y="510" font-size="20" font-weight="700" fill="#1f2328">Beaucoup d’organisations</text>
<text x="24" y="534" font-size="19" fill="#4b535c">se concentrent sur une seule</text>
<g font-size="19" text-anchor="middle">
<rect x="24" y="552" width="105" height="40" rx="6" fill="#fbfaf6" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="76.5" y="578" fill="#c62828">personne</text>
<rect x="133" y="552" width="105" height="40" rx="6" fill="#fbfaf6" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="185.5" y="578" fill="#c62828">pratique</text>
<rect x="242" y="552" width="105" height="40" rx="6" fill="#fbfaf6" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="294.5" y="578" fill="#c62828">effort</text>
<rect x="351" y="552" width="105" height="40" rx="6" fill="#1f2328"/>
<text x="403.5" y="578" fill="#fbfaf6" font-weight="700">résultats</text>
</g>
<path d="M26 602V610H345V602M185.5 610V616" stroke="#c62828" stroke-width="2.5" fill="none"/>
<text x="24" y="640" font-size="19" font-weight="700" fill="#c62828">oubliées&#160;: besoins non satisfaits</text>
</g>
</svg>
