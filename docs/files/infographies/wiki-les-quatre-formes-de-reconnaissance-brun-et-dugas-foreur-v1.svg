<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="652" viewBox="0 0 480 652" role="img" aria-labelledby="t d">
<title id="t">Quatre formes de reconnaissance au travail (Brun et Dugas)</title>
<desc id="d">Un foreur casqué pousse sa foreuse contre un front de roche déjà percé de trous. Quatre étiquettes montrent ce que chaque forme reconnaît chez ce même travailleur : « Existentielle, la personne, son humanité » pointe vers le travailleur lui-même ; « Pratique, le comment » pointe vers ses mains sur la foreuse, sa manière de travailler ; « Investissement, l’effort, l’engagement » pointe vers une flèche bleue de poussée, avec des gouttes de sueur ; « Résultats, le quoi, ce qui est livré » pointe vers le front percé de trous, ce que le foreur a livré. En bas : beaucoup d’organisations se concentrent sur une seule forme ; dans une rangée de quatre cases, personne, pratique, effort et résultats, seule la case résultats est pleine ; les trois autres, en pointillés rouges, sont oubliées : besoins non satisfaits.</desc>
<rect width="480" height="652" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Quatre formes</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">de reconnaissance</text>
<text x="24" y="108" font-size="19" fill="#4b535c">Ce que chacune reconnaît (Brun et Dugas)</text>
<!-- Scène : un foreur et son propre travail (page : « un foreur », « un aide-foreur qui se forme pour devenir foreur ») -->
<path d="M24 410H456" stroke="#6e7781" stroke-width="2.5"/>
<!-- Front de roche percé : la volée forée, ce que le foreur livre -->
<path d="M364 196H456V410H358L366 360L356 318L364 270L358 232Z" fill="#eceef0" stroke="#6e7781" stroke-width="2.5" stroke-linejoin="round"/>
<g fill="#4b535c"><circle cx="386" cy="224" r="6"/><circle cx="412" cy="218" r="6"/><circle cx="440" cy="226" r="6"/><circle cx="388" cy="258" r="6"/><circle cx="440" cy="262" r="6"/><circle cx="412" cy="292" r="6"/><circle cx="388" cy="330" r="6"/><circle cx="440" cy="326" r="6"/><circle cx="412" cy="356" r="6"/><circle cx="386" cy="384" r="6"/><circle cx="440" cy="384" r="6"/></g>
<!-- Foreuse : corps, fleuret, béquille -->
