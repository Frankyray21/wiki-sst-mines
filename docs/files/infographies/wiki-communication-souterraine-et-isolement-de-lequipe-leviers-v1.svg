<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Compenser l’isolement au fil du quart</title>
<desc id="d">Coupe d’une mine : le quart de travail se lit de gauche à droite, de la surface au fond et retour. En haut à gauche, à la surface, avant le quart : un travailleur parle à ses collègues casqués, bulle bleue : briefing de quart. En haut à droite, après le quart : des travailleurs se parlent, bulles bleues : debriefing en surface. Dans le puits, sous le chevalement, une flèche à double sens : la descente et la remontée. Sous terre, pendant le quart : au pied du puits, à la recette, un téléphone relié à la surface par une ligne bleue, obligatoire selon le RSSM, article 283. Dans la galerie, le contremaître, en bleu, marche vers l’équipe, une radio à la main ; un travailleur de l’équipe lui répond par radio et les ondes bleues vont de l’un à l’autre : check-in radio régulier, aussi moment de soutien et de détection. Sous le contremaître : présence du contremaître. Aucune fréquence ni durée n’est indiquée.</desc>
