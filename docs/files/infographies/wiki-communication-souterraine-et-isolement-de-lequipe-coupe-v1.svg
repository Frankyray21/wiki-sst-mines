<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Ce qui isole l’équipe sous terre</title>
<desc id="d">Coupe d’une mine souterraine. En haut, la surface : un chevalement au-dessus du puits et un bâtiment bleu, les ressources de surface. Dans le puits, une flèche remonte jusqu’à la surface : « loin de la surface ». Plus haut dans la roche, une autre galerie où se tient une autre équipe. Tout en bas, au chantier, l’équipe, casquée. Un travailleur parle dans une radio ; ses ondes se brisent en rouge : zones blanches, parasites. Un autre regarde vers l’autre équipe : son regard, en pointillé, est arrêté par la roche, marqué d’une croix rouge : pas de contact visuel. Un foreur perce le front de taille ; un ventilateur souffle dans une conduite près du plafond ; des traits rouges en dents de scie marquent le bruit du forage et de la ventilation. En bas : casques et équipement de protection limitent le non-verbal. Aucune distance ni durée n’est indiquée.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
