<svg xmlns="http://www.w3.org/2000/svg" width="480" height="628" viewBox="0 0 480 628" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Leviers de prévention</title><desc id="d">Titre : « Leviers de prévention », sous-titre « Aide-foreur, profil RPS ». Infographie sur fond sombre. Section verte « Primaire » (Niveau). Concevoir le poste avec une marge de manœuvre minimale (séquençage, méthodes) ; Plan de progression clair vers foreur. Rotation des paires foreur-aide-foreur, si applicable ; Reconnaissance institutionnelle du poste. Section bleue « Secondaire » (Niveau). Formation des foreurs au leadership et à la communication ; Sensibilisation des superviseurs au profil RPS du poste. Section verte « Tertiaire » (Niveau). Mécanismes de signalement accessibles, en cas de conflit avec le foreur. En bas, « Repère rapide » : évolution typique : aide-foreur, puis foreur, puis contremaître ou postes spécialisés.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a24"/><stop offset="1" stop-color="#07121a"/></linearGradient><radialGradient id="h" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#15324a" stop-opacity="0.55"/><stop offset="1" stop-color="#15324a" stop-opacity="0"/></radialGradient><filter id="lueur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.4"/></filter></defs><rect width="480" height="628" fill="url(#f)"/><rect width="480" height="628" fill="url(#h)"/><text x="240.0" y="34.0" font-weight="900" font-size="25" fill="#ffffff" text-a