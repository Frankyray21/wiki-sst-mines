<circle cx="144" cy="351.2" r="7.2" fill="#1f2328"/>
<rect x="70" y="372" width="148" height="9" rx="2" fill="#eceef0" stroke="#6e7781" stroke-width="2.5"/>
<path d="M82 381V388M206 381V388" stroke="#6e7781" stroke-width="3"/>
<text x="240" y="337" font-size="20" font-weight="700" fill="#1f2328">Médiation formelle</text>
<text x="240" y="361" font-size="19" fill="#4b535c">tiers neutre formé</text>
<text x="240" y="385" font-size="19" fill="#4b535c">il ne tranche pas</text>
