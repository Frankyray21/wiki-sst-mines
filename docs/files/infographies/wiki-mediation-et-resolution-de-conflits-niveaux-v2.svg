<text x="240" y="241" font-size="20" font-weight="700" fill="#1f2328">Arbitrage</text>
<text x="240" y="265" font-size="19" fill="#4b535c">décision imposée</text>
<text x="240" y="289" font-size="19" fill="#4b535c">par autorité</text>
<!-- Procédure formelle : à part, hors de la colonne de la flèche ; la plainte part à l’écart de l’autre personne -->
<rect x="62" y="100" width="402" height="112" rx="10" fill="#fde3e0"/>
<path d="M64.5 106V206" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
