<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="t d">
<title id="t">Niveaux d’intervention dans un conflit</title>
<desc id="d">Niveaux d’intervention empilés dans l’ordre du tableau, du plus léger en bas jusqu’à l’arbitrage en haut. Dans chaque scène, les deux mêmes personnes en conflit, en gris. Auto-résolution, en bas (conversation directe) : les deux personnes se parlent, chacune avec sa bulle. Facilitation par superviseur : un superviseur, en noir, se tient entre elles pendant qu’elles se parlent ; il aide la conversation. Médiation formelle : les trois sont assis à une table, le tiers neutre formé au centre ; il ne tranche pas. Arbitrage : une autorité, en noir, surélevée sur une estrade, envoie une flèche vers chacune des deux personnes : décision imposée par autorité. À gauche, une flèche grise part de « commencer ici », sous l’auto-résolution, et s’arrête à l’arbitrage. Au-dessus, à part et hors de la colonne de la flèche, dans un bandeau rouge pâle bordé de rouge : la procédure formelle, où l’une des deux personnes remet un document écrit, la plainte (harcèlement, normes du travail), du côté opposé à l’autre personne.</desc>
<rect width="480" height="640" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Niveaux d’intervention</text>
<text x="24" y="76" font-size="19" fill="#4b535c">Selon la gravité du conflit</text>
