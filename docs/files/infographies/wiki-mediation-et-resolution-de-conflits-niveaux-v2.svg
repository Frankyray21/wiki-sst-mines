<text x="240" y="433" font-size="20" font-weight="700" fill="#1f2328">Facilitation par</text>
<text x="240" y="457" font-size="20" font-weight="700" fill="#1f2328">superviseur</text>
<text x="240" y="481" font-size="19" fill="#4b535c">aide la conversation</text>
