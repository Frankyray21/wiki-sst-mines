<circle cx="38" cy="364" r="6" fill="#fbfaf6" stroke="#6e7781" stroke-width="3"/>
<circle cx="38" cy="268" r="6" fill="#fbfaf6" stroke="#6e7781" stroke-width="3"/>
<text x="24" y="614" font-size="19" font-weight="700" fill="#1f2328">commencer ici</text>
