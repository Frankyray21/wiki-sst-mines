<svg xmlns="http://www.w3.org/2000/svg" width="480" height="626" viewBox="0 0 480 626" role="img" aria-labelledby="t d">
<title id="t">Stress en mine : un exemple par niveau</title>
<desc id="d">Un exemple minier par niveau, en trois rangées. Primaire, sur les causes : un horaire en rotation, des jours (soleils) puis des nuits (lunes sur fond rouge), qui se poursuit hors du cadre ; un crayon bleu le réaménage : aménager les horaires. Secondaire, sur les capacités : un mineur casqué, courbé, montre des premiers signes (traits rouges) ; un superviseur, en face, lui parle (bulle bleue) : superviseur formé, repère les signaux. Tertiaire, sur les conséquences : un mineur, en rouge, est assis, la tête dans la main ; une personne pose la main sur son dos (bras bleu) et une flèche bleue le mène, debout, vers son retour au travail : PAE, plan de retour au travail. Mention : « Sans le primaire, le problème n’est pas réglé. »</desc>
