<text x="226" y="234" font-size="20" font-weight="700" fill="#1f2328">Planification</text>
<text x="226" y="260" font-size="20" font-weight="700" fill="#1f2328">du retour</text>
<circle cx="40" cy="358" r="20" fill="#1565c0"/>
<text x="40" y="366" font-size="23" font-weight="700" fill="#fbfaf6" text-anchor="middle">3</text>
<text x="226" y="365" font-size="20" font-weight="700" fill="#1f2328">Retour progressif</text>
<circle cx="40" cy="476" r="20" fill="#1565c0"/>
