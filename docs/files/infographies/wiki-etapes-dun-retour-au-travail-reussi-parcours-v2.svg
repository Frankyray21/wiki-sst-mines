<text x="226" y="470" font-size="20" font-weight="700" fill="#1f2328">Soutien des</text>
<text x="226" y="496" font-size="20" font-weight="700" fill="#1f2328">premières semaines</text>
<circle cx="40" cy="594" r="20" fill="#1565c0"/>
