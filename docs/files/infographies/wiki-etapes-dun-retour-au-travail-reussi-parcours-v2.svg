<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Cinq étapes du retour au travail, de l’absence au suivi</title>
<desc id="d">Vue d’ensemble du parcours d’un même travailleur, en noir, en cinq stations numérotées le long d’une voie bleue qui descend jusqu’à une flèche. 1, Maintien du lien pendant l’absence : chez lui, assis, il tient un téléphone ; une bulle bleue arrive de l’extérieur de la maison. 2, Planification du retour : sans casque, il tient un plan écrit. 3, Retour progressif : casqué, il se tient sur la première de trois marches ; une flèche bleue monte vers la plus haute. 4, Soutien des premières semaines : un superviseur, en bleu, lui parle. 5, Suivi à long terme : il avance ; devant lui, une ligne fléchée porte quatre coches, les évaluations. Aucune durée n’est indiquée.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Cinq étapes du retour</text>
