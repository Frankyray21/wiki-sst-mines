<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Lignes de défense (Reason)</title><desc id="d">Titre : « Lignes de défense (Reason) », sous-titre « Plusieurs barrières percées s’alignent pour laisser passer le danger ». Figure sur fond noir. Sous le titre, la légende : l’ambre marque le danger, jusqu’à l’accident. Trois barrières percées, nommées technique, individuel et organisationnel ; une flèche ambre partie de « Danger » traverse un trou de chaque barrière, alignés, et atteint « Accident ». En bas : selon le modèle de Reason, un accident résulte de défaillances combinées au niveau technique, individuel et organisationnel.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="378.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">Lignes de défense (Reason)</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Plusieurs barrières percées s’alignent pour laisser passer le danger</text><rect x="155.8" y="67.0" width="12" height="12" rx="3" fill="#fbb843"/><text x="173.8" y="77.0" font-weight="600" font-size="12" fill="#b6c2d1">le danger, jusqu’à l’accident</text><polygon points="112.0,134.0 158.0,112.0 158.0,260.0 112.0,282.0" fill="#2e3239" stroke="#4d545e" stroke-width="1.6" stroke-linejoin="round"/><polygon points="158.0,112.0 170.0,117.0 170.0,265.0 158.0,260.0" fill="#23262d" stroke="#4d545e" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="135.0" cy="146.6" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><ellipse cx="135.0" cy="247.4" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><ellipse cx="135.0" cy="203.0" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><text x="138.0" y="304.0" font-weight="700" font-size="13" fill="#f2f6fa" text-anchor="middle">Technique</text><polygon points="216.0,134.0 262.0,112.0 262.0,260.0 216.0,282.0" fill="#2e3239" stroke="#4d545e" stroke-width="1.6" stroke-linejoin="round"/><polygon points="262.0,112.0 274.0,117.0 274.0,265.0 262.0,260.0" fill="#23262d" stroke="#4d545e" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="239.0" cy="159.2" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><ellipse cx="239.0" cy="239.8" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><ellipse cx="239.0" cy="203.0" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><text x="242.0" y="304.0" font-weight="700" font-size="13" fill="#f2f6fa" text-anchor="middle">Individuel</text><polygon points="320.0,134.0 366.0,112.0 366.0,260.0 320.0,282.0" fill="#2e3239" stroke="#4d545e" stroke-width="1.6" stroke-linejoin="round"/><polygon points="366.0,112.0 378.0,117.0 378.0,265.0 366.0,260.0" fill="#23262d" stroke="#4d545e" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="343.0" cy="141.6" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><ellipse cx="343.0" cy="234.8" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><ellipse cx="343.0" cy="203.0" rx="9" ry="12" fill="#16181d" stroke="#4d545e" stroke-width="1"/><text x="346.0" y="304.0" font-weight="700" font-size="13" fill="#f2f6fa" text-anchor="middle">Organisationnel</text><text x="40.0" y="187.0" font-weight="800" font-size="13" fill="#fbb843" text-anchor="middle">Danger</text><line x1="22.0" y1="203.0" x2="374.0" y2="203.0" stroke="#fbb843" stroke-width="3" stroke-linecap="round"/><polygon points="384.0,203.0 373.4,208.6 373.4,197.4" fill="#fbb843"/><rect x="388.0" y="183.0" width="78.0" height="34.9" rx="10" fill="#1d2026" stroke="#fbb843" stroke-width="1.3"/><text x="427.0" y="205.8" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Accident</text><rect x="14.0" y="320.0" width="452.0" height="46.0" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="26" y="339.0" font-size="12.5"><tspan font-weight="800" fill="#f2f6fa">Le modèle de Reason</tspan><tspan font-weight="500" fill="#b6c2d1"> — un accident résulte de défaillances combinées au</tspan></text><text x="26.0" y="355.0" font-weight="500" font-size="12.5" fill="#b6c2d1">niveau technique, individuel et organisationnel.</text></svg>