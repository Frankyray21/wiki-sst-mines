<svg xmlns="http://www.w3.org/2000/svg" width="480" height="568" viewBox="0 0 480 568" role="img" aria-labelledby="t d">
<title id="t">Charge mentale sous terre : les leviers</title>
<desc id="d">Grand titre : Charge mentale sous terre, en confinement, à grande profondeur. Un panneau bleu, « Leviers », avec le bandeau : conception, procédures, équipe. À gauche, trois phrases : listes de vérification ; pauses régulières en zone décompressante ; rotation entre tâches à charge cognitive variée. À droite, une galerie vue dans l’axe, qui se divise au fond en deux ouvertures identiques : des luminaires bleus sous la voûte (éclairage) et, au-dessus des deux ouvertures, des panneaux fléchés bleus (repères). Au premier plan, un mineur casqué, de face, tient d’une main le volant d’une vanne et de l’autre une liste de vérification bleue, cochée. En bas, le message : agir avant l’épuisement. Ni durée, ni fréquence, ni effet.</desc>
<rect width="480" height="568" fill="#fbfaf6"/>
