<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">L’axe HHS : le circuit qui libère le cortisol</title>
<desc id="d">Buste d’un mineur casqué, vu de face, avec trois organes situés. Une flèche venue de l’extérieur, « une demande », entre dans la tête jusqu’à l’hypothalamus, au centre de la tête. De l’hypothalamus, une flèche descend vers l’hypophyse, juste en dessous ; de l’hypophyse, une flèche descend par le cou jusqu’aux surrénales, deux petits capuchons posés sur les reins. Des surrénales, des points bleus, le cortisol, partent dans le corps, au bout du circuit : mobilisation immédiate des ressources. En bas, la durée de l’activation, sans échelle : une barre bleue courte, quelques heures, utile ; une barre rouge longue, des mois, coûteuse.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
<defs>
<marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f2328"/></marker>
<marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1565c0"/></marker>
</defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">L’axe HHS</text>
<text x="24" y="76" font-size="19" fill="#4b535c">hypothalamo-hypophyso-surrénalien</text>
<!-- Buste de face (silhouette neutre) ; casque : lecteurs miniers -->
<path d="M110 282V256H150V282Q198 286 210 314L216 540H44L50 314Q62 286 110 282Z" fill="#eceef0" stroke="#6e7781" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="130" cy="204" rx="54" ry="62" fill="#eceef0" stroke="#6e7781" stroke-width="3"/>
<path d="M76 176A54 50 0 0 1 184 176Z" fill="#6e7781"/>
<path d="M68 176H192" stroke="#6e7781" stroke-width="5" stroke-linecap="round"/>
<rect x="124" y="142" width="12" height="12" rx="2" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<!-- « une demande » (page : « lorsque l’organisme doit répondre à une demande ») -->
<text x="246" y="140" font-size="19" font-weight="700" fill="#1f2328">une demande</text>
<path d="M240 134C200 134 176 154 156 180" stroke="#1f2328" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#fl)"/>
<!-- Hypothalamus, puis hypophyse (ordre du nom de l’axe) -->
<ellipse cx="130" cy="192" rx="17" ry="10" fill="#1565c0"/>
<path d="M130 203V217" stroke="#1f2328" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fl)"/>
<circle cx="130" cy="228" r="9" fill="#1565c0"/>
<path d="M150 194H238M141 230H238" stroke="#6e7781" stroke-width="2.5"/>
<text x="246" y="201" font-size="19" fill="#1f2328">hypothalamus</text>
<text x="246" y="237" font-size="19" fill="#1f2328">hypophyse</text>
<!-- Hypophyse → surrénales -->
<path d="M130 239V396" stroke="#1f2328" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<path d="M130 396L107 420" stroke="#1f2328" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#fl)"/>
<path d="M130 396L153 420" stroke="#1f2328" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#fl)"/>
<!-- Reins (repère neutre) et surrénales posées dessus -->
<ellipse cx="96" cy="474" rx="17" ry="28" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<ellipse cx="164" cy="474" rx="17" ry="28" fill="#fbfaf6" stroke="#6e7781" stroke-width="2.5"/>
<path d="M80 450Q96 422 112 450Z" fill="#1565c0"/>
<path d="M148 450Q164 422 180 450Z" fill="#1565c0"/>
<path d="M180 446H238" stroke="#6e7781" stroke-width="2.5"/>
<text x="246" y="453" font-size="19" font-weight="700" fill="#1f2328">surrénales</text>
<text x="246" y="477" font-size="19" fill="#4b535c">sur les reins</text>
<!-- Cortisol : libéré par les surrénales ; « mobilisation immédiate des ressources » (page, phase d’alarme) -->
<g fill="none" stroke="#1565c0" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round">
<path d="M88 432C70 400 66 360 70 322" marker-end="url(#fb)"/>
<path d="M172 432C190 400 194 360 190 322" marker-end="url(#fb)"/>
</g>
<g fill="#1565c0">
<circle cx="78" cy="380" r="5"/><circle cx="182" cy="380" r="5"/><circle cx="72" cy="346" r="5"/><circle cx="188" cy="346" r="5"/>
<circle cx="100" cy="330" r="5"/><circle cx="160" cy="330" r="5"/>
</g>
<path d="M196 336H238" stroke="#6e7781" stroke-width="2.5"/>
<text x="246" y="343" font-size="20" font-weight="700" fill="#1565c0">cortisol</text>
<text x="246" y="372" font-size="19" fill="#1f2328">mobilisation</text>
<text x="246" y="396" font-size="19" fill="#1f2328">immédiate</text>
<text x="246" y="420" font-size="19" fill="#1f2328">des ressources</text>
<!-- Durée de l’activation, sans échelle (page, introduction) -->
<text x="24" y="584" font-size="19" fill="#4b535c">Durée de l’activation, sans échelle</text>
<rect x="24" y="600" width="60" height="16" rx="3" fill="#1565c0"/>
<text x="96" y="615" font-size="19" fill="#1f2328">quelques heures : <tspan font-weight="700" fill="#1565c0">utile</tspan></text>
<rect x="24" y="630" width="196" height="16" rx="3" fill="#c62828"/>
<text x="232" y="645" font-size="19" fill="#1f2328">des mois : <tspan font-weight="700" fill="#c62828">coûteuse</tspan></text>
</g>
</svg>
