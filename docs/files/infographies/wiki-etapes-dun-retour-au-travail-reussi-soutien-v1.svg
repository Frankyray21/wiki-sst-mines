<svg xmlns="http://www.w3.org/2000/svg" width="480" height="624" viewBox="0 0 480 624" role="img" aria-labelledby="t d">
<title id="t">Étape 4 : soutien des premières semaines</title>
<desc id="d">Étape 4, soutien des premières semaines. En haut à gauche, le superviseur formé, en bleu, casqué, tient le plan écrit marqué d’une coche et parle avec le travailleur, en noir, qui lui répond : deux bulles, « conversations régulières, écoute, ajustements » ; sous eux, « superviseur formé » et « aménagements respectés ». À droite, au-delà d’un trait pointillé, le PAE, en bleu, parle aussi : « suivi clinique en parallèle si nécessaire ». En bas, « Climat d’équipe », deux cadres : en bleu, « préparé à accueillir », deux collègues accueillent le travailleur, l’un le salue de la main, l’autre lui parle ; en rouge, « pas à surveiller », deux collègues le fixent : au-dessus de la tête de chacun, un petit œil bleu ; leurs regards, en pointillés rouges, convergent sur lui.</desc>
