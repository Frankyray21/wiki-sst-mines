<svg xmlns="http://www.w3.org/2000/svg" width="480" height="372" viewBox="0 0 480 372" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Nœud papillon</title><desc id="d">Titre : « Nœud papillon », sous-titre « Autour d’un événement redouté central ». Figure sur fond noir. Sous le titre, la légende : l’ambre marque l’événement redouté. À gauche, en amont, les causes (arbre de défaillance) : trois cases « Cause » dont les flèches convergent vers l’événement redouté, au centre. À droite, en aval, les conséquences (arbre d’événements) : trois flèches partent de l’événement redouté vers trois cases « Conséquence ». En bas, exemple historique : incendie d’usine de peinture en Allemagne (2008), fuite de CO2, 107 intoxications.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="370.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">Nœud papillon</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Autour d’un événement redouté central</text><rect x="174.5" y="67.0" width="12" height="12" rx="3" fill="#fbb843"/><text x="192.5" y="77.0" font-weight="600" font-size="12" fill="#b6c2d1">l’événement redouté</text><text x="80.0" y="118.0" font-weight="800" font-size="13.5" fill="#f2f6fa" text-anchor="middle">En amont : causes</text><text x="80.0" y="134.0" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">arbre de défaillance</text><text x="400.0" y="118.0" font-weight="800" font-size="13.5" fill="#f2f6fa" text-anchor="middle">En aval : conséquences</text><text x="400.0" y="134.0" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">arbre d’événements</text><polygon points="24.0,142.0 198.0,219.0 24.0,292.0" fill="#1f2227" stroke="#2b3038" stroke-width="1" stroke-linejoin="round"/><polygon points="456.0,142.0 282.0,219.0 456.0,292.0" fill="#1f2227" stroke="#2b3038" stroke-width="1" stroke-linejoin="round"/><rect x="26.0" y="150.0" width="110.0" height="30.2" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="81.0" y="170.3" font-weight="700" font-size="13" fill="#f2f6fa" text-anchor="middle">Cause</text><line x1="136.0" y1="167.0" x2="189.5" y2="215.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="194.0,219.0 186.2,217.1 191.2,211.5" fill="#8b939c"/><rect x="344.0" y="150.0" width="110.0" height="30.2" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="399.0" y="170.3" font-weight="700" font-size="13" fill="#f2f6fa" text-anchor="middle">Conséquence</text><line x1="286.0" y1="219.0" x2="335.7" y2="171.2" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="340.0,167.0 337.5,174.6 332.3,169.2" fill="#8b939c"/><rect x="26.0" y="202.0" width="110.0" height="30.2" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="81.0" y="222.3" font-weight="700" font-size="13" fill="#f2f6fa" text-anchor="middle">Cause</text><line x1="136.0" y1="219.0" x2="188.0" y2="219.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="194.0,219.0 186.9,222.8 186.9,215.2" fill="#8b939c"/><rect x="344.0" y="202.0" width="110.0" height="30.2" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="399.0" y="222.3" font-weight="700" font-size="13" fill="#f2f6fa" text-anchor="middle">Conséquence</text><lin