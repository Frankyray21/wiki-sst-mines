<text x="51" y="113" font-size="19" fill="#4b535c">facteur de risque</text>
<circle cx="245" cy="107" r="9" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5"/>
<text x="262" y="113" font-size="19" fill="#4b535c">facteur favorable</text>

