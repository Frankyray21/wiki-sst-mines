<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="649" viewBox="0 0 480 649" role="img" aria-labelledby="t d">
<title id="t">Quand les facteurs s’accumulent</title>
<desc id="d">Deux rangées montrent le même travailleur, casque de mineur, au centre d’un anneau de six pastilles : les six familles de facteurs de la section « Catégories » (charge de travail, un cadran ; latitude décisionnelle, un embranchement ; soutien social, deux personnes ; reconnaissance, une étoile ; communication et information, une bulle ; relations interpersonnelles, deux maillons). Une pastille rouge est un facteur de risque, une pastille bleue un facteur favorable. Une flèche mène de l’anneau à une jauge verticale marquée « risque ». En haut, « Un seul facteur de risque » : seule la surcharge est en rouge ; la jauge est peu remplie. En bas, « Plusieurs facteurs de risque » : surcharge, manque de contrôle, manque de soutien et reconnaissance absente sont en rouge ; la jauge est nettement plus remplie, un trait pointillé y rappelle le niveau du haut et une flèche montre la hausse. Les jauges n’ont pas d’échelle : elles montrent seulement que le risque augmente quand les facteurs s’accumulent, pas de combien.</desc>
<rect width="480" height="649" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Quand les facteurs</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">s’accumulent</text>
