<!-- Voies respiratoires simplifiées : fosses nasales, bouche, pharynx, larynx, trachée -->
<path d="M174 208C156 194 124 188 102 192C94 194 90 200 90 210V284L96 300V392H114V300L116 290L112 250C128 252 150 246 166 234V228C150 222 128 222 112 226V216C128 212 152 212 170 214Z" fill="#e1ecfa" stroke="#6e7781" stroke-width="2.5" stroke-linejoin="round"/>

<!-- Arbre bronchique -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
