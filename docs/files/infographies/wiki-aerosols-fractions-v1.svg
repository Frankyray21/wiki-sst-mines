<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="610" viewBox="0 0 480 610" role="img" aria-labelledby="t d">
<title id="t">La zone atteinte par chaque fraction</title>
<desc id="d">Silhouette de profil, tête et thorax, avec les voies respiratoires simplifiées : fosses nasales et bouche, pharynx, larynx, trachée, bronches, puis grappes d’alvéoles. Deux lignes pointillées découpent trois zones, de haut en bas : voies aériennes supérieures (nez, bouche, larynx), région trachéo-bronchique, région alvéolaire. Devant le visage, trois particules partent à la hauteur du nez et de la bouche ; chaque flèche descend jusqu’à la zone qu’atteint sa fraction. Fraction inhalable (Pi) : entre par le nez et la bouche ; sa flèche, la plus courte, reste dans la première zone. Fraction thoracique (Pthor) : pénètre au-delà du larynx ; sa flèche franchit la première ligne pointillée et arrive dans la région trachéo-bronchique. Fraction respirable (Pr) : atteint les alvéoles ; sa flèche, la plus longue, arrive dans la région alvéolaire. Aucune taille n’est indiquée.</desc>
<rect width="480" height="610" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">La zone atteinte</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">par chaque fraction</text>

<!-- Silhouette de profil (tête et thorax), tournée vers la droite -->
