<g fill="#1f2328">
<circle cx="204" cy="218" r="6"/>
<circle cx="222" cy="218" r="6"/>
<circle cx="240" cy="218" r="6"/>
</g>
<g stroke="#1f2328" stroke-width="4" fill="none" stroke-linecap="round">
<path d="M204 228V520"/>
<path d="M222 228V376"/>
<path d="M240 228V250"/>
</g>
