<!-- Zone 1 -->
<text x="256" y="128" font-size="19" fill="#4b535c">voies aériennes</text>
<text x="256" y="152" font-size="19" fill="#4b535c">supérieures</text>
<text x="256" y="176" font-size="19" fill="#4b535c">nez, bouche, larynx</text>
<text x="256" y="240" font-size="20" font-weight="700" fill="#1f2328">inhalable <tspan font-weight="400" fill="#4b535c">(Pi)</tspan></text>
<text x="256" y="264" font-size="19" fill="#1f2328">entre par le nez</text>
<text x="256" y="288" font-size="19" fill="#1f2328">et la bouche</text>

<!-- Zone 2 -->
<text x="238" y="334" font-size="19" fill="#4b535c">région trachéo-</text>
<text x="238" y="358" font-size="19" fill="#4b535c">bronchique</text>
<text x="238" y="396" font-size="20" font-weight="700" fill="#1f2328">thoracique <tspan font-weight="400" fill="#4b535c">(Pthor)</tspan></text>
<text x="238" y="420" font-size="19" fill="#1f2328">pénètre au-delà</text>
<text x="238" y="444" font-size="19" fill="#1f2328">du larynx</text>

<!-- Zone 3 -->
<text x="220" y="490" font-size="19" fill="#4b535c">région alvéolaire</text>
<text x="220" y="530" font-size="20" font-weight="700" fill="#1f2328">respirable <tspan font-weight="400" fill="#4b535c">(Pr)</tspan></text>
<text x="220" y="554" font-size="19" fill="#1f2328">atteint les alvéoles</text>
</g>
</svg>
