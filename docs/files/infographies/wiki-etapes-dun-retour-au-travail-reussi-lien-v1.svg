<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="612" viewBox="0 0 480 612" role="img" aria-labelledby="t d">
<title id="t">Étape 1 : maintien du lien pendant l’absence</title>
<desc id="d">Étape 1, maintien du lien pendant l’absence. En haut, chez lui, le travailleur assis tient un téléphone ; une ligne pointillée bleue le relie à un chevalement de mine, « organisation ». Sur la ligne, une bulle bleue : « contacts réguliers et bienveillants » ; sous la ligne, une feuille d’annonce : « changements importants ». Dans la maison, derrière lui, un dossier marqué d’une croix est fermé par un cadenas bleu : « pas de discussion sur les conditions médicales ». En bas, deux cadres rouges, « À éviter » : « silence total », le travailleur seul, voûté, le téléphone muet posé sur une table, « sentiment d’abandon » ; « contacts pressants », le travailleur au téléphone entouré de quatre bulles rouges, « sentiment de pression ».</desc>
<rect width="480" height="612" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<circle cx="42" cy="38" r="19" fill="#1565c0"/>
<text x="42" y="45.6" font-size="22" font-weight="700" fill="#fbfaf6" text-anchor="middle">1</text>
<text x="72" y="46" font-size="26" font-weight="700" fill="#1f2328">Maintien du lien</text>
<text x="72" y="78" font-size="26" font-weight="700" fill="#1f2328">pendant l’absence</text>
