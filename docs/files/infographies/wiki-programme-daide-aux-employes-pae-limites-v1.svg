<g transform="translate(286 340) scale(1.25)"><circle cx="0" cy="-53" r="9" fill="#1f2328"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1f2328"/><g transform="translate(0 -57)"><path d="M-10.5 3C-10.5 -5.5 -5.5 -10.5 0 -10.5C5.5 -10.5 10.5 -5.5 10.5 3Z" fill="#1f2328"/><rect x="-14" y="2" width="28" height="4.5" rx="2.25" fill="#1f2328"/><path d="M-2.6 -9.6V2.2M2.6 -9.6V2.2" stroke="#fbfaf6" stroke-width="2.5"/></g><g transform="translate(0 -31) rotate(-35)"><rect x="-15" y="-5.5" width="30" height="11" rx="5.5" fill="#1565c0" stroke="#fbfaf6" stroke-width="2.5"/><rect x="-4.5" y="-3.5" width="9" height="7" rx="1" fill="#e1ecfa"/></g></g>
<g transform="translate(348 340) scale(1.25)"><circle cx="0" cy="-53" r="9" fill="#1f2328"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1f2328"/><g transform="translate(0 -57)"><path d="M-10.5 3C-10.5 -5.5 -5.5 -10.5 0 -10.5C5.5 -10.5 10.5 -5.5 10.5 3Z" fill="#1f2328"/><rect x="-14" y="2" width="28" height="4.5" rx="2.25" fill="#1f2328"/><path d="M-2.6 -9.6V2.2M2.6 -9.6V2.2" stroke="#fbfaf6" stroke-width="2.5"/></g><g transform="translate(0 -31) rotate(-35)"><rect x="-15" y="-5.5" width="30" height="11" rx="5.5" fill="#1565c0" stroke="#fbfaf6" stroke-width="2.5"/><rect x="-4.5" y="-3.5" width="9" height="7" rx="1" fill="#e1ecfa"/></g></g>
<g transform="translate(410 340) scale(1.25)"><circle cx="0" cy="-53" r="9" fill="#1f2328"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1f2328"/><g transform="translate(0 -57)"><path d="M-10.5 3C-10.5 -5.5 -5.5 -10.5 0 -10.5C5.5 -10.5 10.5 -5.5 10.5 3Z" fill="#1f2328"/><rect x="-14" y="2" width="28" height="4.5" rx="2.25" fill="#1f2328"/><path d="M-2.6 -9.6V2.2M2.6 -9.6V2.2" stroke="#fbfaf6" stroke-width="2.5"/></g><g transform="translate(0 -31) rotate(-35)"><rect x="-15" y="-5.5" width="30" height="11" rx="5.5" fill="#1565c0" stroke="#fbfaf6" stroke-width="2.5"/><rect x="-4.5" y="-3.5" width="9" height="7" rx="1" fill="#e1ecfa"/></g></g>
<text x="317" y="374" font-size="20" font-weight="700" fill="#1565c0" text-anchor="middle">PAE : un pansement</text>
<text x="317" y="398" font-size="19" fill="#4b535c" text-anchor="middle">centré sur l’individu</text>
<!-- « Plusieurs travailleurs d'une même équipe consultent → enquête organisationnelle requise » -->
<path d="M268 410V452" stroke="#4b535c" stroke-width="3.5" stroke-linecap="round"/>
<path d="M268 468L259 450H277Z" fill="#4b535c"/>
