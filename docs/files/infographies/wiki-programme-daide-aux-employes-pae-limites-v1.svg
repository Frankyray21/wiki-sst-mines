<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="580" viewBox="0 0 480 580" role="img" aria-labelledby="t d">
<title id="t">Le PAE : un pansement, pas un traitement causal</title>
<desc id="d">En haut, un cadre rouge : les conditions de travail, avec surcharge, harcèlement et job strain. Des flèches rouges descendent vers une équipe de quatre mineurs casqués ; chacun porte un pansement bleu, le PAE, centré sur l’individu : les conditions de travail, en haut, restent les mêmes. Quand plusieurs travailleurs de la même équipe consultent, une flèche mène à une enquête organisationnelle. De là, une grande flèche bleue remonte à gauche jusqu’au cadre rouge : prévention primaire, corriger à la source.</desc>
<rect width="480" height="580" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Un pansement,</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">pas un traitement causal</text>
<!-- « Il ne change rien aux conditions de travail qui ont contribué au problème » ; « (job strain, harcèlement, surcharge) » -->
<rect x="24" y="102" width="432" height="98" rx="10" fill="#fde3e0" stroke="#c62828" stroke-width="3"/>
<text x="40" y="132" font-size="20" font-weight="700" fill="#1f2328">conditions de travail</text>
<g fill="#c62828">
<rect x="40" y="148" width="116" height="36" rx="6"/>
<rect x="166" y="148" width="136" height="36" rx="6"/>
<rect x="312" y="148" width="128" height="36" rx="6"/>
</g>
<g font-size="19" fill="#fbfaf6" text-anchor="middle">
<text x="98" y="172">surcharge</text>
<text x="234" y="172">harcèlement</text>
<text x="376" y="172">job strain</text>
</g>
<g stroke="#c62828" stroke-width="4" stroke-linecap="round">
<path d="M255 204V226M317 204V226M379 204V226"/>
</g>
<g fill="#c62828">
<path d="M255 240L246 223H264Z"/><path d="M317 240L308 223H326Z"/><path d="M379 240L370 223H388Z"/>
</g>
<!-- Équipe : « Si une équipe entière commence à utiliser le PAE pour des raisons liées au travail » ; pansement : « Le PAE est un pansement » ; « Centré sur l'individu » -->
