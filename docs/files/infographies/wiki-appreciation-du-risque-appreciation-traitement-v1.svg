<svg xmlns="http://www.w3.org/2000/svg" width="480" height="370" viewBox="0 0 480 370" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Appréciation et traitement du risque</title><desc id="d">Titre : « Appréciation et traitement du risque », sous-titre « Selon l’ISO Guide 73 ». Figure sur fond noir. Un cadre « Appréciation du risque », plus large, contient trois étapes reliées par des flèches : identification, analyse (descriptive), évaluation (décisionnelle). Une flèche mène ensuite au traitement du risque : modifier (réduire) un risque. En bas, IEC/ISO 31010 : trois grandes catégories de techniques selon l’étape ciblée : identification, analyse, évaluation.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="368.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">Appréciation et traitement du risque</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Selon l’ISO Guide 73</text><rect x="16.0" y="78.0" width="448.0" height="136.0" rx="12" fill="#1a1d22" stroke="#3a404a" stroke-width="1.4" stroke-dasharray="6 5"/><text x="30.0" y="100.0" font-weight="800" font-size="13.5" fill="#f2f6fa">Appréciation du risque</text><text x="450.0" y="100.0" font-weight="600" font-size="11.5" fill="#8fa0b3" text-anchor="end">plus large</text><rect x="37.0" y="120.0" width="120.0" height="35.5" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="97.0" y="143.3" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Identification</text><line x1="160.0" y1="144.0" x2="171.0" y2="144.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="177.0,144.0 169.9,147.8 169.9,140.2" fill="#8b939c"/><rect x="180.0" y="120.0" width="120.0" height="51.9" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="240.0" y="143.3" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Analyse</text><text x="240.0" y="160.4" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">descriptive</text><line x1="303.0" y1="144.0" x2="314.0" y2="144.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><polygon points="320.0,144.0 312.9,147.8 312.9,140.2" fill="#8b939c"/><rect x="323.0" y="120.0" width="120.0" height="51.9" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="383.0" y="143.3" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Évaluation</text><text x="383.0" y="160.4" font-weight="500" font-size="11.5" fill="#b6c2d1" text-anchor="middle">décisionnelle</text><line x1="240.0" y1="214.0" x2="240.0" y2="235.0" stroke="#8b939c" stroke-width="2.2" stroke-linecap="round"/><polygon points="240.0,242.0 235.8,234.1 244.2,234.1" fill="#8b939c"/><rect x="110.0" y="242.0" width="260.0" height="53.1" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="240.0" y="265.8" font-weight="700" font-size="14.5" fill="#f2f6fa" text-anchor="middle">Traitement du risque</text><text x="240.0" y="283.5" font-weight="500" font-size="12" fill="#b6c2d1" text-anchor="middle">modifier (réduire) un risque</text><rect x="14.0" y="309.1" width="452.0" height="46.0" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="26" y="328.1" font-size="12.5"><tspan font-weight="800" fill="#f2f6fa">IEC/ISO 31010</tspan><tspan font-weight="500" fill="#b6c2d1"> — trois grandes catégories de techniques selon l’étape</tspan></text><text x="26.0" y="344.1" font-weight="500" font-size="12.5" fill="#b6c2d1">ciblée : identification, analyse, évaluation.</text></svg>