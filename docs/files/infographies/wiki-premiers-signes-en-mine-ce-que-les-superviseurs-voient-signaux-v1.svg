<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Remarquer un changement, pas poser un diagnostic</title>
<desc id="d">Quatre rangées, une par catégorie de signaux de la page. En haut, un superviseur, en bleu, tient un carnet ; il compare deux colonnes reliées par une flèche : « d’habitude », en gris, à gauche, et « maintenant », en noir, à droite. Performance et travail : quatre tâches cochées, puis deux des quatre marquées d’une croix rouge, « Erreurs nouvelles ou répétées ». Communication et relations : trois personnes à la même table, avec une bulle de parole, puis deux à la table et la troisième seule à une autre table, « Repli, isolement à la cantine ou en pause ». Apparence et comportement : une tasse, puis quatre, « Hausse de la consommation visible ». Comportements à risque, en rouge : un travailleur s’arrête devant une barrière rayée, puis il est passé de l’autre côté, une flèche rouge pointillée passant par-dessus la barrière, « Désengagement des consignes de sécurité ». Aucune étiquette sur la personne : seulement ce qui a changé. À part, en bas, dans un cadre rouge, l’encadré de la page « Danger immédiat : agir sans attendre » : joindre les services d’urgence au 911 et déclencher l’alerte prévue par le site ; en présence d’idées suicidaires ou d’un doute préoccupant, demander de l’aide sans attendre plusieurs jours.</desc>
