<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="574" viewBox="0 0 480 574" role="img" aria-labelledby="t d">
<title id="t">Cinq styles selon deux axes (Thomas-Kilmann)</title>
<desc id="d">Plan à deux axes du modèle de Thomas-Kilmann. Axe vertical, en bleu : le souci de soi, faible en bas, moyen au milieu, élevé en haut. Axe horizontal, en gris : le souci de l’autre, faible à gauche, moyen au milieu, élevé à droite. Chaque style est représenté par deux silhouettes, soi en bleu à gauche et l’autre en gris à droite, remplies selon le souci accordé à chacun : une mince bande pour faible, à moitié pour moyen, entièrement pour élevé. En haut à gauche, la Compétition : soi rempli, l’autre à peine. En haut à droite, la Collaboration : les deux remplis. Au centre, le Compromis : les deux à moitié. En bas à gauche, l’Évitement : les deux à peine remplis. En bas à droite, l’Accommodation : soi à peine rempli, l’autre rempli.</desc>
<rect width="480" height="574" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Cinq styles selon deux axes</text>
<text x="24" y="76" font-size="19" fill="#4b535c">Styles de gestion (Thomas-Kilmann)</text>
