<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="648" viewBox="0 0 480 648" role="img" aria-labelledby="t d">
<title id="t">Lieu de contrôle : interne ou externe, à quoi le travailleur attribue ce qui lui arrive</title>
<desc id="d">Deux grands panneaux, l’un au-dessus de l’autre. En haut, lieu de contrôle interne, « Je peux agir sur ma situation » : le travailleur casqué tend le bras et une grande flèche part de lui vers un levier de commande. En bas, lieu de contrôle externe, « Ce qui m’arrive dépend des autres ou du hasard » : deux grandes flèches arrivent vers le travailleur casqué, l’une depuis un dé (le hasard), l’autre depuis une autre personne, tête nue (les autres). Les deux panneaux ont la même couleur. Sous le panneau externe, en bleu : réaliste quand le poste offre peu de contrôle.</desc>
<rect width="480" height="648" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" fill="#1f2328" font-weight="700">Lieu de contrôle :</text>
<text x="24" y="78" font-size="26" fill="#1f2328" font-weight="700">interne ou externe</text>
<rect x="16" y="98" width="448" height="222" rx="12" fill="#eceef0"/>
<text x="32" y="130" font-size="22" fill="#1f2328" font-weight="700">Interne</text>
<text x="32" y="158" font-size="20" fill="#1f2328">« Je peux agir sur ma situation »</text>
