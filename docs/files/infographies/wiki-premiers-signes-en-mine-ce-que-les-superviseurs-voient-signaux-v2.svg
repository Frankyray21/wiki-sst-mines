<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Remarquer un changement, pas poser un diagnostic : quatre catégories de signaux</title>
<desc id="d">En haut, le superviseur, en bleu, tient un carnet : il documente factuellement ce qu’il observe, sans interprétation clinique. Il compare deux cases : « d’habitude », le travailleur est debout et parle (bulle) ; « maintenant », après une flèche, le même travailleur est assis, le dos voûté, la tête basse, les bras ballants. Le schéma montre un changement, pas un diagnostic. Quatre vignettes, une par catégorie de la page : Performance et travail (liste de tâches avec deux croix rouges) ; Communication et relations (deux personnes se parlent à une table, la troisième est seule à une autre) ; Apparence et comportement (travailleur fatigué, assis, tête basse, pile presque vide en rouge). Comportements à risque, en rouge : un travailleur a franchi une barrière. Chaque catégorie a son propre schéma, sous son titre, plus bas dans la page. En bas, dans un cadre rouge, une flèche vers le haut et le titre de l’encadré qui ouvre la page : « Danger immédiat : agir sans attendre ».</desc>
