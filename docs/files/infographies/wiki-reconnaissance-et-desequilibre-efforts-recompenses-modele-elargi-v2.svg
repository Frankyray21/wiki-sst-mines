<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="608" viewBox="0 0 480 608" role="img" aria-labelledby="t d">
<title id="t">Modèle élargi : une demande, trois appuis</title>
<desc id="d">Deux lignes montrent la même charge : une longue dalle sombre marquée « demande psychologique », qu’un travailleur tient par un bout. En haut, « Sans appuis » : l’autre bout de la dalle repose au sol, le travailleur plie sous le poids et une grosse flèche rouge appuie sur le bout qu’il tient. En bas, « Avec les trois appuis » : la même dalle repose à l’horizontale sur trois étais bleus, « latitude décisionnelle », « soutien social » et « reconnaissance », ce dernier en bleu plein ; le travailleur se tient droit et la flèche rouge est petite : il porte encore une part. Sous les deux premiers étais, un crochet gris : « modèle de Karasek ». Sous l’étai de la reconnaissance, un crochet bleu : « ajoutée ». Mention : un repère d’analyse, pas un diagnostic.</desc>
<rect width="480" height="608" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Modèle élargi :</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">une demande, trois appuis</text>
<!-- Ligne 1 : sans appuis, la dalle repose au sol par un bout et le travailleur plie sous le poids -->
<text x="24" y="118" font-size="20" font-weight="700" fill="#1f2328">Sans appuis</text>
