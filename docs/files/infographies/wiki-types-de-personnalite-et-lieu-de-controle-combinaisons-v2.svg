<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="654" viewBox="0 0 480 654" role="img" aria-labelledby="t d">
<title id="t">Type de personnalité et lieu de contrôle : quatre combinaisons, dans un même contexte de travail</title>
<desc id="d">Grille de quatre cases posée à l’intérieur d’un grand cadre gris, les conditions de travail : le contexte produit le risque, l’individu le filtre. En colonnes, le type de personnalité : type A, pressé et impatient, marqué d’un grand chronomètre ; type B, détendu et patient, sans chronomètre. En lignes, le lieu de contrôle, c’est-à-dire à quoi le travailleur attribue ce qui lui arrive : interne, une flèche part du travailleur casqué vers un levier ; externe, deux flèches arrivent vers lui, l’une depuis un dé, l’autre depuis une autre personne. Chaque case combine une colonne et une ligne : dans la colonne du type A, le travailleur a un chronomètre près de la tête. Les quatre cases ont la même couleur, aucune n’est marquée comme dangereuse ou protectrice. En bas : aucun travailleur n’est à risque ou protégé en soi.</desc>
