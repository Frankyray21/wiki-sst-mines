<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="536" viewBox="0 0 480 536" role="img" aria-labelledby="t d">
<title id="t">Trois cycles FIFO, jour par jour : au site ou à la maison</title>
<desc id="d">Trois bandes-calendrier alignées sur le même axe de jours, une par cycle, avec une case par jour, les cases groupées par semaine. Légende : case foncée et casque de chantier, un jour au site ; case claire bordée de bleu et maison, un jour à la maison. 14/14 : 14 jours au site, puis 14 jours à la maison. 20/10 : 20 jours au site, puis 10 jours à la maison. 21/7 : 21 jours au site, puis 7 jours à la maison. Le 14/14 et le 21/7 couvrent la même période ; le 20/10 est un peu plus long. Au-dessus de chaque bande, à droite, la récupération en congé indiquée par la page : suffisante pour la majorité (14/14), souvent incomplète (20/10), rarement suffisante (21/7).</desc>
<rect width="480" height="536" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Trois cycles FIFO,</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">jour par jour</text>
