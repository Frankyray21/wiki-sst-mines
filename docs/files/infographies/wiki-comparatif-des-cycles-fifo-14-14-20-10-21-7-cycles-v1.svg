<text x="77" y="120" font-size="19" fill="#1f2328">jour au site</text>
<rect x="219.25" y="101.25" width="9.4" height="24.5" rx="1.5" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5"/>
<g transform="translate(249 113)"><path d="M-12.5 -0.5L0 -12L12.5 -0.5Z" fill="#1565c0" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round"/><rect x="-9" y="-2" width="18" height="13" fill="#1565c0"/><rect x="-2.75" y="3.5" width="5.5" height="7.5" fill="#fbfaf6"/></g>
<text x="270" y="120" font-size="19" fill="#1565c0">jour à la maison</text>
