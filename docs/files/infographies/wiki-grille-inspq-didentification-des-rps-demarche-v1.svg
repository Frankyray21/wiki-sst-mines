<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="t d">
<title id="t">Grille INSPQ : des sources à la grille, de la grille au plan d’action, selon la démarche de la page</title>
<desc id="d">Trois cadres reliés par des flèches bleues, sans numéros. En haut à gauche, les sources à croiser, chacune avec un pictogramme : données RH (un calendrier), indicateurs CNESST (une feuille avec une courbe), questionnaires JCQ et ERI (une feuille à cases), entretiens de groupe (deux bulles de dialogue), observations terrain (un œil dans une galerie de mine). Une flèche mène au cadre de droite, « Cocher la grille » : deux mineurs casqués, un de chaque côté d’un tableau sur chevalet où sont alignées des cases, dont certaines sont cochées en bleu ; l’un coche une case, l’autre montre le tableau. Dessous : comité paritaire ou conseiller SST. Une flèche « prioriser » descend vers le plan d’action, qui liste des leviers par niveau : primaire, secondaire, tertiaire. Du plan d’action, une flèche repart vers la gauche puis remonte jusqu’au cadre de la grille ; le long de ce retour : « mise en œuvre », puis « reprendre la grille ». Aucun score, aucun seuil, aucune durée d’étape.</desc>
