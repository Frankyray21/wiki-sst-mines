<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="604" viewBox="0 0 480 604" role="img" aria-labelledby="t d">
<title id="t">Mesurer l’exposition au carbone total</title>
<desc id="d">Sous le titre : échantillonnage et analyse selon NIOSH 5040. À gauche, un travailleur vu de face, casque à lampe, porte une pompe à la ceinture ; un tube la relie à une petite tête de prélèvement fixée au col, à l’intérieur d’un disque pointillé bleu centré sur sa tête : sa zone respiratoire. Un trajet pointillé part de la tête de prélèvement vers un flacon de laboratoire, « laboratoire accrédité », puis descend, marqué « résultat », vers une jauge barrée d’un trait rouge : « moins de 0,4 mg/m³ de carbone total » ; la partie au-dessus du trait est teintée de rouge. Le trajet finit au « registre du poste (moteurs diesels) ». En bas, un calendrier, relié au travailleur par une flèche, indique : au moins tous les 6 mois, et après toute modification susceptible d’altérer la qualité de l’air.</desc>
<defs>
<clipPath id="tube"><rect x="232" y="268" width="24" height="96" rx="12"/></clipPath>
</defs>
<rect width="480" height="604" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Mesurer l’exposition</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">au carbone total</text>
<text x="24" y="108" font-size="19" fill="#4b535c">Échantillonnage et analyse : NIOSH 5040</text>

<!-- Zone respiratoire : de face, un disque centré sur la ligne des oreilles (derrière le travailleur) -->
<circle cx="90" cy="192" r="44" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="24" y="142" font-size="19" font-weight="600" fill="#1565c0">zone respiratoire</text>

<!-- Travailleur, de face -->
<g fill="#6e7781">
<rect x="67" y="304" width="20" height="110" rx="7"/>
<rect x="93" y="304" width="20" height="110" rx="7"/>
<path d="M64 222Q64 214 72 214H108Q116 214 116 222V310H64Z"/>
<rect x="84" y="202" width="12" height="14"/>
<circle cx="90" cy="192" r="14"/>
</g>
<path d="M68 222L56 304M112 222L124 304" stroke="#fbfaf6" stroke-width="17" stroke-linecap="round" fill="none"/>
<path d="M68 222L56 304M112 222L124 304" stroke="#6e7781" stroke-width="13" stroke-linecap="round" fill="none"/>
<g fill="#4b535c">
<rect x="62" y="408" width="27" height="12" rx="4"/>
<rect x="91" y="408" width="27" height="12" rx="4"/>
<path d="M74 188Q74 164 90 164Q106 164 106 188Z"/>
<rect x="70" y="184" width="40" height="6" rx="3"/>
</g>
<circle cx="90" cy="175" r="3.5" fill="#fbfaf6"/>
<path d="M64 290H116" stroke="#4b535c" stroke-width="5"/>

<!-- Tête de prélèvement au col, tube, pompe à la ceinture -->
<path d="M104.5 226C104.5 252 124 262 124 280" stroke="#1f2328" stroke-width="3" fill="none"/>
<rect x="100" y="210" width="9" height="16" rx="2" fill="#1f2328"/>
<rect x="112" y="280" width="24" height="26" rx="3" fill="#1f2328"/>
<rect x="117" y="285" width="14" height="7" rx="1" fill="#fbfaf6"/>
<text x="118" y="334" font-size="19" fill="#1f2328">pompe</text>

<!-- Trajet du prélèvement -->
<g stroke="#4b535c" stroke-width="3" stroke-dasharray="7 5" fill="none">
<path d="M114 216C150 214 176 194 212 194"/>
<path d="M244 216V254"/>
<path d="M244 366V388"/>
<path d="M44 476V440"/>
</g>
<g fill="#4b535c">
<path d="M210 187L225 194L210 201Z"/>
<path d="M237 252L244 266L251 252Z"/>
<path d="M237 386L244 400L251 386Z"/>
<path d="M37 442L44 428L51 442Z"/>
</g>

<!-- Laboratoire accrédité -->
<path d="M238 152H250V170L264 204Q266 210 260 210H228Q222 210 224 204L238 170Z" fill="#fbfaf6" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/>
<path d="M231 190H257L262 203Q263 207 259 207H229Q225 207 226 203Z" fill="#6e7781"/>
<path d="M234 152H254" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
<text x="272" y="180" font-size="19" fill="#1f2328">laboratoire</text>
<text x="272" y="204" font-size="19" fill="#1f2328">accrédité</text>
<text x="258" y="246" font-size="19" fill="#4b535c">résultat</text>

<!-- Comparaison à la valeur du RSSM -->
<g clip-path="url(#tube)">
<rect x="232" y="268" width="24" height="34" fill="#fde3e0"/>
<rect x="232" y="302" width="24" height="62" fill="#fbfaf6"/>
</g>
<rect x="232" y="268" width="24" height="96" rx="12" fill="none" stroke="#1f2328" stroke-width="2.5"/>
<path d="M226 302H262" stroke="#c62828" stroke-width="3.5" stroke-linecap="round"/>
<text x="272" y="284" font-size="19" fill="#1f2328">moins de</text>
<text x="272" y="308" font-size="19" font-weight="700" fill="#c62828">0,4 mg/m³</text>
<text x="272" y="332" font-size="19" fill="#1f2328">de carbone total</text>

<!-- Registre du poste -->
<rect x="222" y="402" width="44" height="52" rx="4" fill="#eceef0" stroke="#1f2328" stroke-width="2.5"/>
<rect x="222" y="402" width="10" height="52" rx="3" fill="#4b535c"/>
<path d="M240 418H258M240 428H258M240 438H252" stroke="#6e7781" stroke-width="2.5" stroke-linecap="round"/>
<text x="272" y="424" font-size="19" fill="#1f2328">registre du poste</text>
<text x="272" y="448" font-size="19" fill="#1f2328">(moteurs diesels)</text>

<!-- Calendrier : quand mesurer -->
<rect x="24" y="484" width="56" height="50" rx="5" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
<rect x="24" y="484" width="56" height="14" rx="3" fill="#4b535c"/>
<path d="M38 478V490M66 478V490" stroke="#1f2328" stroke-width="3.5" stroke-linecap="round"/>
<g fill="#6e7781">
<rect x="32" y="504" width="8" height="7"/><rect x="48" y="504" width="8" height="7"/><rect x="64" y="504" width="8" height="7"/>
<rect x="32" y="518" width="8" height="7"/><rect x="48" y="518" width="8" height="7"/>
</g>
<rect x="64" y="518" width="8" height="7" fill="#1565c0"/>
<text x="96" y="502" font-size="19" font-weight="700" fill="#1f2328">au moins tous les 6 mois</text>
<text x="96" y="534" font-size="19" fill="#1f2328">et après toute modification</text>
<text x="96" y="558" font-size="19" fill="#1f2328">susceptible d’altérer</text>
<text x="96" y="582" font-size="19" fill="#1f2328">la qualité de l’air</text>
</g>
</svg>
