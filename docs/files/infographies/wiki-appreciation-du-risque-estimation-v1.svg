<svg xmlns="http://www.w3.org/2000/svg" width="480" height="423" viewBox="0 0 480 423" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Estimation du risque</title><desc id="d">Titre : « Estimation du risque », sous-titre « Outil IRSST/CNESST : quatre facteurs combinés en indice ». Figure sur fond noir. Quatre cartes. G, gravité du dommage : G1, lésion légère réversible (premiers soins) ; G2, lésion grave irréversible (membre brisé, décès). F, fréquence ou durée d’exposition : F1, rare ou courte (moins d’une fois par quart) ; F2, fréquente à continue (plusieurs fois par jour). O, probabilité d’occurrence de l’événement, pas du dommage : O1, très faible (technologie éprouvée) ; O2, faible (défaillance d’au moins 10 puissance moins 5 par heure, ou personne qualifiée) ; O3, élevée (défaillance d’au moins 10 puissance moins 3 par heure, ou personne non formée). P, possibilité d’éviter le dommage : P1, possible dans certaines conditions ; P2, impossible ou rarement possible. En bas, exemple : G2 + F2 + O2 + P2 = indice de risque 5.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="421.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">Estimation du risque</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Outil IRSST/CNESST : quatre facteurs combinés en indice</text><rect x="16.0" y="78.0" width="218.0" height="122.0" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><circle cx="38.0" cy="100.0" r="13" fill="#23262d" stroke="#8b939c" stroke-width="1.6"/><text x="38.0" y="105.0" font-weight="800" font-size="14" fill="#f2f6fa" text-anchor="middle">G</text><text x="58.0" y="98.0" font-weight="700" font-size="13" fill="#f2f6fa">Gravité du dommage</text><text x="28.0" y="130.0" font-weight="500" font-size="11.5" fill="#b6c2d1">G1 : lésion légère réversible</text><text x="40.0" y="145.0" font-weight="500" font-size="11.5" fill="#b6c2d1">(premiers soins)</text><text x="28.0" y="160.0" font-weight="500" font-size="11.5" fill="#b6c2d1">G2 : lésion grave irréversible</text><text x="40.0" y="175.0" font-weight="500" font-size="11.5" fill="#b6c2d1">(membre brisé, décès)</text><rect x="246.0" y="78.0" width="218.0" height="122.0" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><circle cx="268.0" cy="100.0" r="13" fill="#23262d" stroke="#8b939c" stroke-width="1.6"/><text x="268.0" y="105.0" font-weight="800" font-size="14" fill="#f2f6fa" text-anchor="middle">F</text><text x="288.0" y="98.0" font-weight="700" font-size="13" fill="#f2f6fa">Fréquence/durée</text><text x="288.0" y="114.0" font-weight="700" font-size="13" fill="#f2f6fa">d’exposition</text><text x="258.0" y="136.0" font-weight="500" font-size="11.5" fill="#b6c2d1">F1 : rare ou courte</text><text x="270.0" y="151.0" font-weight="500" font-size="11.5" fill="#b6c2d1">(&lt; 1 fois/quart)</text><text x="258.0" y="166.0" font-weight="500" font-size="11.5" fill="#b6c2d1">F2 : fréquente à continue</text><text x="270.0" y="181.0" font-weight="500" font-size="11.5" fill="#b6c2d1">(plusieurs fois/jour)</text><rect x="16.0" y="212.0" width="218.0" height="153.0" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><circle cx="38.0" cy="234.0" r="13" fill="#23262d" stroke="#8b939c" stroke-width="1.6"/><text x="38.0" y="239.0" font-weight="800" font-size="14" fill="#f2f6fa" text-anchor="middle">O</text><text x="58.0" y="232.0" font-weight="700" font-size="13" fill="#f2f6fa">Probabilité d’occurrence de</text><text x="58.0" y="248.0" font-weight="700" font-size="13" fill="#f2f6fa">l’événement</text><text x="58.0" y="270.0" font-weight="600" font-size="11" fill="#8fa0b3">(pas du dommage)</text><text x="28.0" y="286.0" font-weight="500" font-size="11.5" fill="#b6c2d1">O1 : très faible (technologie éprouvée)</text><text x="28.0" y="301.0" font-weight="500" font-size="11.5" fill="#b6c2d1">O2 : faible (défaillance ≥ 10<tspan baseline-shift="super" font-size="8.3">–5</tspan> /h</text><text x="40.0" y="316.0" font-weight="500" font-size="11.5" fill="#b6c2d1">ou personne qualifiée)</text><text x="28.0" y="331.0" font-weight="500" font-size="11.5" fill="#b6c2d1">O3 : élevée (défaillance ≥ 10<tspan baseline-shift="super" font-size="8.3">–3</tspan> /h</text><text x="40.0" y="346.0" font-weight="500" font-size="11.5" fill="#b6c2d1">ou personne non formée)</text><rect x="246.0" y="212.0" width="218.0" height="153.0" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><circle cx="268.0" cy="234.0" r="13" fill="#23262d" stroke="#8b939c" stroke-width="1.6"/><text x="268.0" y="239.0" font-weight="800" font-size="14" fill="#f2f6fa" text-anchor="middle">P</text><text x="288.0" y="232.0" font-weight="700" font-size="13" fill="#f2f6fa">Possibilité d’éviter le</text><text x="288.0" y="248.0" font-weight="700" font-size="13" fill="#f2f6fa">dommage</text><text x="258.0" y="270.0" font-weight="500" font-size="11.5" fill="#b6c2d1">P1 : possible dans certaines</text><text x="270.0" y="285.0" font-weight="500" font-size="11.5" fill="#b6c2d1">conditions</text><text x="258.0" y="300.0" font-weight="500" font-size="11.5" fill="#b6c2d1">P2 : impossible ou rarement</text><text x="270.0" y="315.0" font-weight="500" font-size="11.5" fill="#b6c2d1">possible</text><rect x="14.0" y="379.0" width="452.0" height="30.0" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="26" y="398.0" font-size="12.5"><tspan font-weight="800" fill="#f2f6fa">Exemple</tspan><tspan font-weight="500" fill="#b6c2d1"> — G2 + F2 + O2 + P2 = indice de risque 5.</tspan></text></svg>