<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="630" viewBox="0 0 480 630" role="img" aria-labelledby="t d">
<title id="t">Donner plus qu’on ne reçoit : la balance efforts-récompenses</title>
<desc id="d">Balance à deux plateaux, modèle de Siegrist, inclinée du côté des efforts. Sur le plateau de gauche, « Efforts », une pile de blocs foncés : cadence, interruptions, charge physique, heures supplémentaires. Au-dessus, une flèche pousse la pile vers le bas : le surengagement, qui amplifie l’effet. Sur le plateau de droite, « Récompenses », un seul bloc bleu plein, salaire et primes ; au-dessus, deux blocs en pointillés, reconnaissance et respect, sécurité d’emploi et perspectives, réunis par un crochet : ils manquent. Le fléau penche vers les efforts ; une flèche rouge descend du plateau des efforts vers un encadré rouge : déséquilibre, s’il dure : zone à risque. Note au bas : « Ratio ERI : un ratio &gt; 1 indique un déséquilibre. »</desc>
<rect width="480" height="630" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Donner plus qu’on ne reçoit</text>
<text x="24" y="78" font-size="19" fill="#4b535c">Modèle de Siegrist</text>

<!-- Surengagement (composante personnelle) : pousse sur le plateau des efforts ; page : « Le surengagement amplifie l'effet du déséquilibre » -->
<text x="24" y="116" font-size="20" font-weight="700" fill="#1f2328">surengagement</text>
<text x="24" y="140" font-size="19" fill="#4b535c">amplifie l’effet</text>
<path d="M116 148V162" stroke="#1f2328" stroke-width="7" stroke-linecap="round"/>
<path d="M103 160L116 177L129 160Z" fill="#1f2328"/>

<!-- Pied et colonne -->
<path d="M200 520L214 500H266L280 520Z" fill="#eceef0" stroke="#6e7781" stroke-width="3" stroke-linejoin="round"/>
<rect x="233" y="380" width="14" height="120" fill="#6e7781"/>

<!-- Fléau incliné du côté des efforts -->
<rect x="-136" y="-5" width="272" height="10" rx="5" fill="#4b535c" transform="translate(240 380) rotate(-15)"/>
<path d="M116 413.2V373.2M364 346.8V306.8" stroke="#4b535c" stroke-width="6" stroke-linecap="round"/>
<circle cx="240" cy="380" r="9" fill="#fbfaf6" stroke="#1f2328" stroke-width="3"/>

<!-- Plateaux, avec leur nom -->
<rect x="24" y="343.2" width="184" height="30" rx="4" fill="#6e7781"/>
<rect x="272" y="276.8" width="184" height="30" rx="4" fill="#6e7781"/>
<g font-size="20" font-weight="700" fill="#fbfaf6" text-anchor="middle">
<text x="116" y="365">Efforts</text>
<text x="364" y="299">Récompenses</text>
</g>

<!-- Efforts : demandes du poste (tableau de la page : cadence, heures supplémentaires, interruptions, charge physique) -->
<g font-size="19" fill="#fbfaf6" text-anchor="middle">
<rect x="28" y="287.2" width="176" height="54" rx="4" fill="#4b535c"/>
<text x="116" y="310">heures</text>
<text x="116" y="332">supplémentaires</text>
<rect x="28" y="251.2" width="176" height="34" rx="4" fill="#4b535c"/>
<text x="116" y="275">charge physique</text>
<rect x="38" y="215.2" width="156" height="34" rx="4" fill="#4b535c"/>
<text x="116" y="239">interruptions</text>
<rect x="54" y="179.2" width="124" height="34" rx="4" fill="#4b535c"/>
<text x="116" y="203">cadence</text>
</g>

<!-- Récompenses, trois formes (page) : matérielles (salaire, primes) présentes ; d’estime (reconnaissance, respect) et de statut (sécurité d’emploi, perspectives) manquent, en pointillés -->
<g font-size="19" text-anchor="middle">
<rect x="274" y="220.8" width="180" height="54" rx="4" fill="#1565c0"/>
<text x="364" y="243" fill="#fbfaf6" font-weight="700">salaire</text>
<text x="364" y="265" fill="#fbfaf6">primes</text>
<rect x="274" y="162.8" width="180" height="54" rx="4" fill="#fbfaf6" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="364" y="185" fill="#1565c0">reconnaissance</text>
<text x="364" y="207" fill="#1565c0">respect</text>
<rect x="274" y="102.8" width="180" height="54" rx="4" fill="#fbfaf6" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="364" y="125" fill="#1565c0">sécurité d’emploi</text>
<text x="364" y="147" fill="#1565c0">perspectives</text>
</g>
<path d="M268 104H261V215H268" stroke="#1565c0" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
<text x="254" y="166" font-size="19" font-weight="700" fill="#1565c0" text-anchor="end">manquent</text>

<!-- La balance penche du côté des efforts : déséquilibre ; page : « penche durablement du mauvais côté », « Configurations à risque » -->
<path d="M90.2 387.9A150 150 0 0 0 98.2 428.8" stroke="#c62828" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M105.6 425.9L103 441L90.8 431.7Z" fill="#c62828"/>
<rect x="24" y="452" width="172" height="90" rx="10" fill="#fde3e0" stroke="#c62828" stroke-width="2.5"/>
<g fill="#c62828" text-anchor="middle">
<text x="110" y="478" font-size="20" font-weight="700">déséquilibre</text>
<text x="110" y="502" font-size="19">s’il dure :</text>
<text x="110" y="528" font-size="19" font-weight="700">zone à risque</text>
</g>

<!-- Ratio ERI, mots exacts de la page -->
<text x="24" y="582" font-size="19" fill="#4b535c">Ratio ERI : un ratio &gt; 1</text>
<text x="24" y="606" font-size="19" fill="#4b535c">indique un déséquilibre.</text>
</g>
</svg>
