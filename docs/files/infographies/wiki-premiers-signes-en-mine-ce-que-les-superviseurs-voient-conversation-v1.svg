<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="632" viewBox="0 0 480 632" role="img" aria-labelledby="t d">
<title id="t">Repères pour guider une conversation et le suivi</title>
<desc id="d">Une pièce à la porte fermée : la conversation a lieu en privé. Le superviseur, en bleu, et le travailleur se font face de part et d’autre d’une table ; un carnet est posé sur la table. Échanger, en privé, avec une question ouverte (dans le dessin : « en privé, question ouverte ») : bulle bleue avec un point d’interrogation. Écouter, sans interprétation clinique : la bulle du travailleur, plus grande. Observer : décrire les changements et les faits (le carnet). Dessous, trois cadres côte à côte, sans flèche, sans lien entre eux ni numéro : Orienter (faire connaître les ressources professionnelles et le PAE), Suivre (convenir d’un suivi adapté à la situation), Travail (signaler au conseiller SST les difficultés liées au travail qui nécessitent une action). En bas, en bleu, la phrase de la page : « Ils ne servent pas à établir un diagnostic. »</desc>
<rect width="480" height="632" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
