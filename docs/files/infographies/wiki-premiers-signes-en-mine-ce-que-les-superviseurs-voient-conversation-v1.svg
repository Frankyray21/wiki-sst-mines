<text x="263.0" y="485" font-size="19" fill="#1f2328" text-anchor="middle">à la situation</text>
<rect x="338" y="406" width="126" height="124" rx="10" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
<text x="401.0" y="436" font-size="20" font-weight="700" fill="#1565c0" text-anchor="middle">Travail</text>
<text x="401.0" y="462" font-size="19" fill="#1f2328" text-anchor="middle">signaler au</text>
