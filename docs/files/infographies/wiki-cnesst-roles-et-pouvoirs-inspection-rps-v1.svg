<text x="136" y="316">risques psychosociaux :</text>
<text x="136" y="340">identification, analyse</text>
<text x="136" y="370">mesures et priorités d’action</text>
<text x="136" y="398">implication du comité SST</text>
</g>
<!-- Lignes de vie -->
<g stroke="#6e7781" stroke-width="2.5" stroke-dasharray="6 6"><path d="M58 286V466M426 286V560"/></g>
<!-- Avis de correction (page : « Avis de correction si défaillance » ; LSST, art. 182 : « peut, s’il l’estime opportun », d’où les tirets ; art. 184 : « doit y donner suite ») -->
<text x="240" y="432" font-size="19" font-weight="700" fill="#1565c0" text-anchor="middle">avis de correction</text>
<path d="M64 466H414" stroke="#1565c0" stroke-width="3.5" stroke-dasharray="10 7"/>
<path d="M426 466L413 459.5V472.5Z" fill="#1565c0"/>
<path d="M226 446H248L256 454V486H226Z" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M232 460H250M232 468H250M232 476H244" stroke="#1565c0" stroke-width="2.5"/>
<text x="240" y="510" font-size="19" fill="#4b535c" text-anchor="middle">s’il l’estime opportun</text>
<text x="414" y="540" font-size="19" fill="#1f2328" text-anchor="end">l’employeur doit y donner suite</text>
<!-- Ne pas donner suite à l’avis (art. 184) : contravention, donc infraction (art. 236 : « Quiconque contrevient à la présente loi […] commet une infraction et est passible […] d’une amende ») ; poursuite pénale : « peut être intentée par la Commission » (art. 242) -->
<path d="M426 560V574" stroke="#c62828" stroke-width="3.5" stroke-linecap="round"/>
<path d="M426 586L419.5 573H432.5Z" fill="#c62828"/>
<rect x="24" y="586" width="432" height="54" rx="10" fill="#fde3e0" stroke="#c62828" stroke-width="2.5"/>
<text x="40" y="608" font-size="19" font-weight="700" fill="#c62828">ne pas y donner suite : infraction</text>
<text x="40" y="631" font-size="19" fill="#c62828">poursuite pénale possible, amende</text>
</g>
</svg>
