<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="648" viewBox="0 0 480 648" role="img" aria-labelledby="t d">
<title id="t">L’inspecteur de la CNESST et les risques psychosociaux</title>
<desc id="d">Sous le titre, « ce qu’il peut demander à voir ». Sur une table, un classeur ouvert, le programme de prévention, avec un onglet rouge RPS et, sur la page de droite, une bande rouge. À gauche, l’inspecteur, en bleu, casqué, une planchette sur la poitrine, tend une loupe vers le classeur ; à droite, l’employeur, en noir, casque clair. Sous la table, une bulle grise pointée vers le classeur énumère ce qui peut être examiné : risques psychosociaux, identification et analyse (puce rouge) ; mesures et priorités d’action ; implication du comité SST. Plus bas, une flèche bleue en tirets, portant une feuille, va de l’inspecteur à l’employeur : avis de correction, s’il l’estime opportun ; l’employeur doit y donner suite. Enfin, une flèche rouge descend de l’employeur vers un encadré rouge : ne pas y donner suite, infraction ; poursuite pénale possible, amende. Aucun délai ni montant.</desc>
<rect width="480" height="648" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">L’inspecteur et les RPS</text>
<text x="24" y="74" font-size="19" fill="#4b535c">ce qu’il peut demander à voir</text>
<!-- Classeur ouvert sur la table : programme de prévention, onglet RPS (page : « Vérification du programme de prévention : Section RPS incluse ») -->
<text x="242" y="116" font-size="19" font-weight="700" fill="#1f2328" text-anchor="middle">programme de prévention</text>
<rect x="120" y="148" width="244" height="80" rx="4" fill="#eceef0" stroke="#1f2328" stroke-width="2.5"/>
<rect x="300" y="128" width="54" height="26" rx="4" fill="#c62828"/>
<text x="327" y="148" font-size="19" font-weight="700" fill="#fbfaf6" text-anchor="middle">RPS</text>
<rect x="126" y="152" width="114" height="70" rx="3" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
<rect x="244" y="152" width="114" height="70" rx="3" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
<path d="M242 148V228" stroke="#1f2328" stroke-width="3"/>
<g stroke="#6e7781" stroke-width="2.5" stroke-linecap="round"><path d="M138 168H226M138 180H218M138 192H228M138 204H206"/><path d="M256 204H340M256 214H326"/></g>
<rect x="250" y="160" width="102" height="34" rx="2" fill="#fde3e0"/>
