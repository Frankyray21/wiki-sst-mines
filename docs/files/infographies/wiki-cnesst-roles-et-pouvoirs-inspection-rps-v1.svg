<path d="M24 250H456" stroke="#6e7781" stroke-width="2.5"/>
<!-- Inspecteur (bleu) : planchette, loupe tendue vers le classeur (LSST, art. 179 : accès aux livres, registres et dossiers) -->
<path d="M74 191L94 170" stroke="#1565c0" stroke-width="8" stroke-linecap="round"/>
<path d="M94 170L104 160" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
<circle cx="113" cy="151" r="12.5" fill="#e1ecfa" stroke="#1565c0" stroke-width="4"/>
<g transform="translate(58 250) scale(1.5)"><circle cx="0" cy="-53" r="9" fill="#1565c0"/><path d="M-11 -24V-33Q-11 -42 -2.5 -42H2.5Q11 -42 11 -33V-24H8V0H1V-15H-1V0H-8V-24Z" fill="#1565c0"/><g transform="translate(0 -57)"><path d="M-10.5 3C-10.5 -5.5 -5.5 -10.5 0 -10.5C5.5 -10.5 10.5 -5.5 10.5 3Z" fill="#1565c0"/><rect x="-14" y="2" width="28" height="4.5" rx="2.25" fill="#1565c0"/></g><rect x="-7" y="-36" width="11" height="14" rx="1.5" fill="#fbfaf6"/><path d="M-4.5 -31H1.5M-4.5 -27H1.5" stroke="#1565c0" stroke-width="1.7"/></g>
