<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Trois rôles de la CNESST, entre l’employeur minier et le travailleur</title>
<desc id="d">Schéma en trois colonnes reliées par des flèches horizontales. En haut, à gauche, l’employeur minier, représenté par un chevalement de mine et son bâtiment ; au centre, la CNESST, un bâtiment public générique à colonnes, sans logo ; à droite, le travailleur casqué. De chacun descend une ligne pointillée. Les flèches bleues partent de la CNESST, les flèches noires vont du travailleur vers la CNESST ; un trait en tirets marque ce qui dépend d’une condition. Rangée Prévention (LSST) : trois flèches bleues vont de la CNESST à l’employeur : l’inspection, l’avis de correction (en tirets) et les outils et formations. Rangée Indemnisation (LATMP) : une flèche noire va du travailleur à la CNESST, la réclamation ; une double flèche bleue part de la CNESST vers l’employeur et le travailleur, la décision ; une flèche bleue en tirets va au travailleur : indemnités, soins, réadaptation. Rangée Normes du travail (LNT) : une flèche noire va du travailleur à la CNESST, la plainte de harcèlement ; une double flèche bleue part de la CNESST vers les deux, l’enquête ; dessous, une double flèche bleue en tirets : la médiation, avec l’accord des parties. Aucun délai ni montant.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
