<svg xmlns="http://www.w3.org/2000/svg" width="480" height="392" viewBox="0 0 480 392" role="img" aria-labelledby="t d" font-family="Figtree, 'Segoe UI', Arial, sans-serif"><title id="t">Diagramme d’Ishikawa</title><desc id="d">Titre : « Diagramme d’Ishikawa », sous-titre « Classer les causes possibles d’un effet par rubriques (6M) ». Figure sur fond noir. Une arête centrale mène à « Effet ». Six arêtes y aboutissent, une par rubrique : en haut, matériel (machines, équipements), méthode (tâches, procédures) et main-d’œuvre (comportements, formation) ; en bas, milieu (environnement), matière (intrants) et management (organisation). En bas : construction en équipe pluridisciplinaire, remue-méninges, classement consensuel par rubrique, puis priorisation.</desc><style>@font-face{font-family:'Figtree';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Figtree';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.8" y="0.8" width="478.5" height="390.5" rx="14" fill="#16181d" stroke="#2b3038" stroke-width="1.5"/><text x="240.0" y="32.0" font-weight="900" font-size="22" fill="#f2f6fa" text-anchor="middle">Diagramme d’Ishikawa</text><text x="240.0" y="56.0" font-weight="600" font-size="13" fill="#b6c2d1" text-anchor="middle">Classer les causes possibles d’un effet par rubriques (6M)</text><rect x="16.0" y="86.0" width="110.0" height="58.5" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="71.0" y="105.8" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Matériel</text><text x="71.0" y="122.4" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">machines,</text><text x="71.0" y="136.2" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">équipements</text><line x1="71.0" y1="144.5" x2="116.0" y2="200.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><rect x="132.0" y="86.0" width="110.0" height="44.7" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="187.0" y="105.8" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Méthode</text><text x="187.0" y="122.4" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">tâches, procédures</text><line x1="187.0" y1="130.7" x2="232.0" y2="200.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><rect x="248.0" y="86.0" width="110.0" height="58.5" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="303.0" y="105.8" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Main-d’œuvre</text><text x="303.0" y="122.4" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">comportements,</text><text x="303.0" y="136.2" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">formation</text><line x1="303.0" y1="144.5" x2="348.0" y2="200.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><rect x="16.0" y="270.0" width="110.0" height="44.7" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="71.0" y="289.8" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Milieu</text><text x="71.0" y="306.3" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">environnement</text><line x1="71.0" y1="270.0" x2="116.0" y2="200.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><rect x="132.0" y="270.0" width="110.0" height="44.7" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="187.0" y="289.8" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Matière</text><text x="187.0" y="306.3" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">intrants</text><line x1="187.0" y1="270.0" x2="232.0" y2="200.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><rect x="248.0" y="270.0" width="110.0" height="44.7" rx="10" fill="#1d2026" stroke="#3a404a" stroke-width="1.3"/><text x="303.0" y="289.8" font-weight="700" font-size="13.5" fill="#f2f6fa" text-anchor="middle">Management</text><text x="303.0" y="306.3" font-weight="500" font-size="11" fill="#b6c2d1" text-anchor="middle">organisation</text><line x1="303.0" y1="270.0" x2="348.0" y2="200.0" stroke="#8b939c" stroke-width="2" stroke-linecap="round"/><line x1="14.0" y1="200.0" x2="363.0" y2="200.0" stroke="#8b939c" stroke-width="3" stroke-linecap="round"/><polygon points="372.0,200.0 362.3,205.2 362.3,194.8" fill="#8b939c"/><rect x="376.0" y="182.0" width="90.0" height="33.5" rx="10" fill="#23262d" stroke="#b6c2d1" stroke-width="1.3"/><text x="421.0" y="204.3" font-weight="700" font-size="14" fill="#f2f6fa" text-anchor="middle">Effet</text><rect x="14.0" y="332.0" width="452.0" height="46.0" rx="10" fill="#23262d" stroke="#3a404a" stroke-width="1.3"/><text x="26" y="351.0" font-size="12.5"><tspan font-weight="800" fill="#f2f6fa">Construction</tspan><tspan font-weight="500" fill="#b6c2d1"> — équipe pluridisciplinaire, remue-méninges, classement</tspan></text><text x="26.0" y="367.0" font-weight="500" font-size="12.5" fill="#b6c2d1">consensuel par rubrique, puis priorisation.</text></svg>