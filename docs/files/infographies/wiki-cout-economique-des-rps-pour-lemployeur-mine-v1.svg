<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Remplacer en mine : particularités du minier</title>
<desc id="d">Titre : Remplacer en mine, particularités du minier. Deux panneaux rouges. En haut, « Recruter », pénurie de main-d’œuvre : recrutement coûteux ; cycles FIFO et logistique. À droite, la silhouette en tirets d’un remplaçant à trouver et un point d’interrogation rouge ; une flèche mène à un avion, une autre à un bâtiment de camp (étiquette « transport, hébergement »). En bas, « Poste », critique pour la production : compétences spécialisées ; difficile à remplacer rapidement. À droite, un jumbo de forage dont le siège, sous le toit de protection, est vide et rouge (étiquette « jumbo de forage »). Accolade bleue et message : coût de remplacement élevé. Note : schéma de principe, ni montant ni durée.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="42" font-size="32" fill="#0b2545" font-weight="800">Remplacer</text>
<text x="24" y="78" font-size="32" fill="#0b2545" font-weight="800">en mine</text>
<text x="456" y="62" font-size="18" fill="#4b535c" text-anchor="end">Particularités</text>
<text x="456" y="84" font-size="18" fill="#4b535c" text-anchor="end">du minier</text>
