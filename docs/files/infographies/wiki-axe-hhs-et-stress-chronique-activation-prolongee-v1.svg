<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Une activation qui ne s’arrête plus : l’axe HHS en stress chronique</title>
<desc id="d">Une activation qui ne s’arrête plus : elle peut durer des mois ou des années. Le même buste de mineur casqué, mais tout le circuit est rouge. L’hypothalamus, l’hypophyse et les surrénales sont en rouge : axe HHS dérégulé. Le cortisol, en points rouges nombreux, reste élevé, maintenu. Depuis les surrénales, une flèche rouge monte vers le cœur, dans la poitrine : réaction cardiovasculaire, avec hypertension, inflammation et dysfonction endothéliale. Une flèche descend de ces trois mots vers la dernière étiquette : excès de risque de maladie coronarienne. En bas : le travailleur paraît fonctionnel, mais la dette physiologique s’accumule. Aucun chiffre dans le dessin, aucune durée à l’échelle.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
<defs>
<marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c62828"/></marker>
</defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Une activation</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">qui ne s’arrête plus</text>
<text x="24" y="108" font-size="19" fill="#4b535c">Elle peut durer des mois ou des années</text>
