<path d="M295 314L305 300L315 314Z" fill="#c62828"/>
<path d="M395 390V312" stroke="#c62828" stroke-width="4" stroke-linecap="round" fill="none"/>
<path d="M385 314L395 300L405 314Z" fill="#c62828"/>
<path d="M330 188H265.0V416H435.0V188H370" stroke="#4b535c" stroke-width="5" stroke-linejoin="round" fill="none"/>
<path d="M330 188V168H321M370 188V168H379" stroke="#4b535c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g>
<path d="M24 420H456" stroke="#6e7781" stroke-width="3" stroke-linecap="round"/>
<text x="130" y="454" font-size="19" fill="#1f2328" text-anchor="middle">tend à s’accumuler</text>
<text x="130" y="482" font-size="22" font-weight="700" fill="#c62828" text-anchor="middle">au fond</text>
<text x="130" y="508" font-size="19" fill="#4b535c" text-anchor="middle">ex. : toluène</text>
<text x="350" y="454" font-size="19" fill="#1f2328" text-anchor="middle">tend à s’accumuler</text>
<text x="350" y="482" font-size="22" font-weight="700" fill="#c62828" text-anchor="middle">en haut</text>
<text x="24" y="548" font-size="19" fill="#4b535c" text-anchor="start">Une tendance, pas des couches étanches.</text>
</g>
