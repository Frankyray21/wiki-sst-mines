<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="572" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 572" role="img" aria-labelledby="t d">
<title id="t">Où un gaz tend à s’accumuler dans un espace clos</title>
<desc id="d">Coupe de deux réservoirs ouverts par un trou d’homme au toit. À gauche, densité de vapeur supérieure à 1 (plus lourd que l’air, exemple : toluène) : les points rouges se resserrent au fond, des flèches pointent vers le bas et le gaz tend à s’accumuler au fond. À droite, densité inférieure à 1 (plus léger que l’air) : les points se resserrent sous le toit, des flèches pointent vers le haut et le gaz tend à s’accumuler en haut. Des points restent présents partout : une tendance, pas des couches étanches.</desc>
<defs>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#fde3e0"/></linearGradient>
<linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde3e0"/><stop offset="1" stop-color="#fbfaf6"/></linearGradient>
</defs>
<rect width="480" height="572" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328" text-anchor="start">Où un gaz tend à s’accumuler</text>
<text x="24" y="78" font-size="19" fill="#4b535c" text-anchor="start">Densité de vapeur par rapport à l’air</text>
<text x="130" y="118" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">Densité &gt; 1</text>
<text x="130" y="143" font-size="19" fill="#4b535c" text-anchor="middle">plus lourd que l’air</text>
<text x="350" y="118" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">Densité &lt; 1</text>
<text x="350" y="143" font-size="19" fill="#4b535c" text-anchor="middle">plus léger que l’air</text>
<!-- Cas 1 : vapeur plus lourde que l’air (points plus serrés au fond) -->
<g><rect x="45.0" y="188" width="170" height="228" fill="url(#gl)"/>
<g fill="#c62828"><circle cx="202.3" cy="405.4" r="4"/><circle cx="182.0" cy="404.8" r="4"/><circle cx="167.0" cy="405.5" r="4"/><circle cx="151.4" cy="405.1" r="4"/><circle cx="131.2" cy="406.8" r="4"/><circle cx="116.9" cy="403.8" r="4"/><circle cx="99.5" cy="406.9" r="4"/><circle cx="78.3" cy="402.3" r="4"/><circle cx="59.1" cy="407.8" r="4"/><circle cx="174.8" cy="388.7" r="4"/><circle cx="160.3" cy="385.1" r="4"/><circle cx="140.6" cy="385.4" r="4"/><circle cx="125.1" cy="386.5" r="4"/><circle cx="108.6" cy="387.8" r="4"/><circle cx="88.6" cy="390.1" r="4"/><circle cx="201.9" cy="371.8" r="4"/><circle cx="184.5" cy="372.0" r="4"/><circle cx="149.8" cy="369.7" r="4"/><circle cx="129.0" cy="374.0" r="4"/><circle cx="112.5" cy="372.2" r="4"/><circle cx="98.1" cy="369.4" r="4"/><circle cx="63.3" cy="368.4" r="4"/><circle cx="174.2" cy="353.4" r="4"/><circle cx="156.2" cy="353.3" r="4"/><circle cx="138.0" cy="356.1" r="4"/><circle cx="108.7" cy="352.3" r="4"/><circle cx="85.8" cy="353.8" r="4"/><circle cx="199.1" cy="336.4" r="4"/><circle cx="187.1" cy="337.8" r="4"/><circle cx="147.8" cy="335.6" r="4"/><circle cx="117.0" cy="336.0" r="4"/><circle cx="94.2" cy="338.5" r="4"/><circle cx="64.3" cy="335.5" r="4"/><circle cx="195.6" cy="317.4" r="4"/><circle cx="156.5" cy="318.1" r="4"/><circle cx="122.9" cy="319.7" r="4"/><circle cx="90.1" cy="321.4" r="4"/><circle cx="134.3" cy="302.5" r="4"/><circle cx="98.7" cy="301.6" r="4"/><circle cx="59.2" cy="304.8" r="4"/><circle cx="194.4" cy="288.3" r="4"/><circle cx="142.5" cy="285.4" r="4"/><circle cx="103.6" cy="286.9" r="4"/><circle cx="133.7" cy="267.5" r="4"/><circle cx="194.5" cy="249.4" r="4"/><circle cx="143.2" cy="252.5" r="4"/><circle cx="111.7" cy="234.9" r="4"/><circle cx="140.3" cy="220.2" r="4"/><circle cx="203.9" cy="198.9" r="4"/><circle cx="112.0" cy="202.9" r="4"/></g>
