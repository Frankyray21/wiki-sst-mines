<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Qui verse le revenu, et quand</title>
<desc id="d">Frise du temps non proportionnelle aux durées, en trois périodes, avec deux couloirs : l’employeur en haut, la CNESST en bas. Jour où débute l’incapacité : l’employeur verse le salaire net pour le reste de la journée prévue (art. 59). Les 14 jours complets suivants : l’employeur verse 90 % du salaire net pour les jours de travail prévus (art. 60) ; une flèche bleue monte du couloir de la CNESST vers ce versement : la CNESST rembourse l’employeur. À compter du 15e jour complet : la CNESST verse l’indemnité de remplacement du revenu (art. 124), en barre bleue qui se prolonge. En bas, une note : si aucun employeur n’est tenu de verser le salaire de l’art. 60, la CNESST verse l’indemnité pendant ces 14 jours (art. 124).</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="46" font-size="26" font-weight="700" fill="#1f2328">Qui verse le revenu,</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#1f2328">et quand</text>
<text x="24" y="110" font-size="19" fill="#4b535c">Frise non proportionnelle aux durées</text>

<!-- Périodes -->
<g font-size="19" fill="#1f2328" text-anchor="middle">
<text x="79" y="146">jour où</text>
<text x="79" y="170">débute</text>
<text x="79" y="194">l’incapacité</text>
<text x="199" y="146">les 14 jours</text>
<text x="199" y="170">complets</text>
<text x="199" y="194">suivants</text>
<text x="363" y="170">à compter du</text>
<text x="363" y="194">15e jour complet</text>
</g>

<!-- Axe du temps -->
<path d="M24 212H440" stroke="#1f2328" stroke-width="3" fill="none"/>
<path d="M456 212L440 204V220Z" fill="#1f2328"/>
<path d="M25.5 203V221M128 203V221M270 203V221" stroke="#1f2328" stroke-width="3" fill="none"/>

<!-- Couloir de l’employeur -->
<text x="24" y="248" font-size="20" font-weight="700" fill="#1f2328">Employeur</text>
<rect x="24" y="258" width="100" height="174" rx="8" fill="#eceef0" stroke="#6e7781" stroke-width="2.5"/>
<rect x="132" y="258" width="134" height="174" rx="8" fill="#eceef0" stroke="#6e7781" stroke-width="2.5"/>
<g font-size="19" fill="#1f2328" text-anchor="middle">
<text x="74" y="283" font-weight="700">salaire</text>
<text x="74" y="306" font-weight="700">net</text>
<text x="74" y="330">reste</text>
<text x="74" y="353">de la</text>
<text x="74" y="376">journée</text>
<text x="74" y="399">prévue</text>
<text x="74" y="422" fill="#4b535c">art. 59</text>
<text x="199" y="283" font-weight="700">90 % du</text>
<text x="199" y="306" font-weight="700">salaire net</text>
<text x="199" y="341">jours de</text>
<text x="199" y="364">travail</text>
<text x="199" y="387">prévus</text>
<text x="199" y="422" fill="#4b535c">art. 60</text>
</g>

<!-- Couloir de la CNESST -->
<text x="24" y="472" font-size="20" font-weight="700" fill="#1565c0">CNESST</text>
<!-- Remboursement de l’employeur, pour les 14 jours -->
<path d="M199 494V452" stroke="#1565c0" stroke-width="3.5" fill="none"/>
<path d="M189 454L199 438L209 454Z" fill="#1565c0"/>
<text x="199" y="518" font-size="19" font-weight="700" fill="#1565c0" text-anchor="middle">rembourse</text>
<text x="199" y="541" font-size="19" fill="#1565c0" text-anchor="middle">l’employeur</text>
<!-- Indemnité de remplacement du revenu, qui se prolonge -->
<path d="M274 448H440L456 500L440 552H274Z" fill="#e1ecfa" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round"/>
<g font-size="19" fill="#1f2328" text-anchor="middle">
<text x="360" y="474" font-weight="700">indemnité de</text>
<text x="360" y="497" font-weight="700">remplacement</text>
<text x="360" y="520" font-weight="700">du revenu</text>
<text x="360" y="544" fill="#4b535c">art. 124</text>
</g>

<path d="M24 566H456" stroke="#eceef0" stroke-width="2.5"/>
<!-- Cas où aucun employeur n’est tenu de verser le salaire de l’art. 60 -->
<g font-size="19" fill="#4b535c">
<text x="24" y="588">Si aucun employeur n’est tenu de verser</text>
<text x="24" y="612">le salaire de l’art. 60, la CNESST verse</text>
<text x="24" y="636">l’indemnité pendant ces 14 jours (art. 124).</text>
</g>
</g>
</svg>
