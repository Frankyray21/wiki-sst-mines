<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Ce qui pèse sur l’aide-foreur : profil RPS structurel</title>
<desc id="d">Deux panneaux rouges : ce qui pèse sur l’aide-foreur. En haut, pastille « Poste », bandeau « Cadence imposée » : à gauche, trois phrases, équipement lourd ; postures contraignantes ; poste d’entrée, parfois précaire. À droite, l’aide-foreur, debout, de face, tient à deux mains une tige de forage sur laquelle appuient deux flèches rouges ; à côté, la foreuse sur chenilles, avec une flèche circulaire rouge près de la tête de rotation. En bas, pastille « Relation », bandeau « Dépendance forte » : tâches dictées par le foreur ou par procédures ; soutien : dépend de la relation ; mérite attribué au foreur. À droite, le foreur tend le bras et une flèche rouge va de lui vers l’aide-foreur ; une étoile pleine près de la tête du foreur, une étoile vide en pointillé rouge près de celle de l’aide-foreur ; étiquettes FOREUR et AIDE-FOREUR. Sous une accolade bleue, le message clé : Vulnérabilité particulière : la dépendance à la relation. Aucun chiffre.</desc>
