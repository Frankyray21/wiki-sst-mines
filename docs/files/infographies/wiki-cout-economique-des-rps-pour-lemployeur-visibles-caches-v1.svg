<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="t d">
<title id="t">Ce que coûtent les RPS : coûts visibles et cachés</title>
<desc id="d">Titre : Ce que coûtent les RPS, coût économique pour l’employeur. Deux panneaux rouges. En haut, « Visibles », dans l’estimation par cas : indemnités ; hausse de cotisation CNESST ; remplacement, recrutement. À droite, un remplaçant tend le bras vers la place vide, en tirets, d’un absent (étiquette « absence ») ; sur la flèche, un dollar rouge. En bas, un panneau à bordure en tirets, « Cachés », « Souvent oubliés dans les évaluations » : présentéisme ; compétences qui partent ; heures consacrées au cas. À droite, une flèche va de la place vide d’un absent à la caisse rouge qu’un collègue porte en plus de la sienne (étiquette « charge sur les collègues »). Le rouge marque les coûts, pas les personnes. Accolade bleue et message : les RPS coûtent cher. Schéma de principe : ni montant ni proportion.</desc>
<rect width="480" height="660" fill="#fbfaf6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif">
<text x="24" y="42" font-size="32" fill="#0b2545" font-weight="800">Ce que coûtent</text>
<text x="24" y="78" font-size="32" fill="#0b2545" font-weight="800">les RPS</text>
<text x="456" y="62" font-size="18" fill="#4b535c" text-anchor="end">Coût économique</text>
<text x="456" y="84" font-size="18" fill="#4b535c" text-anchor="end">pour l’employeur</text>
